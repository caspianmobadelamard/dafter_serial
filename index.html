  const form = document.getElementById('newForm');
  const cat = CATEGORIES[currentCat];
  form.innerHTML = cat.fields.map(f => fieldRowHTML(f, 'new')).join('');

  const productEl = document.getElementById('new_product');
  if (productEl && !document.getElementById('new_count')) {
    productEl.parentNode.insertAdjacentHTML('afterend', `
      <label for="new_count">تعداد دستگاه</label>
      <input type="number" id="new_count" min="1" value="1" step="1">
      <div class="hint-sm" id="countHint">
        اگه بیشتر از ۱ باشه، ردیف جدا با سریال متوالی ثبت می‌شه.
      </div>`);
  }

  const capInput = document.getElementById('new_capacity');
  if (capInput) {
    const units = getCapacityUnits('');
    capacityUnitCache['new_capacity'] = units[0];
    const btn = document.getElementById('unitBtn_new_capacity');
    if (btn) btn.textContent = units[0] + ' ▾';
  }
  const pressBtn = document.getElementById('pressureUnitBtn_new_pressure');
  if (pressBtn) {
    pressureUnitCache['new_pressure'] = 'بار';
    pressBtn.textContent = 'بار ▾';
  }

  await Promise.all([autofillSerial(false), loadCustomers()]);
  updateCountHint();
}

async function autofillSerial(force) {
  const el = document.getElementById('new_serial');
  if (!el || el.disabled) return;
  if (!force && el.value && el.value.trim()) return;
  if (!isUrlConfigured()) return;
  try {
    const r = await callApi({ action: 'getNextSerial', category: currentCat });
    if (r.ok && r.serial) { el.value = r.serial; el.placeholder = ''; }
    else if (r.ok && r.lastSerial) { el.value = ''; el.placeholder = 'آخرین: ' + r.lastSerial; }
    updateCountHint();
  } catch (e) {}
}

async function refreshSerial() {
  const el = document.getElementById('new_serial');
  if (el) el.value = '';
  await autofillSerial(true);
}

function updateCountHint() {
  const countEl = document.getElementById('new_count');
  const hintEl = document.getElementById('countHint');
  const serialEl = document.getElementById('new_serial');
  if (!countEl || !hintEl) return;
  const count = Math.max(1, parseInt(countEl.value, 10) || 1);
  const serial = (serialEl && serialEl.value.trim()) || '';
  if (count > 1 && serial) {
    const m = serial.match(/^(.*?)(\d+)\s*$/);
    if (m) {
      const last = m[1] + String(parseInt(m[2],10) + count - 1).padStart(m[2].length, '0');
      hintEl.textContent = '✅ ' + serial + ' تا ' + last + ' (' + count + ' ردیف)';
      hintEl.style.color = 'var(--accent)';
      return;
    }
  }
  hintEl.textContent = 'اگه بیشتر از ۱ باشه، ردیف جدا با سریال متوالی ثبت می‌شه.';
  hintEl.style.color = '';
}

// ============================================================
// ثبت سفارش — فقط چک «حداقل یه فیلد پر باشه»
// ============================================================
async function submitNewOrder() {
  const cat = CATEGORIES[currentCat];
  const data = {};
  cat.fields.forEach(f => {
    const el = document.getElementById('new_' + f.key);
    if (el && el.disabled) return;
    const val = el ? el.value.trim() : '';
    data[f.key] = val;
  });
  if (data.capacity) {
    const unit = capacityUnitCache['new_capacity'] || '';
    data.capacity = data.capacity + (unit ? ' ' + unit : '');
  }
  if (data.pressure) {
    const unit = pressureUnitCache['new_pressure'] || 'بار';
    data.pressure = data.pressure + ' ' + unit;
  }

  // چک: حداقل یه فیلد باید پر باشه
  const allEmpty = Object.keys(data).every(k => {
    if (k === 'status') return true; // وضعیت پیش‌فرض داره
    return !data[k] || String(data[k]).trim() === '';
  });
  if (allEmpty) {
    showToast('حداقل یه فیلد رو پر کن', 'err');
    return;
  }

  // چک سریال تکراری فقط اگه سریال پر باشه
  if (data.serial && !isWaterHeater(data.product)) {
    const dup = await checkDuplicate(data.serial);
    if (dup.exists) { showToast('⚠️ سریال «' + data.serial + '» قبلاً ثبت شده', 'err'); return; }
  }

  const count = Math.max(1, parseInt(document.getElementById('new_count').value, 10) || 1);
  const btn = document.getElementById('newSubmitBtn');
  btn.disabled = true;
  btn.textContent = count > 1 ? 'در حال ثبت ' + count + ' ردیف...' : 'در حال ثبت...';
  try {
    const r = await callApi({ action: 'addOrder', category: currentCat, data, count });
    if (r.ok) {
      showToast(r.count > 1 ? r.count + ' سفارش ثبت شد' : '✅ سفارش ثبت شد', 'ok');
      clearNewForm();
    } else {
      showToast('خطا: ' + (r.error || 'نامشخص'), 'err');
    }
  } catch (e) { showToast('خطا: ' + e.message, 'err'); }
  btn.disabled = false;
  btn.textContent = 'ثبت سفارش';
}

function clearNewForm() {
  const cat = CATEGORIES[currentCat];
  cat.fields.forEach(f => {
    if (f.key === 'serial') return;
    if (f.type === 'group') {
      const hidden = document.getElementById('new_group');
      if (hidden) hidden.value = 'مخازن';
      const group = document.getElementById('group_new_group');
      if (group) group.querySelectorAll('.neon-radio').forEach((x, i) => x.classList.toggle('selected', i === 0));
      return;
    }
    const el = document.getElementById('new_' + f.key);
    if (el) {
      if (el.tagName === 'SELECT') el.selectedIndex = 0;
      else if (!el.disabled) el.value = '';
    }
  });
  document.getElementById('new_count').value = '1';
  const serial = document.getElementById('new_serial');
  if (serial && !serial.disabled) autofillSerial(true);
  updateCountHint();
}

async function checkDuplicate(serial) {
  if (!serial || !serial.trim()) return { exists: false };
  try { return await callApi({ action: 'checkDuplicateSerial', category: currentCat, serial }); }
  catch (e) { return { exists: false }; }
}

async function loadCustomers() {
  if (!isUrlConfigured()) return;
  try {
    const r = await callApi({ action: 'getDistinctCustomers', category: currentCat });
    if (r.ok) {
      customersCache = r.customers || [];
      const fs = document.getElementById('filterCustomer');
      if (fs) fs.innerHTML = '<option value="">همه</option>' + customersCache.map(c => `<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join('');
    }
  } catch (e) {}
}

async function loadItems(silent) {
  const listEl = document.getElementById('pendingList');
  if (!isUrlConfigured()) { listEl.innerHTML = '<div class="empty-state">لینک اتصال تنظیم نشده</div>'; return; }
  if (!silent) listEl.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  try {
    const r = await callApi({ action: 'listAll', category: currentCat });
    if (!r.ok) { listEl.innerHTML = '<div class="empty-state">خطا: ' + r.error + '</div>'; return; }
    const newItems = r.items || [];
    const newHash = JSON.stringify(newItems.map(it => it.row + ':' + JSON.stringify(it.data)));
    if (silent && lastFetchHash && newHash !== lastFetchHash) {
      showToast('🔄 داده‌های جدید از سرور دریافت شد', 'ok');
    }
    lastFetchHash = newHash;
    allItems = newItems;
    updateTabCounts();
    renderList();
  } catch (e) { if (!silent) listEl.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}

function updateTabCounts() {
  document.getElementById('tabCountPending').textContent = toFa(allItems.length);
  document.getElementById('tabCountNew').textContent = toFa(allItems.length);
  const pending = allItems.filter(it => (it.emptyKeys || []).length > 0).length;
  document.getElementById('tabCountDash').textContent = toFa(pending);
}

function normalizeText(s) {
  if (!s) return '';
  return String(s).replace(/[\u200c\u200d\u200e\u200f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}

function getFilteredItems() {
  const q = normalizeText(searchTerm);
  let items = allItems.slice();
  if (onlyPending) items = items.filter(it => (it.emptyKeys || []).length > 0);
  if (filterStatus) items = items.filter(it => String(it.data.status || '').trim() === filterStatus);
  if (filterInspection) items = items.filter(it => String(it.data.inspectionCo || '').trim().toUpperCase() === filterInspection);
  if (filterCustomer) items = items.filter(it => String(it.data.customer || '').trim() === filterCustomer);
  if (q) items = items.filter(it => {
    const hay = normalizeText([it.data.serial, it.data.product, it.data.customer, it.data.group, it.data.inspectionCode, it.data.inspectionCo].join(' | '));
    return hay.indexOf(q) !== -1;
  });
  return items;
}

function getProgress(item) {
  const cat = CATEGORIES[currentCat];
  const keys = cat.fields.filter(f => f.key !== 'status').map(f => f.key);
  let filled = 0;
  keys.forEach(k => { if (item.data[k] && String(item.data[k]).trim() !== '') filled++; });
  return Math.round((filled / keys.length) * 100);
}

function getTimelineSteps(item) {
  const d = item.data;
  return [
    { label: 'سفارش', done: !!(d.orderDate && String(d.orderDate).trim()) },
    { label: 'ساخت', done: d.status === 'ساخته شده' || d.status === 'در حال ساخت', active: d.status === 'در حال ساخت' },
    { label: 'تست', done: !!(d.hydroDate && String(d.hydroDate).trim()) },
    { label: 'بازرسی', done: !!(d.inspectionCode && String(d.inspectionCode).trim()) },
    { label: 'بارگیری', done: !!(d.loadDate && String(d.loadDate).trim()) }
  ];
}

function renderList() {
  const listEl = document.getElementById('pendingList');
  const items = getFilteredItems();
  if (items.length === 0) { listEl.innerHTML = '<div class="empty-state">چیزی پیدا نشد</div>'; return; }

  listEl.innerHTML = '';
  items.forEach(item => {
    const d = item.data;
    const progress = getProgress(item);
    const status = String(d.status || '').trim() || 'نامشخص';
    const pillClass = STATUS_PILL_CLASS[status] || 'not-made';
    const co = String(d.inspectionCo || '').trim().toUpperCase();
    const coBadge = co ? `<span class="co-badge ${co === 'ISQI' ? 'isqi' : 'ajg'}">${co}</span>` : '';
    const colorIdx = customerColorIndex(d.customer);
    const cardClass = 'customer-' + CUSTOMER_COLORS[colorIdx];

    const timeline = getTimelineSteps(item).map(s =>
      `<div class="timeline-step ${s.done ? 'done' : (s.active ? 'active' : '')}">
        <div class="timeline-dot">${s.done ? '<svg viewBox="0 0 12 12"><polyline points="2 6 5 9 10 3"/></svg>' : ''}</div>
        <div class="timeline-label">${s.label}</div>
      </div>`
    ).join('');

    const meta = [];
    if (d.capacity) meta.push(`<span><span class="label">ظرفیت:</span> <span class="value">${d.capacity}</span></span>`);
    if (d.pressure) meta.push(`<span><span class="label">فشار:</span> <span class="value">${d.pressure}</span></span>`);
    const custTag = d.customer ? `<span class="customer-tag ${CUSTOMER_COLORS[colorIdx]}">مشتری: ${d.customer}</span>` : '';
    const stdTag = d.standard ? `<span class="customer-tag">${d.standard}</span>` : '';
    const grpTag = d.group ? `<span class="customer-tag">${d.group}</span>` : '';

    const card = document.createElement('div');
    card.className = 'order-card ' + cardClass;
    card.innerHTML = `
      <div class="card-head">
        <div class="serial">${d.serial || '(بدون سریال)'} ${coBadge}</div>
        <span class="status-pill ${pillClass}">${status}</span>
      </div>
      <div class="card-body">
        <div class="product">${d.product || ''}</div>
        <div class="meta-row">${meta.join('')}</div>
        <div class="meta-row">${custTag} ${stdTag} ${grpTag}</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%;"></div></div>
        <div class="progress-pct">${toFa(progress)}٪</div>
      </div>
      <div class="timeline">${timeline}</div>
      <div class="card-actions">
        <button onclick="event.stopPropagation();openModal(${item.row})">✎ ویرایش</button>
        <button onclick="event.stopPropagation();copyItemToForm(${item.row})">📋 کپی</button>
      </div>`;
    card.onclick = () => openModal(item.row);
    listEl.appendChild(card);
  });
}

function findItemByRow(row) {
  return allItems.find(it => it.row === row);
}

async function openModal(row) {
  const item = findItemByRow(row);
  if (!item) return;
  const serial = String(item.data.serial || '').trim();
  if (serial) {
    try {
      const lockCheck = await callApi({ action: 'checkLock', category: currentCat, serial });
      if (lockCheck.ok && lockCheck.locked && lockCheck.lockedBy && lockCheck.lockedBy !== getUserName()) {
        if (!confirm('⚠️ این رکورد توسط «' + lockCheck.lockedBy + '» در حال ویرایش است. ادامه می‌دی؟')) return;
      }
      const lockRes = await callApi({ action: 'lockRecord', category: currentCat, serial });
      if (lockRes.ok && lockRes.locked && lockRes.lockedBy !== getUserName()) {
        showToast('🔒 این رکورد توسط «' + lockRes.lockedBy + '» قفل شده', 'warn');
        return;
      }
    } catch (e) {}
  }

  currentModalItem = item;
  document.getElementById('modalTitle').textContent = item.data.serial || '(بدون سریال)';
  const sub = [];
  if (item.data.product) sub.push(item.data.product);
  if (item.data.capacity) sub.push('ظرفیت: ' + item.data.capacity);
  if (item.data.pressure) sub.push('فشار: ' + item.data.pressure);
  document.getElementById('modalSub').innerHTML = sub.join(' • ');
  renderModalFields();
  document.getElementById('modalMsg').className = 'msg';
  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('modalSaveBtn').onclick = saveModal;
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('show');
  if (currentModalItem) {
    const serial = String(currentModalItem.data.serial || '').trim();
    if (serial) callApi({ action: 'unlockRecord', category: currentCat, serial }).catch(() => {});
  }
  currentModalItem = null;
}

function renderModalFields() {
  const cat = CATEGORIES[currentCat];
  const item = currentModalItem;
  const fieldsEl = document.getElementById('modalFields');
  const viewBar = document.getElementById('modalViewBar');

  viewBar.innerHTML = `<div class="modal-view-bar"><div class="label">همه فیلدها قابل ویرایش — مقادیر خالی هم ذخیره می‌شن</div></div>`;

  fieldsEl.innerHTML = cat.fields.map(f => {
    let html = fieldRowHTML(f, 'modal');
    const oldVal = item.data[f.key];
    const id = 'modal_' + f.key;
    if (oldVal !== undefined && oldVal !== null && String(oldVal).trim() !== '') {
      if (f.type === 'standard' || f.type === 'inspection' || f.key === 'status') {
        html = html.replace(`<select id="${id}">`, `<select id="${id}" data-select-val="${String(oldVal).replace(/"/g,'&quot;')}">`);
      } else if (f.type === 'group') {
        html = html.replace(`<input type="hidden" id="${id}" value="مخازن">`, `<input type="hidden" id="${id}" value="${String(oldVal).replace(/"/g,'&quot;')}">`);
      } else {
        html = html.replace(`id="${id}"`, `id="${id}" data-prefill="${String(oldVal).replace(/"/g,'&quot;').replace(/&/g,'&amp;')}"`);
      }
    }
    return html;
  }).join('');

  requestAnimationFrame(() => {
    cat.fields.forEach(f => {
      const el = document.getElementById('modal_' + f.key);
      if (!el) return;
      if (el.dataset.prefill) el.value = el.dataset.prefill;
      if (el.dataset.selectVal) {
        const target = el.dataset.selectVal.trim();
        let found = false;
        for (let i = 0; i < el.options.length; i++) {
          if (el.options[i].value.trim() === target) { el.selectedIndex = i; found = true; break; }
        }
        if (!found && target) {
          const opt = document.createElement('option');
          opt.value = target; opt.textContent = target + ' (قبلی)';
          el.appendChild(opt); el.value = target;
        }
      }
      if (f.type === 'capacity') {
        const oldCap = String(item.data.capacity || '').trim();
        const m = oldCap.match(/\s+([^\d]+)$/);
        const unit = m ? m[1].trim() : '';
        const btn = document.getElementById('unitBtn_modal_capacity');
        if (btn) {
          const units = getCapacityUnits(item.data.product);
          capacityUnitCache['modal_capacity'] = unit || units[0];
          btn.textContent = (unit || units[0]) + ' ▾';
          if (el.value) el.value = el.value.replace(/\s+[^\d]+$/, '');
        }
      }
      if (f.type === 'pressure') {
        const oldP = String(item.data.pressure || '').trim();
        const m = oldP.match(/\s+(بار|psi)\s*$/i);
        const unit = m ? m[1] : 'بار';
        const btn = document.getElementById('pressureUnitBtn_modal_pressure');
        if (btn) {
          pressureUnitCache['modal_pressure'] = unit;
          btn.textContent = unit + ' ▾';
          if (el.value) el.value = el.value.replace(/\s+(بار|psi)\s*$/i, '');
        }
      }
      if (f.type === 'group') {
        const hidden = document.getElementById('modal_group');
        if (hidden) {
          const val = hidden.value;
          const grp = document.getElementById('group_modal_group');
          if (grp) grp.querySelectorAll('.neon-radio').forEach(x => x.classList.toggle('selected', x.dataset.val === val));
        }
      }
    });
  });
}

async function saveModal() {
  const item = currentModalItem;
  if (!item) return;
  const cat = CATEGORIES[currentCat];
  const data = {};
  cat.fields.forEach(f => {
    const el = document.getElementById('modal_' + f.key);
    if (!el) return;
    let v = String(el.value || '').trim();
    if (f.type === 'capacity' && v) {
      const unit = capacityUnitCache['modal_capacity'] || '';
      v = v + (unit ? ' ' + unit : '');
    }
    if (f.type === 'pressure' && v) {
      const unit = pressureUnitCache['modal_pressure'] || 'بار';
      v = v + ' ' + unit;
    }
    data[f.key] = v;
  });

  const btn = document.getElementById('modalSaveBtn');
  btn.disabled = true;
  btn.textContent = 'در حال ذخیره...';
  try {
    const r = await callApi({ action: 'updatePending', category: currentCat, row: item.row, data });
    if (r.ok) {
      showToast('✅ ذخیره شد', 'ok');
      pendingUndo = { row: item.row, oldData: Object.assign({}, item.data) };
      showUndo('ویرایش سریال ' + (item.data.serial || ''));
      setTimeout(() => { closeModal(); loadItems(); }, 500);
    } else {
      showToast('خطا: ' + (r.error || 'نامشخص'), 'err');
    }
  } catch (e) { showToast('خطا: ' + e.message, 'err'); }
  btn.disabled = false;
  btn.textContent = 'ذخیره';
}

function showUndo(text) {
  const bar = document.getElementById('undoBar');
  document.getElementById('undoText').textContent = text;
  bar.classList.add('show');
  clearTimeout(bar._timer);
  bar._timer = setTimeout(() => bar.classList.remove('show'), 10000);
}
document.getElementById('undoBtn').onclick = async () => {
  if (!pendingUndo) return;
  try {
    const r = await callApi({ action: 'updatePending', category: currentCat, row: pendingUndo.row, data: pendingUndo.oldData });
    if (r.ok) { showToast('✅ بازگردانی شد', 'ok'); loadItems(); }
  } catch (e) {}
  pendingUndo = null;
  document.getElementById('undoBar').classList.remove('show');
};

async function openCopyModal() {
  const listEl = document.getElementById('copyList');
  listEl.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  document.getElementById('copyBackdrop').classList.add('show');
  try {
    const r = await callApi({ action: 'getRecentOrders', category: currentCat });
    if (!r.ok) { listEl.innerHTML = '<div class="empty-state">خطا</div>'; return; }
    if (!r.items || r.items.length === 0) { listEl.innerHTML = '<div class="empty-state">سفارشی نیست</div>'; return; }
    listEl.innerHTML = '';
    r.items.slice(0, 30).forEach(item => {
      const d = document.createElement('div');
      d.className = 'picker-item';
      d.style.marginBottom = '6px';
      d.innerHTML = `<div style="font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace;">${item.data.serial || ''}</div>
        <div style="font-size:0.8em;color:var(--text-mid);margin-top:4px;">${item.data.product || ''}</div>
        <div style="font-size:0.77em;color:var(--text-dim);margin-top:2px;">${item.data.customer || ''}</div>`;
      d.onclick = () => { closeCopy(); copyItemToForm(item.row); };
      listEl.appendChild(d);
    });
  } catch (e) { listEl.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}
function closeCopy() { document.getElementById('copyBackdrop').classList.remove('show'); }

function copyItemToForm(row) {
  const item = findItemByRow(row);
  if (!item) return;
  switchTab('new');
  setTimeout(() => {
    const cat = CATEGORIES[currentCat];
    cat.fields.forEach(f => {
      if (f.key === 'serial' || f.key === 'status') return;
      const el = document.getElementById('new_' + f.key);
      if (!el || !item.data[f.key]) return;
      if (f.type === 'group') {
        const hidden = document.getElementById('new_group');
        if (hidden) hidden.value = item.data[f.key];
        const grp = document.getElementById('group_new_group');
        if (grp) grp.querySelectorAll('.neon-radio').forEach(x => x.classList.toggle('selected', x.dataset.val === item.data[f.key]));
        return;
      }
      if (f.type === 'capacity' || f.type === 'pressure') {
        const oldVal = String(item.data[f.key]).trim();
        const m = oldVal.match(/^([\d./]+)\s+(.+)$/);
        if (m) {
          if (el) el.value = m[1];
          if (f.type === 'capacity') {
            capacityUnitCache['new_capacity'] = m[2];
            const btn = document.getElementById('unitBtn_new_capacity');
            if (btn) btn.textContent = m[2] + ' ▾';
          } else {
            pressureUnitCache['new_pressure'] = m[2];
            const btn = document.getElementById('pressureUnitBtn_new_pressure');
            if (btn) btn.textContent = m[2] + ' ▾';
          }
        } else if (el) el.value = oldVal;
        return;
      }
      if (el.tagName === 'SELECT') {
        const target = String(item.data[f.key]).trim();
        for (let i = 0; i < el.options.length; i++) {
          if (el.options[i].value.trim() === target) { el.selectedIndex = i; break; }
        }
      } else if (!el.disabled) {
        el.value = item.data[f.key];
      }
    });
    onProductChange('new_product');
    refreshSerial();
    showToast('📋 اطلاعات کپی شد', 'ok');
  }, 200);
}

async function loadDashboard() {
  const dash = document.getElementById('dashContent');
  dash.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  try {
    const r = await callApi({ action: 'getStats' });
    if (!r.ok) { dash.innerHTML = '<div class="empty-state">خطا: ' + r.error + '</div>'; return; }
    const s = r.stats;
    let html = `<div class="dash-grid">
      <div class="dash-card"><div class="num">${toFa(s.total)}</div><div class="lbl">کل سفارش‌ها</div></div>
      <div class="dash-card"><div class="num" style="color:var(--warning)">${toFa(s.pendingCount)}</div><div class="lbl">ناقص</div></div>
    </div>`;
    html += `<div class="dash-card wide" style="margin-bottom:12px;">
      <div style="font-weight:800;margin-bottom:10px;color:var(--accent);">دسته‌بندی</div>`;
    Object.keys(CAT_LABELS).forEach(c => {
      html += `<div class="stat-row"><span>${CAT_LABELS[c]}</span><span class="val">${toFa(s.byCategory[c] || 0)}</span></div>`;
    });
    html += `</div>`;
    html += `<div class="dash-card wide" style="margin-bottom:12px;">
      <div style="font-weight:800;margin-bottom:10px;color:var(--accent);">وضعیت‌ها</div>`;
    STATUS_LIST.forEach(st => {
      html += `<div class="stat-row"><span class="key"><span class="dot" style="background:${STATUS_COLORS[st]}"></span>${st}</span><span class="val">${toFa(s.byStatus[st] || 0)}</span></div>`;
    });
    html += `</div>`;
    html += `<div class="dash-card wide">
      <div style="font-weight:800;margin-bottom:10px;color:var(--accent);">شرکت بازرسی</div>`;
    const insp = s.byInspection || {};
    Object.keys(insp).sort().forEach(k => {
      const bg = k === 'ISQI' ? '#FFD700' : (k === 'AJG' ? '#E53935' : '#888');
      html += `<div class="stat-row"><span class="key"><span class="dot" style="background:${bg}"></span>${k}</span><span class="val">${toFa(insp[k])}</span></div>`;
    });
    if (Object.keys(insp).length === 0) html += `<div class="stat-row"><span style="color:var(--text-dim)">موردی ثبت نشده</span></div>`;
    html += `</div>`;
    dash.innerHTML = html;
  } catch (e) { dash.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}

async function loadReport() {
  const rep = document.getElementById('reportContent');
  rep.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  try {
    const [rMonthly, rTrend] = await Promise.all([
      callApi({ action: 'getMonthlyReport', category: currentCat }),
      callApi({ action: 'getTrend6Months' })
    ]);
    if (!rMonthly.ok) { rep.innerHTML = '<div class="empty-state">خطا: ' + rMonthly.error + '</div>'; return; }

    const months = rMonthly.months || {};
    let maxV = 0;
    for (let i = 1; i <= 12; i++) if ((months[i] || {}).total > maxV) maxV = months[i].total;

    let html = `<div style="font-weight:800;margin-bottom:8px;color:var(--accent);font-size:1em;">تولید ماهانه سال ${currentYear}</div>`;
    html += `<div style="font-size:0.8em;color:var(--text-dim);margin-bottom:8px;">مجموع: ${toFa(Object.values(months).reduce((a,b) => a + (b.total||0), 0))} دستگاه</div>`;
    html += `<div class="bar-chart">`;
    for (let i = 1; i <= 12; i++) {
      const t = (months[i] || {}).total || 0;
      const h = maxV > 0 ? Math.round((t / maxV) * 150) : 0;
      html += `<div class="bar-col">
        <div class="bar" style="height:${Math.max(h, 3)}px;" data-val="${t}"></div>
        <div class="bar-label">${MONTH_NAMES[i-1].slice(0,3)}</div>
      </div>`;
    }
    html += `</div>`;

    if (rTrend.ok && rTrend.trend) {
      const trend = rTrend.trend;
      const maxT = Math.max(...trend.map(t => t.total), 1);
      const W = 100, H = 100;
      const padX = 8, padY = 15;
      const points = trend.map((t, i) => {
        const x = padX + (i / (trend.length - 1)) * (W - 2*padX);
        const y = H - padY - (t.total / maxT) * (H - 2*padY);
        return { x, y, val: t.total, month: t.month };
      });
      const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
      const areaD = pathD + ` L${points[points.length-1].x},${H-padY} L${points[0].x},${H-padY} Z`;

      html += `<div style="margin-top:24px;font-weight:800;color:var(--accent);">📈 روند ۶ ماه اخیر</div>`;
      html += `<div class="line-chart-wrap">
        <svg class="line-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="lineGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path class="line-area" d="${areaD}"/>
          <path class="line-path" d="${pathD}"/>
          ${points.map(p => `<circle class="line-point" cx="${p.x}" cy="${p.y}" r="1.5"/>`).join('')}
        </svg>
      </div>`;
      html += `<div class="line-labels">${trend.map(t => `<span class="line-label">${MONTH_NAMES[t.month-1].slice(0,3)}<br>${toFa(t.total)}</span>`).join('')}</div>`;
    }

    html += `<div style="margin-top:20px;font-weight:800;margin-bottom:8px;color:var(--accent);">تفکیک دسته‌ها</div>`;
    Object.keys(CAT_LABELS).forEach(c => {
      let sum = 0;
      for (let i = 1; i <= 12; i++) sum += (months[i] || {})[c] || 0;
      html += `<div class="stat-row"><span>${CAT_LABELS[c]}</span><span class="val">${toFa(sum)}</span></div>`;
    });

    rep.innerHTML = html;
  } catch (e) { rep.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}

async function loadAudit() {
  const el = document.getElementById('auditContent');
  el.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  try {
    const r = await callApi({ action: 'getAuditLog', limit: 200 });
    if (!r.ok) { el.innerHTML = '<div class="empty-state">خطا: ' + r.error + '</div>'; return; }
    if (!r.items || r.items.length === 0) {
      el.innerHTML = '<div class="empty-state">هنوز تغییری ثبت نشده</div>';
      return;
    }
    document.getElementById('tabCountAudit').textContent = toFa(r.items.length);
    let html = `<div style="font-size:0.83em;color:var(--text-dim);margin-bottom:12px;">
      📋 ${toFa(r.items.length)} تغییر اخیر
    </div>`;
    r.items.forEach(item => {
      html += `<div class="audit-item">
        <div class="top">
          <span class="user">👤 ${item.user || 'ناشناس'}</span>
          <span class="when">${item.date || ''} ${item.time || ''}</span>
        </div>
        <div class="body">
          <span style="color:var(--accent);font-weight:700;">${item.category || ''}</span>
          ${item.serial ? ' • سریال ' + item.serial : ''}<br>
          <span class="field-name">${item.field}:</span>
          ${item.oldVal ? '<span class="old-val">' + item.oldVal + '</span>' : '<span style="color:var(--text-dim)">(خالی)</span>'}
          →
          <span class="new-val">${item.newVal || '(خالی)'}</span>
        </div>
      </div>`;
    });
    el.innerHTML = html;
  } catch (e) { el.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}

async function openAlerts() {
  const el = document.getElementById('alertsList');
  el.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  document.getElementById('alertsBackdrop').classList.add('show');
  try {
    const r = await callApi({ action: 'getLoadDateAlerts' });
    if (!r.ok || !r.alerts || r.alerts.length === 0) {
      el.innerHTML = '<div class="empty-state">🎉 سفارش نزدیک به بارگیری نداری</div>';
      return;
    }
    el.innerHTML = '';
    r.alerts.forEach(a => {
      const d = document.createElement('div');
      d.className = 'audit-item';
      const daysTxt = a.daysLeft === 0 ? 'امروز' : (a.daysLeft === 1 ? 'فردا' : a.daysLeft + ' روز دیگه');
      d.innerHTML = `
        <div class="top">
          <span style="color:var(--accent);font-weight:800;">${a.serial || '(بدون سریال)'}</span>
          <span style="color:var(--warning);font-weight:800;">${daysTxt}</span>
        </div>
        <div class="body">${a.product || ''}<br>مشتری: ${a.customer || '—'}<br>تاریخ بارگیری: ${a.loadDate}</div>`;
      el.appendChild(d);
    });
  } catch (e) { el.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}
document.getElementById('alertsCloseBtn').onclick = () => document.getElementById('alertsBackdrop').classList.remove('show');
document.getElementById('alertsBackdrop').onclick = e => { if (e.target.id === 'alertsBackdrop') document.getElementById('alertsBackdrop').classList.remove('show'); };

async function updateReminders() {
  if (!isUrlConfigured()) return;
  try {
    const r = await callApi({ action: 'getLoadDateAlerts' });
    const banner = document.getElementById('smartReminder');
    if (r.ok && r.count > 0) {
      document.getElementById('reminderText').innerHTML = `<strong>${toFa(r.count)} سفارش</strong> نزدیک به بارگیری (تا ۷ روز آینده)`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  } catch (e) {}
}

function exportCsv() {
  const items = getFilteredItems();
  if (items.length === 0) { showToast('چیزی برای خروجی نیست', 'err'); return; }
  const cat = CATEGORIES[currentCat];
  const headers = cat.fields.map(f => f.label);
  const rows = items.map(it => cat.fields.map(f => {
    const v = it.data[f.key];
    return '"' + String(v || '').replace(/"/g, '""') + '"';
  }).join(','));
  const csv = '\uFEFF' + headers.map(h => '"' + h + '"').join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `caspian-${currentCat}-${currentYear}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function openSettings() {
  document.getElementById('settingsUrl').value = localStorage.getItem(STORAGE_KEY) || '';
  document.getElementById('settingsUser').value = getUserName();
  document.getElementById('settingsMsg').className = 'msg';
  const font = localStorage.getItem(FONT_KEY) || 'medium';
  document.querySelectorAll('.font-btn').forEach(b => b.classList.toggle('active', b.dataset.size === font));
  updateNotifStatus();
  document.getElementById('settingsBackdrop').classList.add('show');
}
function closeSettings() { document.getElementById('settingsBackdrop').classList.remove('show'); }

function updateNotifStatus() {
  const s = document.getElementById('notifStatus');
  if (!('Notification' in window)) { s.textContent = 'وضعیت: پشتیبانی نمی‌شود'; return; }
  const perm = Notification.permission;
  if (perm === 'granted') s.textContent = 'وضعیت: ✅ فعال';
  else if (perm === 'denied') s.textContent = 'وضعیت: ❌ رد شده';
  else s.textContent = 'وضعیت: هنوز درخواست نشده';
}

document.getElementById('notifPermBtn').onclick = async () => {
  if (!('Notification' in window)) { showToast('مرورگر پشتیبانی نمی‌کند', 'err'); return; }
  const perm = await Notification.requestPermission();
  updateNotifStatus();
  if (perm === 'granted') showToast('✅ اعلان‌ها فعال شد', 'ok');
  else showToast('❌ اعلان‌ها رد شد', 'err');
};

async function saveSettings() {
  const url = document.getElementById('settingsUrl').value.trim();
  const userName = document.getElementById('settingsUser').value.trim();
  const msg = document.getElementById('settingsMsg');
  if (!url) { msg.textContent = 'لطفاً لینک را وارد کنید'; msg.className = 'msg err'; return; }
  if (url.indexOf('https://script.google.com/') !== 0) { msg.textContent = 'لینک باید با https://script.google.com/ شروع شود'; msg.className = 'msg err'; return; }
  if (url.indexOf('/exec') === -1) { msg.textContent = 'لینک باید به /exec ختم شود'; msg.className = 'msg err'; return; }
  localStorage.setItem(STORAGE_KEY, url);
  if (userName) setUserName(userName);
  msg.textContent = 'در حال تست...'; msg.className = 'msg ok';
  try {
    const pingUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + 'action=ping';
    const res = await fetch(pingUrl, { method: 'GET' });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch (_) { msg.textContent = 'پاسخ JSON نبود'; msg.className = 'msg err'; return; }
    if (data.ok) {
      if (data.years && data.years.length > 0) availableYears = data.years;
      msg.textContent = '✅ اتصال برقرار — نسخه ' + (data.version || '?');
      msg.className = 'msg ok';
      updateConfigWarning();
      setTimeout(() => { closeSettings(); switchTab(currentTab); }, 900);
    } else {
      msg.textContent = 'خطا: ' + (data.error || 'نامشخص'); msg.className = 'msg err';
    }
  } catch (e) { msg.textContent = 'اتصال برقرار نشد: ' + e.message; msg.className = 'msg err'; }
}

document.querySelectorAll('.font-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const size = btn.dataset.size;
    document.body.classList.remove('font-small','font-medium','font-large','font-xlarge');
    document.body.classList.add('font-' + size);
    localStorage.setItem(FONT_KEY, size);
  };
});

function applyFontSize() {
  const font = localStorage.getItem(FONT_KEY) || 'medium';
  document.body.classList.add('font-' + font);
}

document.getElementById('newSubmitBtn').onclick = submitNewOrder;
document.getElementById('copyPrevBtn').onclick = openCopyModal;
document.getElementById('modalCloseBtn').onclick = closeModal;
document.getElementById('modalBackdrop').onclick = e => { if (e.target.id === 'modalBackdrop') closeModal(); };
document.getElementById('copyCloseBtn').onclick = closeCopy;
document.getElementById('copyBackdrop').onclick = e => { if (e.target.id === 'copyBackdrop') closeCopy(); };
document.getElementById('settingsBtn').onclick = openSettings;
document.getElementById('settingsCloseBtn').onclick = closeSettings;
document.getElementById('settingsSaveBtn').onclick = saveSettings;
document.getElementById('settingsBackdrop').onclick = e => { if (e.target.id === 'settingsBackdrop') closeSettings(); };
document.getElementById('configWarning').onclick = openSettings;
document.getElementById('refreshDashBtn').onclick = loadDashboard;
document.getElementById('exportCsvBtn').onclick = exportCsv;
document.getElementById('refreshAuditBtn').onclick = loadAudit;

document.getElementById('themeBtn').onclick = () => {
  document.body.classList.toggle('light');
  localStorage.setItem(THEME_KEY, document.body.classList.contains('light') ? 'light' : 'dark');
};

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  document.getElementById('searchClear').classList.toggle('show', searchTerm.length > 0);
  renderList();
});
document.getElementById('searchClear').onclick = () => {
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  renderList();
};
document.getElementById('onlyPendingBtn').onclick = e => {
  onlyPending = !onlyPending;
  e.target.classList.toggle('active', onlyPending);
  e.target.textContent = onlyPending ? 'ناقص‌ها' : 'همه';
  renderList();
};
document.getElementById('advFilterBtn').onclick = e => {
  const adv = document.getElementById('advFilters');
  adv.classList.toggle('show');
  e.target.classList.toggle('active', adv.classList.contains('show'));
};
document.getElementById('filterStatus').onchange = e => { filterStatus = e.target.value; renderList(); };
document.getElementById('filterInspection').onchange = e => { filterInspection = e.target.value; renderList(); };
document.getElementById('filterCustomer').onchange = e => { filterCustomer = e.target.value; renderList(); };
document.getElementById('clearFiltersBtn').onclick = () => {
  filterStatus = ''; filterInspection = ''; filterCustomer = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterInspection').value = '';
  document.getElementById('filterCustomer').value = '';
  renderList();
};

document.addEventListener('input', e => {
  if (e.target && (e.target.id === 'new_count' || e.target.id === 'new_serial')) updateCountHint();
});

(function(){
  function requestFS() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!fn) return Promise.reject('no API');
    if (document.fullscreenElement) return Promise.resolve();
    return fn.call(el).catch(() => {});
  }
  function exitFS() {
    if (document.exitFullscreen) return document.exitFullscreen().catch(() => {});
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
    if (document.msExitFullscreen) return document.msExitFullscreen();
    return Promise.resolve();
  }
  const btn = document.getElementById('fullscreenBtn');
  if (btn) btn.onclick = () => { if (document.fullscreenElement) exitFS(); else requestFS(); };
})();

(function detectDevice() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /Android/i.test(ua);
  const brandIcon = document.getElementById('brandIcon');
  const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
  if (isIOS) {
    if (brandIcon) brandIcon.src = 'icon-ios.png';
    if (appleIcon) appleIcon.href = 'icon-ios.png';
  } else if (isAndroid) {
    if (brandIcon) brandIcon.src = 'icon-android.png';
    if (appleIcon) appleIcon.href = 'icon-android.png';
  } else {
    if (brandIcon) brandIcon.src = 'icon-512.png';
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('SW fail', err));
  });
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (!isUrlConfigured()) return;
    if (currentTab === 'pending') loadItems(true);
    else if (currentTab === 'dashboard') loadDashboard();
    else if (currentTab === 'report') loadReport();
    else if (currentTab === 'audit') loadAudit();
    updateReminders();
  }, REFRESH_MS);
}

(function init() {
  if (localStorage.getItem(THEME_KEY) === 'light') document.body.classList.add('light');
  applyFontSize();
  updateClock();
  setInterval(updateClock, 30000);

  const fs = document.getElementById('filterStatus');
  STATUS_LIST.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; fs.appendChild(o); });

  updateConfigWarning();
  switchTab('new');
  updateReminders();
  startAutoRefresh();

  setInterval(async () => {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    if (!isUrlConfigured()) return;
    try {
      const r = await callApi({ action: 'getLoadDateAlerts' });
      if (r.ok && r.count > 0) {
        const today = new Date().toDateString();
        const lastNotif = localStorage.getItem('caspian_last_notif');
        if (lastNotif !== today) {
          new Notification('دفتر سریال کاسپین', {
            body: r.count + ' سفارش نزدیک به بارگیری',
            icon: 'icon-android.png'
          });
          localStorage.setItem('caspian_last_notif', today);
        }
      }
    } catch (e) {}
  }, 60000);
})();
</script>

<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>دفتر سریال کاسپین مبدل آمارد</title>
<meta name="theme-color" content="#131a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر سریال">
<link rel="apple-touch-icon" href="icon-ios.png">
<link rel="icon" type="image/png" href="icon-android.png">
<link rel="manifest" href="manifest.json">

<style>
:root {
  --accent: #f59e0b;
  --accent-dim: #b87208;
  --steel: #4a9eff;
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #ef4444;
  --cyan: #22d3ee;
  --purple: #a78bfa;
  --radius: 6px;
}
html[data-theme="dark"] {
  --bg-base: #131a26;
  --bg-surface: #1a2233;
  --bg-elevated: #212b3f;
  --bg-input: #0f1520;
  --border: #2d3748;
  --border-strong: #3f4c61;
  --text: #d4d8dd;
  --text-mid: #8b929b;
  --text-dim: #5a6373;
}
html[data-theme="light"] {
  --bg-base: #eef1f5;
  --bg-surface: #ffffff;
  --bg-elevated: #f5f7fa;
  --bg-input: #e8ecf1;
  --border: #d4dae3;
  --border-strong: #b4bec9;
  --text: #1a2029;
  --text-mid: #55606e;
  --text-dim: #8b95a4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-base);
  color: var(--text);
  font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}
body {
  background-image:
    linear-gradient(rgba(245,158,11,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,158,11,0.02) 1px, transparent 1px);
  background-size: 24px 24px;
  padding-bottom: 100px;
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-surface);
  border-bottom: 2px solid var(--border-strong);
  box-shadow: 0 2px 0 rgba(245,158,11,0.15);
}
.topbar-inner { max-width: 780px; margin: 0 auto; padding: 12px 16px 0; }
.topbar-row {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 14px; }

.brand-mark {
  width: 52px; height: 52px;
  background: var(--bg-input);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
}
.brand-mark::before {
  content: ''; position: absolute; inset: 0;
  border-radius: var(--radius);
  border: 2px solid var(--accent);
  animation: neonBorderColor 4s ease-in-out infinite;
  pointer-events: none;
}
.brand-mark::after {
  content: ''; position: absolute; inset: 3px;
  border: 1px dashed rgba(245,158,11,0.35);
  border-radius: 3px;
  animation: neonDashed 4s ease-in-out infinite;
  pointer-events: none;
}
.brand-mark svg {
  width: 28px; height: 28px;
  animation: neonIcon 4s ease-in-out infinite;
}
.brand-mark .pulse-ring {
  position: absolute; inset: -4px;
  border-radius: calc(var(--radius) + 2px);
  border: 1px solid transparent;
  animation: pulseRing 4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes neonBorderColor {
  0%, 100% { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.7), inset 0 0 8px rgba(245,158,11,0.15); }
  25% { border-color: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,0.7), inset 0 0 8px rgba(34,211,238,0.15); }
  50% { border-color: #a78bfa; box-shadow: 0 0 8px rgba(167,139,250,0.7), inset 0 0 8px rgba(167,139,250,0.15); }
  75% { border-color: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.7), inset 0 0 8px rgba(74,222,128,0.15); }
}
@keyframes neonDashed {
  0%, 100% { border-color: rgba(245,158,11,0.35); }
  25% { border-color: rgba(34,211,238,0.35); }
  50% { border-color: rgba(167,139,250,0.35); }
  75% { border-color: rgba(74,222,128,0.35); }
}
@keyframes neonIcon {
  0%, 100% { stroke: #f59e0b; filter: drop-shadow(0 0 4px rgba(245,158,11,0.7)); }
  25% { stroke: #22d3ee; filter: drop-shadow(0 0 4px rgba(34,211,238,0.7)); }
  50% { stroke: #a78bfa; filter: drop-shadow(0 0 4px rgba(167,139,250,0.7)); }
  75% { stroke: #4ade80; filter: drop-shadow(0 0 4px rgba(74,222,128,0.7)); }
}
@keyframes pulseRing {
  0%, 100% { border-color: transparent; transform: scale(1); opacity: 1; }
  50% { border-color: rgba(245,158,11,0.4); transform: scale(1.08); opacity: 0.6; }
}

.brand-text h1 { font-size: 15px; font-weight: 800; line-height: 1.2; }
.brand-text .sub {
  font-size: 10.5px; color: var(--text-dim);
  margin-top: 3px;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 6px;
}
.conn-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 6px var(--success);
}
.conn-dot.offline { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

.date-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px;
  padding: 4px 10px;
  background: linear-gradient(90deg, rgba(245,158,11,0.08), rgba(245,158,11,0.02));
  border: 1px solid rgba(245,158,11,0.2);
  border-radius: 4px;
  font-size: 11.5px;
  width: fit-content;
}
.date-row .cal-icon { width: 13px; height: 13px; stroke: var(--accent); fill: none; stroke-width: 2; flex-shrink: 0; }
.date-row .day-name { color: var(--accent); font-weight: 700; }
.date-row .divider { width: 1px; height: 11px; background: rgba(245,158,11,0.3); }
.date-row .date-full { color: var(--text); font-weight: 600; font-family: 'Courier New', monospace; letter-spacing: 0.5px; }
.date-row .time { color: var(--text-mid); font-size: 10.5px; font-family: 'Courier New', monospace; }

.topbar-actions { display: flex; gap: 6px; }
.tool-btn {
  width: 36px; height: 36px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-mid);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.15s;
}
.tool-btn:hover { color: var(--accent); border-color: var(--accent); }
.tool-btn:active { transform: scale(0.94); }
.tool-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.tabs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--border);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  overflow: hidden;
  margin-top: 12px;
}
.tab {
  background: var(--bg-elevated);
  padding: 12px 6px;
  cursor: pointer; transition: 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 12px; font-weight: 700;
  color: var(--text-mid);
  position: relative;
  user-select: none;
}
.tab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--bg-input); color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.tab .count {
  position: absolute; top: 3px; left: 5px;
  font-size: 8.5px; padding: 1px 4px;
  background: rgba(245,158,11,0.15); color: var(--accent);
  border-radius: 3px;
  font-family: 'Courier New', monospace; font-weight: 800;
}
.tab.active .count { background: var(--accent); color: #000; }

.container { max-width: 780px; margin: 0 auto; padding: 16px 16px 0; }

.alert-strip {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-right: 3px solid var(--warning);
  border-radius: var(--radius);
  padding: 10px 14px; margin-bottom: 16px;
}
.alert-strip .indicator {
  width: 28px; height: 28px;
  background: rgba(251,191,36,0.1);
  border: 1px solid rgba(251,191,36,0.4);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.alert-strip .indicator svg { width: 15px; height: 15px; stroke: var(--warning); fill: none; stroke-width: 2; }
.alert-strip .body { flex: 1; }
.alert-strip .body b { font-size: 12.5px; color: var(--warning); display: block; }
.alert-strip .body span { font-size: 11px; color: var(--text-dim); margin-top: 2px; display: block; }
.alert-strip .action {
  background: var(--warning); color: #000; border: none;
  padding: 6px 12px; border-radius: var(--radius);
  font-family: inherit; font-size: 11px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.3px;
}

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.stat {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 10px 8px;
  position: relative; overflow: hidden;
}
.stat::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 2px; background: var(--accent); }
.stat.warn::before { background: var(--warning); }
.stat.bad::before { background: var(--danger); }
.stat.good::before { background: var(--success); }
.stat .row { display: flex; align-items: baseline; justify-content: space-between; }
.stat .num { font-family: 'Courier New', monospace; font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -0.5px; }
.stat.warn .num { color: var(--warning); }
.stat.bad .num { color: var(--danger); }
.stat.good .num { color: var(--success); }
.stat .icon-tiny { width: 14px; height: 14px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; }
.stat .lbl { font-size: 9.5px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.5px; font-family: 'Courier New', monospace; }

.toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
.search-box { flex: 1; position: relative; }
.search-box input {
  width: 100%; background: var(--bg-input);
  border: 1px solid var(--border-strong); color: var(--text);
  border-radius: var(--radius); padding: 11px 40px 11px 44px;
  font-family: inherit; font-size: 13px; transition: 0.15s;
}
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
.search-box .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-dim); fill: none; stroke-width: 2; pointer-events: none; }
.search-box .voice-btn {
  position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px;
  background: transparent; border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: 0.15s;
}
.search-box .voice-btn:hover { border-color: var(--accent); }
.search-box .voice-btn.recording { background: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }
.search-box .voice-btn svg { width: 14px; height: 14px; stroke: var(--text-mid); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.search-box .voice-btn.recording svg { stroke: white; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.chip {
  background: var(--bg-surface); border: 1px solid var(--border-strong);
  color: var(--text-mid); border-radius: var(--radius);
  padding: 0 14px; font-family: inherit; font-size: 11.5px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  white-space: nowrap; transition: 0.15s;
}
.chip svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
.chip.active { background: var(--warning); color: #000; border-color: var(--warning); }

.card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-right: 3px solid var(--border-strong);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
  cursor: pointer; transition: 0.15s; position: relative;
}
.card:hover { background: var(--bg-elevated); border-color: var(--border-strong); }
.card.complete { border-right-color: var(--success); }
.card.missing { border-right-color: var(--warning); }
.card.urgent { border-right-color: var(--danger); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card-icon {
  width: 34px; height: 34px; flex-shrink: 0;
  background: var(--bg-input); border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
}
.card-icon svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.card.missing .card-icon svg { stroke: var(--warning); }
.card.urgent .card-icon svg { stroke: var(--danger); }
.card.complete .card-icon svg { stroke: var(--success); }
.card-serial { font-family: 'Courier New', monospace; font-size: 14.5px; font-weight: 800; color: var(--text); letter-spacing: 0.5px; line-height: 1.2; }
.card-prod { font-size: 11.5px; color: var(--text-mid); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.customer-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'Courier New', monospace; font-size: 9.5px;
  padding: 2px 6px; border-radius: 3px;
  font-weight: 700; letter-spacing: 0.3px;
  border: 1px solid;
  margin-top: 3px;
}
.customer-dot { width: 5px; height: 5px; border-radius: 50%; }

.status-badge {
  font-family: 'Courier New', monospace; font-size: 9.5px; font-weight: 800;
  padding: 4px 8px; border-radius: 3px; letter-spacing: 0.5px;
  text-transform: uppercase; white-space: nowrap;
  border: 1px solid; display: flex; align-items: center; gap: 4px;
  flex-shrink: 0;
}
.status-badge svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.status-badge.ok { color: var(--success); background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.3); }
.status-badge.warn { color: var(--warning); background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.3); }
.status-badge.urgent { color: var(--danger); background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); }

.timeline { display: flex; align-items: center; margin: 12px 0 8px; padding: 0 2px; }
.timeline-step { display: flex; flex-direction: column; align-items: center; flex: 0 0 auto; }
.timeline-dot {
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--bg-input); border: 2px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  transition: 0.3s;
}
.timeline-dot.done { background: var(--success); border-color: var(--success); }
.timeline-dot.done::after { content: '✓'; color: #000; font-size: 9px; font-weight: 900; line-height: 1; }
.timeline-dot.current { background: var(--warning); border-color: var(--warning); box-shadow: 0 0 0 3px rgba(251,191,36,0.2); }
.timeline-label {
  font-size: 8.5px; color: var(--text-dim);
  margin-top: 4px; font-family: 'Courier New', monospace;
  white-space: nowrap; text-align: center;
}
.timeline-label.done { color: var(--success); font-weight: 700; }
.timeline-label.current { color: var(--warning); font-weight: 700; }
.timeline-line { flex: 1; height: 2px; background: var(--border); margin: 0 -2px; margin-bottom: 16px; transition: 0.3s; }
.timeline-line.done { background: var(--success); }

.progress-block { margin: 8px 0 10px; }
.progress-head { display: flex; justify-content: space-between; font-family: 'Courier New', monospace; font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.5px; margin-bottom: 5px; }
.progress-head .pct { color: var(--text); font-weight: 800; }
.progress-track { height: 6px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; transition: width 0.5s ease; background-size: 8px 8px; background-image: linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.1) 75%, transparent 75%, transparent); }
.progress-fill.high { background-color: var(--success); }
.progress-fill.mid { background-color: var(--warning); }
.progress-fill.low { background-color: var(--danger); }

.specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; font-size: 11px; margin-top: 8px; }
.spec { display: flex; align-items: center; gap: 7px; color: var(--text-mid); padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.04); }
.spec:last-child, .spec:nth-last-child(2):nth-child(odd) { border-bottom: none; }
.spec .k { color: var(--text-dim); font-family: 'Courier New', monospace; font-size: 9.5px; letter-spacing: 0.3px; min-width: 45px; }
.spec .v { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.issues { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.issue-tag {
  font-size: 10px; padding: 3px 8px;
  background: rgba(239,68,68,0.08); color: var(--danger);
  border: 1px solid rgba(239,68,68,0.2); border-radius: 3px;
  display: flex; align-items: center; gap: 4px;
  font-family: 'Courier New', monospace; letter-spacing: 0.3px;
}
.issue-tag svg { width: 9px; height: 9px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; }

.fab {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #000; border: none;
  border-radius: var(--radius); padding: 14px 28px;
  font-family: inherit; font-size: 13.5px; font-weight: 800;
  letter-spacing: 0.5px; cursor: pointer; z-index: 40;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.2), 0 0 30px rgba(245,158,11,0.2);
  transition: 0.15s;
}
.fab svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }
.fab:active { transform: translateX(-50%) scale(0.96); }

.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--success); color: #04231a;
  padding: 11px 16px; border-radius: var(--radius);
  font-size: 12.5px; font-weight: 700; z-index: 60;
  opacity: 0; pointer-events: none; transition: 0.25s;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); pointer-events: auto; }
.toast.error { background: var(--danger); color: white; }
.toast .undo-btn {
  background: rgba(0,0,0,0.2); color: inherit;
  border: none; border-radius: 3px;
  padding: 5px 10px; font-size: 11px; font-weight: 800;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}
.toast .undo-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }
.toast .timer-bar {
  position: absolute; bottom: 0; right: 0; height: 3px;
  background: rgba(0,0,0,0.25);
  animation: shrink 10s linear forwards;
  border-radius: 0 0 var(--radius) 0;
}
@keyframes shrink { from { width: 100%; } to { width: 0%; } }

#pendingBadge {
  position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
  background: var(--warning); color: #000; padding: 6px 14px;
  border-radius: 6px; font-family: 'Courier New', monospace;
  font-size: 11px; font-weight: 800; z-index: 45;
  box-shadow: 0 4px 12px rgba(251,191,36,0.3);
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; max-width: calc(100% - 32px);
}

.monthly-stats {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.monthly-stats .head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 0; padding-bottom: 0;
  border-bottom: 1px solid transparent;
  cursor: pointer; transition: 0.2s;
}
.monthly-stats .head.open {
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom-color: var(--border);
}
.monthly-stats .head h3 {
  font-family: 'Courier New', monospace;
  font-size: 11px; color: var(--text-mid);
  letter-spacing: 1px;
  display: flex; align-items: center; gap: 8px;
}
.monthly-stats .head h3::before { content: ''; width: 3px; height: 12px; background: var(--accent); }
.monthly-stats .head .arrow { color: var(--text-dim); transition: 0.2s; }
.monthly-stats .head .arrow.open { transform: rotate(180deg); }
.monthly-stats .body { display: none; }

  padding: 16px 18px 24px;

.sheet-handle { width: 36px; height: 4px; background: var(--text-dim); border-radius: 99px; margin: 0 auto 14px; opacity: 0.5; }
.sheet h2 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
.sheet .sub { font-size: 11.5px; color: var(--text-dim); margin-bottom: 16px; font-family: 'Courier New', monospace; }
.field { margin-bottom: 12px; }

/* ============================================================
   OfflineSync — مدیریت صف آفلاین (IndexedDB)
============================================================ */
const OfflineSync = (() => {
  const DB_NAME = 'caspian-offline-db';
  const DB_VERSION = 1;
  const STORE_QUEUE = 'pending-queue';
  const STORE_CACHE = 'cached-data';
  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE_QUEUE)) d.createObjectStore(STORE_QUEUE, { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains(STORE_CACHE)) d.createObjectStore(STORE_CACHE, { keyPath: 'key' });
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  async function enqueue(payload) {
    const d = await openDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(STORE_QUEUE, 'readwrite');
      const req = tx.objectStore(STORE_QUEUE).add({ payload, timestamp: Date.now(), retries: 0 });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function getQueue() {
    const d = await openDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(STORE_QUEUE, 'readonly');
      const req = tx.objectStore(STORE_QUEUE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function removeFromQueue(id) {
    const d = await openDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(STORE_QUEUE, 'readwrite');
      const req = tx.objectStore(STORE_QUEUE).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async function updateRetries(id, retries) {
    const d = await openDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(STORE_QUEUE, 'readwrite');
      const store = tx.objectStore(STORE_QUEUE);
      const getReq = store.get(id);
      getReq.onsuccess = () => {
        const item = getReq.result;
        if (!item) return resolve();
        item.retries = retries;
        const putReq = store.put(item);
        putReq.onsuccess = () => resolve();
        putReq.onerror = () => reject(putReq.error);
      };
      getReq.onerror = () => reject(getReq.error);
    });
  }

  async function clearQueue() {
    const d = await openDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(STORE_QUEUE, 'readwrite');
      const req = tx.objectStore(STORE_QUEUE).clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async function cacheData(key, data) {
    const d = await openDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(STORE_CACHE, 'readwrite');
      const req = tx.objectStore(STORE_CACHE).put({ key, data, ts: Date.now() });
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async function getCachedData(key) {
    const d = await openDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(STORE_CACHE, 'readonly');
      const req = tx.objectStore(STORE_CACHE).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.data : null);
      req.onerror = () => reject(req.error);
    });
  }

  async function getPendingCount() {
    const q = await getQueue();
    return q.length;
  }

  let syncing = false;
  async function flush(postFn) {
    if (syncing) return { skipped: true };
    if (!navigator.onLine) return { offline: true };
    syncing = true;
    const queue = await getQueue();
    let success = 0, failed = 0;
    for (const op of queue) {
      try {
        const result = await postFn(op.payload);
        if (result && !result.error) {
          await removeFromQueue(op.id);
          success++;
        } else {
          throw new Error('API error');
        }
      } catch (err) {
        failed++;
        const retries = (op.retries || 0) + 1;
        if (retries >= 5) {
          await removeFromQueue(op.id);
        } else {
          await updateRetries(op.id, retries);
        }
      }
    }
    syncing = false;
    return { success, failed, total: queue.length };
  }

  return { openDB, enqueue, getQueue, removeFromQueue, clearQueue, cacheData, getCachedData, getPendingCount, flush };
})();

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toFa(num){ return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function hashColor(str){
  if (!str) return 'var(--text-dim)';
  const palette = ['#4a9eff','#a78bfa','#f59e0b','#4ade80','#22d3ee','#f472b6','#fb923c','#818cf8'];
  let h = 0;
  for (let i = 0; i < String(str).length; i++) h = String(str).charCodeAt(i) + ((h << 5) - h);
  return palette[Math.abs(h) % palette.length];
}
function extractMonth(dateStr){
  if (!dateStr) return null;
  const m = String(dateStr).match(/(\d{4})[\/\.\-](\d{1,2})/);
  return m ? parseInt(m[2]) : null;
}

function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}
function updateDate() {
  const now = new Date();
  const [jy, jm, jd] = toJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const faDayNames = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  const faDayIndex = (now.getDay() + 1) % 7;
  document.getElementById('dayName').textContent = faDayNames[faDayIndex];
  document.getElementById('dateFull').textContent = toFa(jy) + '/' + String(jm).padStart(2,'0') + '/' + String(jd).padStart(2,'0');
  document.getElementById('timeNow').textContent = toFa(String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'));
}

function toastMsg(msg, isError, undoCallback) {
  const t = document.getElementById('toast');
  t.className = 'toast show' + (isError ? ' error' : '');

  const span = document.createElement('span');

async function apiGet() {
  if (!navigator.onLine) throw new Error('offline');
  const res = await fetch(API_URL, { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error('network');
  return res.json();
}

async function rawApiPost(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('network');
  return res.json();
}

async function apiPost(payload) {
  if (!navigator.onLine) {
    await OfflineSync.enqueue(payload);
    throw new Error('offline-queued');
  }
  try {
    const result = await rawApiPost(payload);
    if (result && result.error) throw new Error(result.error);
    return result;
  } catch (err) {
    if (err.message === 'Failed to fetch' || err.message === 'network') {
      await OfflineSync.enqueue(payload);
      throw new Error('offline-queued');
    }
    throw err;
  }
}

async function updatePendingBadge() {
  try {
    const pending = await OfflineSync.getPendingCount();
    let badge = document.getElementById('pendingBadge');
    if (pending === 0) {
      if (badge) badge.remove();
      return;
    }
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'pendingBadge';
      badge.onclick = async () => {
        if (!navigator.onLine) { toastMsg('هنوز آفلاین هستی', true); return; }
        toastMsg('🔄 شروع سینک دستی...');
        const r = await OfflineSync.flush(rawApiPost);
        if (r.success > 0) {
          toastMsg('✅ ' + toFa(r.success) + ' عملیات سینک شد');
          try { await refreshAll(); renderAll(); } catch(e){}
        } else if (r.offline) {
          toastMsg('هنوز آفلاین هستی', true);

        updatePendingBadge();
      };
      document.body.appendChild(badge);

    badge.textContent = '⏳ ' + toFa(pending) + ' تغییر در انتظار سینک — کلیک کن';
  } catch(e) { console.warn(e); }
}

function isMissing(cat, rec) {
  return CATS[cat].fields.some(f => f.critical && !rec[f.key]);
}
function missingFieldsOf(cat, rec) {
  return CATS[cat].fields.filter(f => f.critical && !rec[f.key]).map(f => f.label);
}
function progressOf(cat, rec) {
  const fields = CATS[cat].fields.filter(f => f.key !== 'شماره سریال');
  if (!fields.length) return 0;
  const filled = fields.filter(f => rec[f.key] && String(rec[f.key]).trim()).length;
  return Math.round((filled / fields.length) * 100);
}

function renderTimeline(cat, rec) {
  let steps;
  if (cat === 'steam' || cat === 'hotwater') {
    steps = [
      { label: 'سفارش', done: !!rec['تاریخ سفارش'] },
      { label: 'ساخت', done: !!rec['ظرفیت محصول'] },
      { label: 'هیدرو', done: !!rec['تاریخ تست هیدرو'] },
      { label: 'بازرسی', done: !!rec['کد بازرسی'] },
      { label: 'بارگیری', done: !!rec['تاریخ بارگیری'] }
    ];
  } else {
    steps = [
      { label: 'سفارش', done: !!rec['تاریخ سفارش'] },
      { label: 'ساخت', done: !!rec['ظرفیت محصول'] },
      { label: 'بارگیری', done: !!rec['تاریخ بارگیری'] }
    ];
  }
  let currentIdx = steps.findIndex(s => !s.done);
  let html = '<div class="timeline">';
  steps.forEach((s, i) => {
    let dotClass = 'timeline-dot';
    let lblClass = 'timeline-label';
    if (s.done) { dotClass += ' done'; lblClass += ' done'; }
    else if (i === currentIdx) { dotClass += ' current'; lblClass += ' current'; }
    html += `<div class="timeline-step"><div class="${dotClass}"></div><div class="${lblClass}">${s.label}</div></div>`;
    if (i < steps.length - 1) {
      const lineDone = s.done && steps[i+1].done;
      html += `<div class="timeline-line ${lineDone ? 'done' : ''}"></div>`;
    }
  });
  html += '</div>';
  return html;
}

function renderMonthlyChart() {

  const months = ['فرو','ارد','خرد','تیر','مرد','شهر','مهر','آبا','آذر','دی','بهم','اسف'];
  const counts = new Array(12).fill(0);
  list.forEach(r => {
    const m = extractMonth(r['تاریخ سفارش']);
    if (m && m >= 1 && m <= 12) counts[m - 1]++;
  });
  const max = Math.max(...counts, 1);
  document.getElementById('monthlyChart').innerHTML = months.map((name, i) => {
    const val = counts[i];
    const h = val === 0 ? 2 : Math.max(4, (val / max) * 100);
    return `<div class="bar-wrap">
      <div class="bar-track"><div class="bar" style="height:${h}%">${val > 0 ? `<span class="bar-val">${toFa(val)}</span>` : ''}</div></div>
      <div class="bar-lbl">${name}</div>

  }).join('');
}

function suggestNextSerial(cat) {
  const list = allData[cat] || [];
  let max = 0;
  list.forEach(r => {
    const m = String(r['شماره سریال'] || '').match(/(\d+)/);
    if (m) { const n = parseInt(m[1]); if (n > max) max = n; }
  });
  if (cat === 'steam') return max ? 'SGS ' + (max + 1) : 'SGS 1';
  if (cat === 'hotwater') return max ? 'SGW ' + (max + 1) : 'SGW 1';
  return String(max + 1 || 1);
}

function openForm(serial) {
  editingId = serial || null;
  const conf = CATS[currentCat];
  const rec = editingId ? (allData[currentCat].find(r => r['شماره سریال'] === editingId) || {}) : {};
  const isNew = !editingId;

  const fieldsHtml = conf.fields.map(f => {
    const val = rec[f.key] || (isNew && f.key === 'شماره سریال' ? suggestNextSerial(currentCat) : '');
    const labelClass = f.req ? 'req' : '';
    if (f.type === 'textarea') {
      return `<div class="field"><label class="${labelClass}">${f.label}</label><textarea rows="2" data-key="${escapeHtml(f.key)}">${escapeHtml(val)}</textarea></div>`;
    }
    if (f.type === 'date') {
      return `<div class="field"><label class="${labelClass}">${f.label}</label><input type="text" inputmode="numeric" placeholder="مثلا: 1405.06.20" data-key="${escapeHtml(f.key)}" value="${escapeHtml(val)}">${f.critical ? '<div class="date-hint">⚠ این فیلد اغلب فراموش می‌شود</div>' : ''}</div>`;
    }
    return `<div class="field"><label class="${labelClass}">${f.label}</label><input type="text" placeholder="${f.placeholder || ''}" data-key="${escapeHtml(f.key)}" value="${escapeHtml(val)}"></div>`;
  }).join('');

  document.getElementById('sheetContent').innerHTML = `
    <h2>${isNew ? '➕ ثبت سفارش جدید' : '✏ ویرایش سفارش'} — ${conf.label}</h2>
    <div class="sub">${isNew ? 'فقط اطلاعات ضروری رو وارد کن، بقیه بعدا' : 'فیلدهای خالی رو تکمیل کن'}</div>
    <div id="formFields">${fieldsHtml}</div>
    <div class="form-actions">
      ${!isNew ? '<button class="btn btn-danger" id="deleteBtn">🗑 حذف</button>' : ''}
      <button class="btn btn-secondary" id="cancelBtn">انصراف</button>
      <button class="btn btn-primary" id="saveBtn">💾 ذخیره</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  document.getElementById('saveBtn').addEventListener('click', () => submitForm(isNew));
  const delBtn = document.getElementById('deleteBtn');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      if (confirm('این سفارش حذف بشه؟')) {
        const snapshot = JSON.parse(JSON.stringify(rec));
        allData[currentCat] = allData[currentCat].filter(x => x['شماره سریال'] !== editingId);
        await OfflineSync.cacheData('allData', allData);
        closeForm(); renderAll();
        try {
          await apiPost({ action: 'delete', cat: currentCat, record: snapshot });
          if (navigator.onLine) { try { await refreshAll(); renderAll(); } catch(e){} }
          toastMsg('حذف شد', false, async () => {
            allData[currentCat].push(snapshot);
            await OfflineSync.cacheData('allData', allData);
            renderAll();
            try { await apiPost({ action: 'upsert', cat: currentCat, record: snapshot }); toastMsg('بازگردانی شد'); }
            catch(e){}
          });
        } catch (e) {
          if (e.message === 'offline-queued') {
            toastMsg('📴 آفلاین — حذف در صف سینک ذخیره شد');
          } else {
            toastMsg('خطا در حذف', true);
          }
        }
        updatePendingBadge();
      }
    });
  }
}
function closeForm() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

async function submitForm(isNew) {
  const inputs = document.querySelectorAll('#formFields [data-key]');
  const record = {};
  inputs.forEach(inp => record[inp.getAttribute('data-key')] = inp.value.trim());
  if (!record['شماره سریال']) { toastMsg('شماره سریال الزامی است', true); return; }

  const oldRec = isNew ? null : JSON.parse(JSON.stringify(allData[currentCat].find(r => r['شماره سریال'] === editingId) || {}));

  const list = allData[currentCat];
  const idx = list.findIndex(r => r['شماره سریال'] === record['شماره سریال']);
  if (idx === -1) list.push(record);
  else list[idx] = record;
  await OfflineSync.cacheData('allData', allData);

  closeForm(); renderAll();

  try {
    await apiPost({ action: 'upsert', cat: currentCat, record });
    if (navigator.onLine) {
      try { await refreshAll(); renderAll(); } catch(e){}
      toastMsg('ذخیره شد ✓', false, async () => {
        try {
          if (oldRec) await apiPost({ action: 'upsert', cat: currentCat, record: oldRec });
          else await apiPost({ action: 'delete', cat: currentCat, record });
          if (navigator.onLine) { try { await refreshAll(); } catch(e){} }
          renderAll(); updatePendingBadge(); toastMsg('بازگردانی شد');
        } catch (e) { toastMsg('خطا در بازگردانی', true); }
      });
    } else {
      toastMsg('📴 آفلاین — در صف سینک ذخیره شد');
    }
  } catch (e) {
    if (e.message === 'offline-queued') {
      toastMsg('📴 آفلاین — در صف سینک ذخیره شد');
    } else {
      toastMsg('خطا در ذخیره', true);
    }
  }
  updatePendingBadge();
}

function switchTab(cat) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-cat') === cat));
  filterMissingOnly = false;
  document.getElementById('filterMissing').classList.remove('active');
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  renderAll();
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) switchTab(tab.getAttribute('data-cat'));
});

document.getElementById('addBtn').addEventListener('click', () => openForm(null));
document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; renderList(); });
document.getElementById('filterMissing').addEventListener('click', (e) => {
  filterMissingOnly = !filterMissingOnly;
  e.currentTarget.classList.toggle('active', filterMissingOnly);
  renderList();
});
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeForm(); });
document.getElementById('settingsOverlay').addEventListener('click', (e) => { if (e.target.id === 'settingsOverlay') closeSettings(); });
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('chartToggle').addEventListener('click', () => {
  document.getElementById('chartBody').classList.toggle('open');
  document.getElementById('chartToggle').classList.toggle('open');
  document.querySelector('#chartToggle .arrow').classList.toggle('open');
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const list = allData[currentCat] || [];
  if (!list.length) { toastMsg('داده‌ای برای خروجی نیست', true); return; }
  const conf = CATS[currentCat];
  const headers = conf.fields.map(f => f.label);
  const keys = conf.fields.map(f => f.key);
  const rows = [headers];
  list.forEach(r => rows.push(keys.map(k => r[k] || '')));
  const csv = '\uFEFF' + rows.map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `caspian-${currentCat}-${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
  toastMsg('خروجی CSV دانلود شد');
});

document.getElementById('voiceBtn').addEventListener('click', () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toastMsg('مرورگر از جستجوی صوتی پشتیبانی نمی‌کند', true); return; }
  const btn = document.getElementById('voiceBtn');
  const rec = new SR();
  rec.lang = 'fa-IR';
  rec.continuous = false;
  rec.interimResults = false;
  rec.onstart = () => btn.classList.add('recording');
  rec.onend = () => btn.classList.remove('recording');
  rec.onerror = () => { btn.classList.remove('recording'); toastMsg('خطا در تشخیص صدا', true); };
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById('searchInput').value = text;
    searchTerm = text;
    renderList();
    toastMsg('جستجو: ' + text);
  };
  rec.start();
});

function closeSettings() { document.getElementById('settingsOverlay').classList.remove('open'); }
function openSettings() {
  const total = allData.steam.length + allData.hotwater.length + allData.tanks.length;
  document.getElementById('settingsContent').innerHTML = `
    <h2>⚙ تنظیمات اتصال</h2>
    <div class="sub">آدرس Web App گوگل اسکریپت</div>
    <div class="field">
      <label>آدرس API</label>
      <input type="url" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(API_URL)}">
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" id="closeSettingsBtn">بستن</button>
      <button class="btn btn-primary" id="saveUrlBtn">ذخیره و اتصال</button>
    </div>
    ${total === 0 && API_URL ? `
    <div class="import-banner">
      شیت شما خالی است. اگر می‌خواهی داده‌های نمونه رو وارد کنی:
      <br><button class="btn btn-primary" id="bulkImportBtn" style="margin-top:10px; width:100%;">📥 وارد کردن داده‌های نمونه</button>
    </div>` : ''}
    <div class="import-banner" style="border-color:var(--danger); background:rgba(239,68,68,0.05);">
      <b style="color:var(--danger);">پاک کردن داده‌های محلی</b><br>
      <button class="btn btn-danger" id="clearLocalBtn" style="margin-top:10px; width:100%;">🗑 پاک کردن</button>
    </div>
  `;
  document.getElementById('settingsOverlay').classList.add('open');
  document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
  document.getElementById('saveUrlBtn').addEventListener('click', async () => {
    const val = document.getElementById('apiUrlInput').value.trim();
    if (!val) { toastMsg('آدرس را وارد کن', true); return; }
    API_URL = val;
    localStorage.setItem('gasUrl', API_URL);
    closeSettings();
    await boot();
  });
  const bulkBtn = document.getElementById('bulkImportBtn');
  if (bulkBtn) {
    bulkBtn.addEventListener('click', async () => {
      bulkBtn.disabled = true;
      bulkBtn.textContent = '⏳ در حال وارد کردن...';
      try {
        for (const cat of Object.keys(SEED)) {
          if (SEED[cat] && SEED[cat].length) await apiPost({ action: 'bulkImport', cat, records: SEED[cat] });
        }
        if (navigator.onLine) { await refreshAll(); renderAll(); }
        closeSettings();
        toastMsg('✅ داده‌ها وارد شد');
      } catch (e) {
        toastMsg(e.message === 'offline-queued' ? '📴 آفلاین — در صف' : 'خطا در وارد کردن', e.message !== 'offline-queued');
        bulkBtn.disabled = false;
        bulkBtn.textContent = '📥 وارد کردن داده‌های نمونه';
      }
      updatePendingBadge();
    });
  }
  const clearBtn = document.getElementById('clearLocalBtn');
  if (clearBtn) {
    clearBtn.addEventListener('click', async () => {
      if (!confirm('همه‌ی داده‌های محلی پاک بشه؟')) return;
      await OfflineSync.clearQueue();
      try {
        const d = await OfflineSync.openDB();
        const tx = d.transaction('cached-data', 'readwrite');
        tx.objectStore('cached-data').clear();
      } catch(e){}
      allData = { steam: [], hotwater: [], tanks: [] };
      closeSettings(); renderAll(); updatePendingBadge();
      toastMsg('پاک شد');
    });
  }
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);

function showSetupScreen(msg) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'block';
  document.getElementById('connDot').classList.add('offline');
  document.getElementById('connText').textContent = msg || 'متصل نیست';
  document.getElementById('setupScreen').innerHTML = `
    <div class="setup-box">
      <b style="color:var(--accent); font-family:'Courier New',monospace;">⚙ راه‌اندازی</b><br><br>
      این اپ به یک Google Apps Script Web App متصل می‌شود.<br><br>
      <b>۱.</b> کد <code style="background:var(--bg-input);padding:2px 6px;border-radius:3px;">Code.gs</code> را در Apps Script قرار بده<br>
      <b>۲.</b> Deploy کن (نوع Web App، دسترسی Anyone)<br>
      <b>۳.</b> آدرس <code style="background:var(--bg-input);padding:2px 6px;border-radius:3px;">/exec</code> را کپی کن<br>
      <b>۴.</b> روی دکمه ⚙ بزن و پیست کن<br><br>
      <div style="text-align:center; margin-top:16px;">
        <button class="btn btn-primary" style="max-width:240px;" onclick="openSettings()">ورود آدرس اتصال</button>
      </div>
    </div>
    ${msg && msg.includes('خطا') ? '<div class="setup-box" style="border-color:var(--danger);">❌ اتصال برقرار نشد</div>' : ''}
  `;
}

function renderAll() {
  renderStats();
  renderStats2();
  renderAlert();
  renderMonthlyChart();
  renderList();
}

window.addEventListener('online', async () => {
  updateConnStatus(true);
  const pending = await OfflineSync.getPendingCount();
  if (pending > 0) {
    toastMsg('🔄 در حال سینک ' + toFa(pending) + ' تغییر...');
    setTimeout(async () => {
      const r = await OfflineSync.flush(rawApiPost);
      if (r.success > 0) {
        toastMsg('✅ ' + toFa(r.success) + ' تغییر سینک شد');
        try { await refreshAll(); renderAll(); } catch(e){}
      } else if (r.failed > 0) {
        toastMsg('❌ ' + toFa(r.failed) + ' خطا', true);
      }
      updatePendingBadge();
    }, 1500);
  }
});
window.addEventListener('offline', () => {
  updateConnStatus(false);
  toastMsg('📴 آفلاین شد — تغییرات محلی ذخیره می‌شود');
});

async function boot() {
  await OfflineSync.openDB();
  updatePendingBadge();

  const cached = await OfflineSync.getCachedData('allData');
  if (cached) {
    allData.steam = cached.steam || [];
    allData.hotwater = cached.hotwater || [];
    allData.tanks = cached.tanks || [];
    document.getElementById('app').style.display = 'block';
    document.getElementById('setupScreen').style.display = 'none';
    renderAll();
  }

  if (!API_URL) {
    if (!cached) showSetupScreen();
    updateConnStatus(false);
    return;
  }

  if (navigator.onLine) {
    try {
      await refreshAll();
      document.getElementById('app').style.display = 'block';
      document.getElementById('setupScreen').style.display = 'none';
      updateConnStatus(true);
      renderAll();
      const pending = await OfflineSync.getPendingCount();
      if (pending > 0) {
        setTimeout(async () => {
          toastMsg('🔄 سینک ' + toFa(pending) + ' تغییر...');
          const r = await OfflineSync.flush(rawApiPost);
          if (r.success > 0) {
            toastMsg('✅ ' + toFa(r.success) + ' سینک شد');
            await refreshAll(); renderAll();
          }
          updatePendingBadge();
        }, 800);
      }
    } catch (e) {
      updateConnStatus(false);
      if (!cached) showSetupScreen('خطا در اتصال');
    }
  } else {
    updateConnStatus(false);
    if (!cached) showSetupScreen('آفلاین');
  }
  updatePendingBadge();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW register failed:', err));
  });
}

boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>دفتر سریال کاسپین مبدل آمارد</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f59e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر سریال">
<link rel="apple-touch-icon" href="icon-ios.png">
<link rel="icon" href="icon-android.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#0f141c;--bg-surface:#161e2b;--bg-elevated:#1e2838;--bg-input:#0a1018;
    --border:#2a3544;--border-strong:#3a4a5e;
    --text:#e8ecf1;--text-mid:#a8b0bc;--text-dim:#6b7789;
    --accent:#f59e0b;--accent-dim:#b87208;
    --steel:#4a9eff;--success:#22c55e;--warning:#fbbf24;--danger:#ef4444;
    --cyan:#22d3ee;--purple:#a78bfa;--pink:#ec4899;
    --radius:10px;--radius-sm:6px;
    --shadow:0 4px 16px rgba(0,0,0,0.4);
    --shadow-hover:0 6px 24px rgba(0,0,0,0.55);
    --c1:#4a9eff;--c2:#22c55e;--c3:#f59e0b;--c4:#a78bfa;--c5:#ec4899;--c6:#22d3ee;--c7:#eab308;--c8:#f87171;
    --base-font:15px;
  }
  body.light{
    --bg-base:#e8ecf0;--bg-surface:#ffffff;--bg-elevated:#f5f7fa;--bg-input:#ffffff;
    --border:#d0d8e0;--border-strong:#a8b4c4;
    --text:#1a2332;--text-mid:#4a5568;--text-dim:#7a8699;
    --shadow:0 2px 8px rgba(0,0,0,0.08);--shadow-hover:0 4px 16px rgba(0,0,0,0.12);
  }
  body.font-small{--base-font:13px;}
  body.font-medium{--base-font:15px;}
  body.font-large{--base-font:17px;}
  body.font-xlarge{--base-font:19px;}

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg-base);color:var(--text);
    font-family:'Vazirmatn','Tahoma',sans-serif;font-size:var(--base-font);line-height:1.6;
    min-height:100vh;transition:background 0.3s,color 0.3s,font-size 0.2s;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    background-image:
      linear-gradient(rgba(245,158,11,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,158,11,0.02) 1px, transparent 1px);
    background-size:28px 28px;padding-bottom:30px;
  }

  .neon-select-wrap{position:relative;}
  .neon-select-wrap::after{
    content:'▾';position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--accent);font-size:14px;pointer-events:none;transition:all 0.2s;
  }
  select,input[type=text],input[type=date],input[type=number],textarea{
    width:100%;background:var(--bg-input);border:1.5px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);
    font-size:1em;font-family:inherit;outline:none;
    transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  select{
    appearance:none;-webkit-appearance:none;
    padding-left:36px;cursor:pointer;
    background-image:linear-gradient(90deg, rgba(245,158,11,0.03), rgba(245,158,11,0));
  }
  select:hover,input:hover,textarea:hover{
    border-color:var(--accent);
    box-shadow:0 0 12px rgba(245,158,11,0.2);
  }
  select:focus,input:focus,textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent),0 0 20px rgba(245,158,11,0.4),inset 0 0 12px rgba(245,158,11,0.08);
    background-image:linear-gradient(90deg, rgba(245,158,11,0.08), transparent);
  }
  select option{background:var(--bg-elevated);color:var(--text);padding:10px;}
  .neon-select-wrap:focus-within::after{transform:translateY(-50%) rotate(180deg);color:#fff;}

  .topbar{
    position:sticky;top:0;z-index:50;background:var(--bg-surface);
    border-bottom:2px solid var(--border-strong);
    box-shadow:0 2px 0 rgba(245,158,11,0.12),var(--shadow);
    padding-top:env(safe-area-inset-top);
  }
  .topbar-inner{max-width:800px;margin:0 auto;padding:14px 16px 0;}
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--border);gap:12px;}
  .brand{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
  .brand-mark{width:56px;height:56px;background:var(--bg-input);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;overflow:hidden;}
  .brand-mark img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius);position:relative;z-index:2;}
  .brand-mark::before{content:'';position:absolute;inset:0;border-radius:var(--radius);
    border:2px solid var(--accent);animation:neonBorderColor 6s ease-in-out infinite;pointer-events:none;z-index:3;}
  .brand-mark::after{content:'';position:absolute;inset:4px;border:1px dashed rgba(245,158,11,0.3);
    border-radius:4px;animation:neonDashed 6s ease-in-out infinite;pointer-events:none;z-index:4;}
  .brand-mark .pulse-ring{position:absolute;inset:-3px;border-radius:calc(var(--radius) + 2px);
    border:1px solid transparent;animation:pulseRing 3s ease-in-out infinite;pointer-events:none;z-index:1;}
  @keyframes neonBorderColor{
    0%,100%{border-color:#f59e0b;box-shadow:0 0 12px rgba(245,158,11,0.6),inset 0 0 10px rgba(245,158,11,0.15);}
    33%{border-color:#22d3ee;box-shadow:0 0 12px rgba(34,211,238,0.6),inset 0 0 10px rgba(34,211,238,0.15);}
    66%{border-color:#a78bfa;box-shadow:0 0 12px rgba(167,139,250,0.6),inset 0 0 10px rgba(167,139,250,0.15);}
  }
  @keyframes neonDashed{
    0%,100%{border-color:rgba(245,158,11,0.3);}
    33%{border-color:rgba(34,211,238,0.3);}
    66%{border-color:rgba(167,139,250,0.3);}
  }
  @keyframes pulseRing{
    0%{border-color:transparent;transform:scale(1);opacity:0.8;}
    50%{border-color:rgba(245,158,11,0.5);transform:scale(1.08);opacity:0.4;}
    100%{border-color:transparent;transform:scale(1);opacity:0.8;}
  }
  .brand-text{flex:1;min-width:0;}
  .brand-text h1{font-size:1.05em;font-weight:800;color:var(--text);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-text .sub{font-size:0.73em;color:var(--text-dim);margin-top:4px;
    font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;display:flex;align-items:center;gap:6px;}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--success);
    box-shadow:0 0 8px var(--success);animation:pulseDot 2s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .date-row{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:5px 12px;
    background:linear-gradient(90deg,rgba(245,158,11,0.1),rgba(245,158,11,0.02));
    border:1px solid rgba(245,158,11,0.25);border-radius:6px;font-size:0.83em;}
  .date-row .cal-icon{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;flex-shrink:0;}
  .date-row .day-name{color:var(--accent);font-weight:700;}
  .date-row .divider{width:1px;height:13px;background:rgba(245,158,11,0.3);}
  .date-row .date-full{color:var(--text);font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;}
  .date-row .time{color:var(--text-mid);font-family:'JetBrains Mono',monospace;font-size:0.95em;}
  .topbar-actions{display:flex;gap:6px;flex-shrink:0;}
  .tool-btn{width:40px;height:40px;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:var(--radius-sm);color:var(--text-mid);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.15s;}
  .tool-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--bg-input);}
  .tool-btn:active{transform:scale(0.92);}
  .tool-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);
    border:1px solid var(--border);border-top:none;
    border-radius:0 0 var(--radius) var(--radius);overflow:hidden;margin-top:12px;}
  .tab{background:var(--bg-elevated);padding:12px 4px;cursor:pointer;transition:0.15s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    font-size:0.83em;font-weight:700;color:var(--text-mid);position:relative;}
  .tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .tab:hover{color:var(--text);background:#263048;}
  .tab.active{background:var(--bg-input);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);}
  .tab .count{position:absolute;top:4px;left:6px;font-size:0.63em;padding:1px 5px;
    background:rgba(245,158,11,0.15);color:var(--accent);border-radius:4px;
    font-family:'JetBrains Mono',monospace;font-weight:800;}
  .tab.active .count{background:var(--accent);color:#000;}

  .container{max-width:800px;margin:0 auto;padding:16px 16px 0;}

  .smart-reminder{display:none;align-items:center;gap:12px;padding:12px 16px;
    background:linear-gradient(135deg,rgba(251,191,36,0.12),rgba(251,191,36,0.03));
    border:1px solid rgba(251,191,36,0.4);border-right:4px solid var(--warning);
    border-radius:var(--radius);margin-bottom:16px;font-size:0.87em;cursor:pointer;}
  .smart-reminder.show{display:flex;}
  .smart-reminder .rem-icon{width:32px;height:32px;background:rgba(251,191,36,0.2);border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--warning);
    animation:bellShake 2s infinite;}
  @keyframes bellShake{
    0%,100%{transform:rotate(0);}
    10%,30%{transform:rotate(-8deg);}
    20%,40%{transform:rotate(8deg);}
    50%{transform:rotate(0);}
  }
  .smart-reminder .rem-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;}
  .smart-reminder .rem-text{flex:1;color:var(--text);}
  .smart-reminder .rem-text strong{color:var(--warning);font-weight:800;}

  .card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}

  .year-row{display:flex;gap:6px;margin-bottom:12px;justify-content:center;flex-wrap:wrap;}
  .year-btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--bg-elevated);color:var(--text-mid);font-size:0.83em;
    font-family:inherit;cursor:pointer;transition:all .15s;font-weight:700;}
  .year-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#fff;box-shadow:0 0 14px rgba(245,158,11,0.3);}

  .cat-row{display:flex;gap:8px;margin-bottom:18px;}
  .cat-btn{flex:1;padding:12px 6px;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--bg-elevated);color:var(--text-mid);font-size:0.83em;
    font-family:inherit;text-align:center;cursor:pointer;transition:all .15s;font-weight:700;}
  .cat-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#fff;box-shadow:0 0 14px rgba(245,158,11,0.3);}

  label{display:block;font-size:0.87em;color:var(--text-mid);margin:14px 0 7px;font-weight:600;}
  label.req::after{content:" *";color:var(--accent);font-weight:800;}

  .neon-radio-group{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .neon-radio{position:relative;background:var(--bg-input);border:1.5px solid var(--border);
    border-radius:8px;padding:13px 8px;text-align:center;cursor:pointer;
    transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
    font-size:0.87em;font-weight:700;color:var(--text-mid);overflow:hidden;}
  .neon-radio::before{content:'';position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(245,158,11,0.15), transparent);
    opacity:0;transition:opacity 0.25s;}
  .neon-radio:hover{border-color:var(--accent);color:var(--text);transform:translateY(-2px);
    box-shadow:0 4px 14px rgba(245,158,11,0.2);}
  .neon-radio:hover::before{opacity:1;}
  .neon-radio.selected{background:linear-gradient(135deg, rgba(245,158,11,0.2), rgba(245,158,11,0.05));
    border-color:var(--accent);color:var(--accent);
    box-shadow:0 0 0 1px var(--accent),0 0 20px rgba(245,158,11,0.5),inset 0 0 12px rgba(245,158,11,0.15);
    text-shadow:0 0 8px rgba(245,158,11,0.6);}
  .neon-radio.selected::after{content:'✓';position:absolute;top:6px;left:8px;
    font-size:0.73em;color:var(--accent);text-shadow:0 0 6px var(--accent);}

  .date-row{display:flex;gap:8px;align-items:stretch;}
  .date-row input{flex:1;}
  .today-btn{white-space:nowrap;background:var(--bg-elevated);border:1.5px solid var(--accent-dim);
    color:var(--accent);border-radius:var(--radius-sm);padding:0 14px;font-size:0.83em;
    cursor:pointer;font-family:inherit;font-weight:700;transition:0.2s;}
  .today-btn:hover{background:rgba(245,158,11,0.1);box-shadow:0 0 10px rgba(245,158,11,0.3);}
  .today-btn:active{transform:scale(0.96);}

  .submit-btn{width:100%;margin-top:18px;padding:15px;border-radius:var(--radius);border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    color:#1a1205;font-weight:800;font-size:1em;font-family:inherit;cursor:pointer;transition:0.15s;}
  .submit-btn:active{transform:scale(0.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
  .secondary-btn{width:100%;margin-top:10px;padding:13px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--bg-elevated);
    color:var(--accent);font-weight:700;font-size:0.9em;font-family:inherit;cursor:pointer;}
  .secondary-btn:active{transform:scale(0.98);}

  .msg{text-align:center;padding:11px;border-radius:var(--radius-sm);margin-top:12px;font-size:0.87em;display:none;}
  .msg.ok{display:block;background:rgba(34,197,94,0.12);color:var(--success);border:1px solid var(--success);}
  .msg.err{display:block;background:rgba(239,68,68,0.12);color:var(--danger);border:1px solid var(--danger);}

  .order-card{background:var(--bg-surface);border:1px solid var(--border);
    border-right:4px solid var(--c1);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:12px;position:relative;
    transition:0.2s;cursor:pointer;box-shadow:var(--shadow);}
  .order-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-hover);transform:translateY(-1px);}
  .order-card.customer-c1{border-right-color:var(--c1);}
  .order-card.customer-c2{border-right-color:var(--c2);}
  .order-card.customer-c3{border-right-color:var(--c3);}
  .order-card.customer-c4{border-right-color:var(--c4);}
  .order-card.customer-c5{border-right-color:var(--c5);}
  .order-card.customer-c6{border-right-color:var(--c6);}
  .order-card.customer-c7{border-right-color:var(--c7);}
  .order-card.customer-c8{border-right-color:var(--c8);}

  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px;}
  .card-head .serial{font-family:'JetBrains Mono',monospace;font-size:1.07em;font-weight:800;
    color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-head .serial .co-badge{font-family:'Vazirmatn',sans-serif;font-size:0.63em;font-weight:800;
    padding:3px 8px;border-radius:5px;}
  .co-badge.isqi{background:rgba(255,215,0,0.2);color:#ffd700;border:1px solid rgba(255,215,0,0.5);}
  .co-badge.ajg{background:rgba(239,68,68,0.2);color:#ff8a8a;border:1px solid rgba(239,68,68,0.5);}

  .status-pill{font-family:'Vazirmatn',sans-serif;font-size:0.7em;font-weight:800;
    padding:4px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .status-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .status-pill.not-made{background:rgba(239,68,68,0.15);color:#ff7b7b;}
  .status-pill.making{background:rgba(251,191,36,0.15);color:#fbbf24;}
  .status-pill.done{background:rgba(34,197,94,0.15);color:#4ade80;}

  .card-body{font-size:0.9em;color:var(--text-mid);line-height:1.75;}
  .card-body .product{color:var(--text);font-weight:600;margin-bottom:4px;}
  .card-body .meta-row{display:flex;flex-wrap:wrap;gap:12px;font-size:0.83em;margin-top:4px;}
  .card-body .meta-row .label{color:var(--text-dim);}
  .card-body .meta-row .value{color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace;}

  .progress-wrap{margin-top:12px;display:flex;align-items:center;gap:10px;}
  .progress-bar{flex:1;height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden;position:relative;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));
    border-radius:3px;transition:width 0.5s;position:relative;}
  .progress-fill::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
    animation:shimmer 2s infinite;}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .progress-pct{font-family:'JetBrains Mono',monospace;font-size:0.77em;font-weight:800;
    color:var(--accent);min-width:38px;text-align:left;}

  .timeline{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
    padding:0 4px;position:relative;}
  .timeline::before{content:'';position:absolute;left:12px;right:12px;top:10px;
    height:2px;background:var(--bg-input);z-index:1;}
  .timeline-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    position:relative;z-index:2;}
  .timeline-dot{width:20px;height:20px;border-radius:50%;background:var(--bg-input);
    border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:0.3s;}
  .timeline-dot svg{width:10px;height:10px;stroke:var(--text-dim);fill:none;stroke-width:3;
    opacity:0;transition:0.3s;}
  .timeline-step.done .timeline-dot{background:var(--success);border-color:var(--success);
    box-shadow:0 0 10px rgba(34,197,94,0.5);}
  .timeline-step.done .timeline-dot svg{stroke:#fff;opacity:1;}
  .timeline-step.active .timeline-dot{background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 10px rgba(245,158,11,0.6);animation:pulseActive 1.5s infinite;}
  @keyframes pulseActive{0%,100%{box-shadow:0 0 10px rgba(245,158,11,0.6);}50%{box-shadow:0 0 18px rgba(245,158,11,0.9);}}
  .timeline-label{font-size:0.7em;color:var(--text-dim);font-weight:600;text-align:center;}
  .timeline-step.done .timeline-label{color:var(--success);}
  .timeline-step.active .timeline-label{color:var(--accent);font-weight:800;}

  .customer-tag{display:inline-flex;align-items:center;gap:5px;font-size:0.77em;
    padding:2px 8px;border-radius:5px;background:var(--bg-input);
    border:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-weight:700;}
  .customer-tag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c1);}
  .customer-tag.c1::before{background:var(--c1);}
  .customer-tag.c2::before{background:var(--c2);}
  .customer-tag.c3::before{background:var(--c3);}
  .customer-tag.c4::before{background:var(--c4);}
  .customer-tag.c5::before{background:var(--c5);}
  .customer-tag.c6::before{background:var(--c6);}

  .card-actions{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .card-actions button{flex:1;background:var(--bg-elevated);border:1px solid var(--border);
    color:var(--text-mid);font-size:0.83em;font-family:inherit;padding:8px;
    border-radius:var(--radius-sm);cursor:pointer;font-weight:700;}
  .card-actions button:hover{color:var(--accent);border-color:var(--accent);}

  .search-row{display:flex;gap:8px;align-items:stretch;margin-bottom:12px;}
  .search-input-wrap{position:relative;flex:1;}
  .search-input-wrap input{padding-left:36px;padding-right:12px;}
  .search-input-wrap .clear-btn{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border-radius:50%;border:none;background:var(--bg-elevated);
    color:var(--text-mid);cursor:pointer;font-size:13px;display:none;
    align-items:center;justify-content:center;}
  .search-input-wrap .clear-btn.show{display:flex;}
  .filter-toggle{border:1px solid var(--border);background:var(--bg-elevated);
    color:var(--text-mid);border-radius:var(--radius-sm);padding:0 14px;
    font-size:0.83em;font-family:inherit;cursor:pointer;white-space:nowrap;font-weight:700;}
  .filter-toggle.active{color:var(--accent);border-color:var(--accent);background:rgba(245,158,11,0.08);}

  .adv-filters{margin-top:10px;padding:14px;background:var(--bg-input);
    border:1px solid var(--border);border-radius:var(--radius-sm);display:none;}
  .adv-filters.show{display:block;}

  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .dash-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .dash-card .num{font-size:1.6em;font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace;}
  .dash-card .lbl{font-size:0.8em;color:var(--text-dim);margin-top:6px;font-weight:600;}
  .dash-card.wide{grid-column:1/-1;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--border);font-size:0.9em;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .key{display:flex;align-items:center;gap:10px;font-weight:600;}
  .stat-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .stat-row .val{font-weight:800;color:var(--text);font-family:'JetBrains Mono',monospace;}

  .bar-chart{display:flex;align-items:flex-end;justify-content:space-between;
    gap:6px;height:180px;padding:16px 0;margin-top:14px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .bar{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-dim));
    border-radius:4px 4px 0 0;min-height:3px;transition:height 0.6s;position:relative;}
  .bar:hover::after{content:attr(data-val);position:absolute;top:-22px;left:50%;
    transform:translateX(-50%);background:var(--bg-elevated);color:var(--accent);
    padding:2px 6px;border-radius:4px;font-size:0.73em;font-family:'JetBrains Mono',monospace;
    border:1px solid var(--accent);}
  .bar-label{font-size:0.67em;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-weight:700;}

  .line-chart-wrap{margin-top:16px;position:relative;height:180px;padding:12px 0;}
  .line-chart-svg{width:100%;height:100%;overflow:visible;}
  .line-path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;
    filter:drop-shadow(0 0 4px rgba(245,158,11,0.5));
    stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 2s ease-out forwards;}
  @keyframes drawLine{to{stroke-dashoffset:0;}}
  .line-area{fill:url(#lineGradient);opacity:0;animation:fadeArea 2s 0.5s ease-out forwards;}
  @keyframes fadeArea{to{opacity:0.3;}}
  .line-point{fill:var(--bg-base);stroke:var(--accent);stroke-width:2.5;
    filter:drop-shadow(0 0 4px rgba(245,158,11,0.6));}
  .line-labels{display:flex;justify-content:space-around;margin-top:6px;padding:0 12px;}
  .line-label{font-size:0.67em;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-weight:700;}

  .audit-item{background:var(--bg-elevated);border:1px solid var(--border);
    border-right:3px solid var(--accent);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:8px;font-size:0.83em;}
  .audit-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .audit-item .user{color:var(--accent);font-weight:800;font-size:0.95em;}
  .audit-item .when{color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:0.87em;}
  .audit-item .body{color:var(--text-mid);line-height:1.7;}
  .audit-item .field-name{color:var(--text);font-weight:700;}
  .audit-item .old-val{color:var(--danger);text-decoration:line-through;font-family:'JetBrains Mono',monospace;}
  .audit-item .new-val{color:var(--success);font-weight:700;font-family:'JetBrains Mono',monospace;}

  .font-size-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .font-btn{flex:1;padding:10px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
    background:var(--bg-elevated);color:var(--text-mid);font-size:0.87em;
    font-family:inherit;cursor:pointer;font-weight:700;transition:0.15s;text-align:center;}
  .font-btn.active{background:rgba(245,158,11,0.12);border-color:var(--accent);color:var(--accent);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:flex-end;z-index:100;backdrop-filter:blur(4px);}
  .modal-backdrop.show{display:flex;}
  .modal{background:var(--bg-surface);border:1px solid var(--border-strong);
    border-radius:18px 18px 0 0;width:100%;max-width:600px;margin:0 auto;
    padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,0.5);}
  .modal h3{margin:0 0 6px;color:var(--accent);font-size:1.07em;font-weight:800;}
  .modal .sub{color:var(--text-dim);font-size:0.87em;margin-bottom:12px;}
  .close-modal{background:none;border:none;color:var(--text-dim);
    font-size:0.87em;margin-top:10px;width:100%;padding:12px;cursor:pointer;font-weight:700;}

  .modal-view-bar{display:flex;justify-content:space-between;align-items:center;
    margin:8px 0 12px;padding:10px 12px;border-radius:var(--radius-sm);
    background:var(--bg-input);border:1px solid var(--border);}
  .modal-view-bar .label{font-size:0.83em;color:var(--text-mid);font-weight:600;}

  .undo-bar{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));
    left:16px;right:16px;max-width:768px;margin:0 auto;background:var(--bg-elevated);
    border:1px solid var(--accent);border-radius:var(--radius);padding:12px 16px;
    display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.6);
    z-index:90;transform:translateY(200%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);font-size:0.9em;}
  .undo-bar.show{transform:translateY(0);}
  .undo-bar .undo-text{flex:1;color:var(--text);}
  .undo-bar button{background:var(--accent);color:#000;border:none;padding:6px 14px;
    border-radius:6px;font-size:0.83em;font-weight:800;cursor:pointer;font-family:inherit;}

  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
    background:var(--bg-elevated);color:var(--text);padding:12px 20px;
    border-radius:var(--radius);border:1px solid var(--border-strong);
    box-shadow:var(--shadow-hover);z-index:200;font-size:0.9em;font-weight:600;
    transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);max-width:90vw;text-align:center;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:var(--success);color:var(--success);}
  .toast.err{border-color:var(--danger);color:var(--danger);}
  .toast.warn{border-color:var(--warning);color:var(--warning);}

  .picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:center;justify-content:center;z-index:150;padding:20px;backdrop-filter:blur(4px);}
  .picker-overlay.show{display:flex;}
  .picker-box{background:var(--bg-surface);border:1px solid var(--border-strong);
    border-radius:var(--radius);width:100%;max-width:400px;padding:18px;max-height:80vh;overflow-y:auto;}
  .picker-box h4{color:var(--accent);font-size:1em;margin-bottom:12px;font-weight:800;}
  .picker-list{display:flex;flex-direction:column;gap:6px;}
  .picker-item{padding:12px 14px;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:var(--radius-sm);cursor:pointer;font-size:0.9em;font-weight:600;
    transition:0.15s;color:var(--text);}
  .picker-item:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px rgba(245,158,11,0.2);}
  .picker-item.selected{background:rgba(245,158,11,0.12);border-color:var(--accent);color:var(--accent);}

  .empty-state{text-align:center;color:var(--text-dim);padding:40px 10px;font-size:0.9em;}
  .spinner{text-align:center;color:var(--text-dim);font-size:0.87em;padding:20px;}

  .hint-sm{font-size:0.8em;color:var(--text-dim);margin-top:6px;line-height:1.7;}

  @media (max-width: 480px){
    .brand-text h1{font-size:0.93em;}
    .date-row{padding:4px 9px;font-size:0.77em;}
    .date-row .time{display:none;}
    .date-row .divider:nth-of-type(2){display:none;}
    .tool-btn{width:36px;height:36px;}
    .brand-mark{width:46px;height:46px;}
    .tab{font-size:0.73em;padding:10px 2px;}
    .tab svg{width:20px;height:20px;}
    .tab .count{font-size:0.6em;padding:1px 4px;}
    .dash-grid{grid-template-columns:1fr;}
    .neon-radio-group{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">
          <div class="pulse-ring"></div>
          <img id="brandIcon" src="icon-192.png" alt="Caspian">
        </div>
        <div class="brand-text">
          <h1>دفتر سریال کاسپین مبدل آمارد</h1>
          <div class="sub">
            <span class="conn-dot"></span>
            <span id="connStatus">ONLINE · 0 REC</span>
          </div>
          <div class="date-row">
            <svg class="cal-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
              <line x1="8" y1="3" x2="8" y2="7"/>
              <line x1="16" y1="3" x2="16" y2="7"/>
            </svg>
            <span class="day-name" id="dayName">—</span>
            <span class="divider"></span>
            <span class="date-full" id="dateFull">—</span>
            <span class="divider"></span>
            <span class="time" id="timeNow">—</span>
          </div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="tool-btn" id="themeBtn" title="حالت روز/شب">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></svg>
        </button>
        <button class="tool-btn" id="fullscreenBtn" title="تمام صفحه">
          <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button class="tool-btn" id="settingsBtn" title="تنظیمات">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="new">
        <span class="count" id="tabCountNew">۰</span>
        <svg viewBox="0 0 32 32"><rect x="9" y="9" width="14" height="18" rx="1"/><rect x="12" y="3" width="8" height="6"/><line x1="9" y1="14" x2="23" y2="14"/><line x1="9" y1="19" x2="23" y2="19"/><line x1="9" y1="24" x2="23" y2="24"/><circle cx="16" cy="11.5" r="1"/></svg>
        <span>ثبت</span>
      </div>
      <div class="tab" data-tab="pending">
        <span class="count" id="tabCountPending">۰</span>
        <svg viewBox="0 0 32 32"><rect x="3" y="11" width="26" height="12" rx="3"/><line x1="8" y1="11" x2="8" y2="23"/><line x1="24" y1="11" x2="24" y2="23"/></svg>
        <span>مدیریت</span>
      </div>
      <div class="tab" data-tab="dashboard">
        <span class="count" id="tabCountDash">۰</span>
        <svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="18" rx="2"/><polyline points="8 20 12 14 16 17 20 11 24 14"/></svg>
        <span>داشبورد</span>
      </div>
      <div class="tab" data-tab="report">
        <span class="count" id="tabCountReport">۰</span>
        <svg viewBox="0 0 32 32"><rect x="6" y="10" width="20" height="14" rx="2"/><line x1="6" y1="15" x2="26" y2="15"/><line x1="6" y1="19" x2="26" y2="19"/></svg>
        <span>گزارش</span>
      </div>
      <div class="tab" data-tab="audit">
        <span class="count" id="tabCountAudit">۰</span>
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><polyline points="16 9 16 16 21 19"/></svg>
        <span>تاریخچه</span>
      </div>
    </div>
  </div>
</header>

<div class="container" id="app">
  <div id="configWarning" class="msg err" style="display:none;margin-bottom:14px;cursor:pointer;" onclick="openSettings()">
    ⚠️ هنوز لینک اتصال تنظیم نشده. روی این کادر بزن.
  </div>

  <div class="smart-reminder" id="smartReminder" onclick="openAlerts()">
    <div class="rem-icon">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </div>
    <div class="rem-text" id="reminderText"></div>
  </div>

  <div id="tabNew" class="tab-content">
    <div class="year-row" id="yearRow"></div>
    <div class="cat-row" id="catRow"></div>
    <div class="card">
      <form id="newForm" onsubmit="return false;"></form>
      <button class="submit-btn" id="newSubmitBtn">ثبت سفارش</button>
      <button class="secondary-btn" id="copyPrevBtn" type="button">📋 کپی از سفارش قبلی</button>
      <div class="msg" id="newMsg"></div>
    </div>
  </div>

  <div id="tabPending" class="tab-content" style="display:none;">
    <div class="year-row" id="yearRow2"></div>
    <div class="cat-row" id="catRow2"></div>
    <div class="card">
      <div class="search-row">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="جستجو..." dir="auto">
          <button type="button" class="clear-btn" id="searchClear">✕</button>
        </div>
        <button type="button" class="filter-toggle active" id="onlyPendingBtn">ناقص‌ها</button>
        <button type="button" class="filter-toggle" id="advFilterBtn">⚙️</button>
      </div>
      <div class="adv-filters" id="advFilters">
        <label>وضعیت</label>
        <div class="neon-select-wrap"><select id="filterStatus"><option value="">همه</option></select></div>
        <label>شرکت بازرسی</label>
        <div class="neon-select-wrap">
          <select id="filterInspection">
            <option value="">همه</option>
            <option value="ISQI">ISQI</option>
            <option value="AJG">AJG</option>
          </select>
        </div>
        <label>مشتری</label>
        <div class="neon-select-wrap"><select id="filterCustomer"><option value="">همه</option></select></div>
        <button type="button" class="filter-toggle" id="clearFiltersBtn" style="margin-top:12px;padding:9px 14px;width:100%;">پاک کردن فیلترها</button>
      </div>
      <div id="pendingList" style="margin-top:14px;"></div>
    </div>
  </div>

  <div id="tabDashboard" class="tab-content" style="display:none;">
    <div class="year-row" id="yearRow3"></div>
    <div class="card">
      <div id="dashContent"></div>
      <button class="secondary-btn" id="refreshDashBtn" style="margin-top:16px;">🔄 بروزرسانی</button>
    </div>
  </div>

  <div id="tabReport" class="tab-content" style="display:none;">
    <div class="year-row" id="yearRow4"></div>
    <div class="cat-row" id="catRow4"></div>
    <div class="card">
      <div id="reportContent"></div>
      <button class="secondary-btn" id="exportCsvBtn" style="margin-top:16px;">📥 خروجی CSV</button>
    </div>
  </div>

  <div id="tabAudit" class="tab-content" style="display:none;">
    <div class="year-row" id="yearRow5"></div>
    <div class="card">
      <div id="auditContent"></div>
      <button class="secondary-btn" id="refreshAuditBtn" style="margin-top:16px;">🔄 بروزرسانی</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="sub" id="modalSub"></div>
    <div id="modalViewBar"></div>
    <div id="modalFields"></div>
    <button class="submit-btn" id="modalSaveBtn">ذخیره</button>
    <div class="msg" id="modalMsg"></div>
    <button class="close-modal" id="modalCloseBtn">بستن</button>
  </div>
</div>

<div class="modal-backdrop" id="copyBackdrop">
  <div class="modal">
    <h3>📋 کپی از سفارش قبلی</h3>
    <div class="sub">یه سفارش انتخاب کن</div>
    <div id="copyList"></div>
    <button class="close-modal" id="copyCloseBtn">بستن</button>
  </div>
</div>

<div class="modal-backdrop" id="settingsBackdrop">
  <div class="modal">
    <h3>⚙️ تنظیمات</h3>
    <label class="req">نام کاربر</label>
    <input type="text" id="settingsUser" placeholder="مثلاً: علی" dir="auto">
    <div class="hint-sm">نامت برای ثبت در تاریخچه تغییرات</div>
    <label class="req">لینک Web App</label>
    <input type="text" id="settingsUrl" placeholder="https://script.google.com/macros/s/.../exec" dir="ltr" style="text-align:left;">
    <label>اندازه فونت</label>
    <div class="font-size-row">
      <button class="font-btn" data-size="small">کوچک</button>
      <button class="font-btn active" data-size="medium">متوسط</button>
      <button class="font-btn" data-size="large">بزرگ</button>
      <button class="font-btn" data-size="xlarge">خیلی بزرگ</button>
    </div>
    <label style="margin-top:18px;">اعلان مرورگر</label>
    <button class="secondary-btn" id="notifPermBtn" style="margin-top:0;">🔔 فعال‌سازی اعلان‌ها</button>
    <div class="hint-sm" id="notifStatus">وضعیت: نامشخص</div>
    <button class="submit-btn" id="settingsSaveBtn">ذخیره و تست اتصال</button>
    <div class="msg" id="settingsMsg"></div>
    <button class="close-modal" id="settingsCloseBtn">بستن</button>
  </div>
</div>

<div class="modal-backdrop" id="alertsBackdrop">
  <div class="modal">
    <h3>🔔 سفارش‌های نزدیک به بارگیری</h3>
    <div class="sub">کمتر از ۷ روز مونده</div>
    <div id="alertsList"></div>
    <button class="close-modal" id="alertsCloseBtn">بستن</button>
  </div>
</div>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker-box">
    <h4 id="pickerTitle"></h4>
    <div class="picker-list" id="pickerList"></div>
    <button class="close-modal" id="pickerCloseBtn">بستن</button>
  </div>
</div>

<div class="undo-bar" id="undoBar">
  <div class="undo-text" id="undoText"></div>
  <button id="undoBtn">بازگردانی</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL_DEFAULT = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

function customerColorIndex(customer) {
  const s = String(customer || '').trim();
  if (!s) return 0;
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = ((hash << 5) - hash + s.charCodeAt(i)) | 0;
  return Math.abs(hash) % CUSTOMER_COLORS.length;
}

function toFa(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}
function todayJalaliStr() {
  const now = new Date();
  const [jy, jm, jd] = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  return `${jy}.${String(jm).padStart(2,'0')}.${String(jd).padStart(2,'0')}`;
}
function updateClock() {
  const now = new Date();
  const [jy, jm, jd] = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  const faDayNames = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  document.getElementById('dayName').textContent = faDayNames[(now.getDay() + 1) % 7];
  document.getElementById('dateFull').textContent = toFa(jy)+'/'+String(jm).padStart(2,'0')+'/'+String(jd).padStart(2,'0');
  document.getElementById('timeNow').textContent = toFa(String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'));
}

  t.className = 'toast ' + (type || '');
  t.classList.add('show');

  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}
function isWaterHeater(product) { return String(product || '').trim() === 'آبگرم کن'; }

async function callApi(payload) {
  const url = getScriptUrl();
  if (!isUrlConfigured()) { openSettings(); throw new Error('لینک تنظیم نشده'); }
  const params = new URLSearchParams();
  params.append('action', payload.action);
  params.append('year', currentYear);
  if (payload.category) params.append('category', payload.category);
  if (payload.row)      params.append('row', payload.row);
  if (payload.count)    params.append('count', payload.count);
  if (payload.serial)   params.append('serial', payload.serial);
  if (payload.status)   params.append('status', payload.status);
  if (payload.limit)    params.append('limit', payload.limit);
  if (payload.rows)     params.append('rows', JSON.stringify(payload.rows));
  if (payload.data)     params.append('data', JSON.stringify(payload.data));
  params.append('user', getUserName() || 'ناشناس');
  const sep = url.indexOf('?') === -1 ? '?' : '&';
  const res = await fetch(url + sep + params.toString(), { method: 'GET', redirect: 'follow' });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (_) { throw new Error('پاسخ JSON نبود: ' + text.slice(0, 150)); }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => switchTab(tab.dataset.tab);
});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  ['new','pending','dashboard','report','audit'].forEach(t => {
    const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
    if (el) el.style.display = (t === tab) ? 'block' : 'none';
  });
  if (tab === 'new') { buildYearRow('yearRow'); buildCatRow('catRow'); buildNewForm(); }
  else if (tab === 'pending') { buildYearRow('yearRow2'); buildCatRow('catRow2'); loadItems(); }
  else if (tab === 'dashboard') { buildYearRow('yearRow3'); loadDashboard(); }
  else if (tab === 'report') { buildYearRow('yearRow4'); buildCatRow('catRow4'); loadReport(); }
  else if (tab === 'audit') { buildYearRow('yearRow5'); loadAudit(); }
}

function buildYearRow(containerId) {
  const row = document.getElementById(containerId);
  if (!row) return;
  row.innerHTML = '';
  availableYears.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'year-btn' + (y === currentYear ? ' active' : '');
    btn.textContent = y;
    btn.onclick = () => {
      if (currentYear === y) return;
      currentYear = y;
      searchTerm = '';
      const inp = document.getElementById('searchInput');
      if (inp) inp.value = '';
      document.getElementById('searchClear').classList.remove('show');
      switchTab(currentTab);
    };
    row.appendChild(btn);
  });
}

function buildCatRow(containerId) {
  const row = document.getElementById(containerId);
  if (!row) return;
  row.innerHTML = '';
  Object.keys(CATEGORIES).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (key === currentCat ? ' active' : '');
    btn.textContent = CATEGORIES[key].label;
    btn.onclick = () => { currentCat = key; switchTab(currentTab); };
    row.appendChild(btn);
  });
}

function getCapacityUnits(product) {
  if (CAPACITY_UNITS[product]) return CAPACITY_UNITS[product];
  if (currentCat === 'steam') return ['kg/hr', 'lb/hr'];
  if (currentCat === 'hotwater') return ['kcal/hr'];
  return ['lit'];
}

      <label id="lbl_${id}">${f.label}</label>
      <div class="date-row">
        <input type="text" id="${id}" placeholder="">
        <button type="button" class="today-btn" onclick="refreshSerial()" title="سریال بعدی">🔄</button>
      </div>`;
  }
  if (f.key === 'product' && isNew) {
    const opts = (PRODUCT_OPTIONS[currentCat] || []).map(o => `<option value="${o.replace(/"/g,'&quot;')}"></option>`).join('');
    return `
      <label>${f.label}</label>
      <input type="text" id="${id}" list="dl_${currentCat}_product" placeholder="انتخاب یا تایپ..." autocomplete="off" oninput="onProductChange('${id}')">
      <datalist id="dl_${currentCat}_product">${opts}</datalist>`;
  }

    return `
      <label>${f.label}</label>
      <input type="text" id="${id}" inputmode="numeric" placeholder="کد مشتری..." autocomplete="off">`;
  }
  if (f.type === 'capacity') {
    return `
      <label>${f.label}</label>
      <div class="date-row">
        <input type="text" id="${id}" placeholder="مقدار..." inputmode="decimal">
        <button type="button" class="today-btn" id="unitBtn_${id}" onclick="pickUnit('${id}')">lit ▾</button>
      </div>`;
  }
  if (f.type === 'pressure') {
    return `
      <label>${f.label}</label>
      <div class="date-row">
        <input type="text" id="${id}" placeholder="مقدار فشار..." inputmode="decimal">
        <button type="button" class="today-btn" id="pressureUnitBtn_${id}" onclick="pickPressureUnit('${id}')">بار ▾</button>
      </div>`;
  }
  if (f.type === 'standard') {
    const opts = STANDARD_LIST.map(s => `<option value="${s}">${s}</option>`).join('');
    return `<label>${f.label}</label>
      <div class="neon-select-wrap"><select id="${id}"><option value="">انتخاب...</option>${opts}</select></div>`;
  }
  if (f.type === 'inspection') {
    const opts = INSPECTION_LIST.map(s => `<option value="${s}">${s}</option>`).join('');
    return `<label>${f.label}</label>
      <div class="neon-select-wrap"><select id="${id}"><option value="">انتخاب...</option>${opts}</select></div>`;
  }
  if (f.key === 'status') {
    const opts = STATUS_LIST.map(s => `<option value="${s}">${s}</option>`).join('');
    return `<label>${f.label}</label>
      <div class="neon-select-wrap"><select id="${id}">${opts}</select></div>`;
  }
  if (f.type === 'group') {
    const opts = GROUP_OPTIONS_TANKS.map(s =>
      `<div class="neon-radio${s === 'مخازن' ? ' selected' : ''}" data-val="${s}" onclick="selectGroupRadio(this, '${id}')">${s}</div>`
    ).join('');
    return `<label>${f.label}</label>
      <div class="neon-radio-group" id="group_${id}">${opts}</div>
      <input type="hidden" id="${id}" value="مخازن">`;
  }
  if (f.type === 'jdate') {
    return `<label>${f.label}</label>
      <div class="date-row">
        <input type="text" id="${id}" placeholder="۱۴۰۵.۰۶.۲۰" dir="ltr" style="text-align:left;">
        <button type="button" class="today-btn" onclick="document.getElementById('${id}').value = todayJalaliStr()">امروز</button>
      </div>`;
  }
  return `<label>${f.label}</label>

}

function selectGroupRadio(el, hiddenId) {
  const group = el.parentNode;
  group.querySelectorAll('.neon-radio').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  const hidden = document.getElementById(hiddenId);
  if (hidden) hidden.value = el.dataset.val;
}

function onProductChange(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const product = el.value.trim();
  const prefix = id.split('_')[0];
  const capInputId = prefix + '_capacity';
  const unitBtn = document.getElementById('unitBtn_' + capInputId);
  if (unitBtn) {
    const units = getCapacityUnits(product);
    capacityUnitCache[capInputId] = units[0];
    unitBtn.textContent = units[0] + ' ▾';
  }
  if (prefix === 'new') {
    const serialInput = document.getElementById('new_serial');
    const serialLabel = document.getElementById('lbl_new_serial');
    if (isWaterHeater(product)) {
      if (serialInput) { serialInput.value = ''; serialInput.disabled = true; serialInput.placeholder = '— (بدون سریال)'; }
      if (serialLabel) serialLabel.style.opacity = '0.5';
    } else {
      if (serialInput) { serialInput.disabled = false; serialInput.placeholder = ''; }
      if (serialLabel) serialLabel.style.opacity = '1';
      if (!serialInput.value) autofillSerial(false);
    }
  }
}

function pickUnit(inputId) {
  const input = document.getElementById(inputId);
  const product = (document.getElementById(inputId.replace('_capacity','_product')) || {}).value || '';
  const units = getCapacityUnits(String(product).trim());
  const current = capacityUnitCache[inputId] || units[0];
  openPicker('واحد ظرفیت', units, current, (selected) => {
    capacityUnitCache[inputId] = selected;
    const btn = document.getElementById('unitBtn_' + inputId);
    if (btn) btn.textContent = selected + ' ▾';
    if (input) input.placeholder = 'مقدار (' + selected + ')...';
  });
}

function pickPressureUnit(inputId) {
  const input = document.getElementById(inputId);
  const current = pressureUnitCache[inputId] || 'بار';
  openPicker('واحد فشار', PRESSURE_UNITS, current, (selected) => {
    pressureUnitCache[inputId] = selected;
    const btn = document.getElementById('pressureUnitBtn_' + inputId);
    if (btn) btn.textContent = selected + ' ▾';
    if (input) input.placeholder = 'مقدار (' + selected + ')...';
  });
}

function openPicker(title, items, current, onPick) {
  document.getElementById('pickerTitle').textContent = title;
  const list = document.getElementById('pickerList');
  list.innerHTML = '';
  items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'picker-item' + (it === current ? ' selected' : '');
    d.textContent = it;
    d.onclick = () => { onPick(it); closePicker(); };
    list.appendChild(d);
  });
  document.getElementById('pickerOverlay').classList.add('show');
}
function closePicker() { document.getElementById('pickerOverlay').classList.remove('show'); }
document.getElementById('pickerCloseBtn').onclick = closePicker;
document.getElementById('pickerOverlay').onclick = e => { if (e.target.id === 'pickerOverlay') closePicker(); };

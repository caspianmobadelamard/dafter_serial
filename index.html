<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>دفتر سریال کاسپین مبدل آمارد</title>
<meta name="theme-color" content="#131a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر سریال">
<link rel="apple-touch-icon" href="icon-ios.png">
<link rel="icon" type="image/png" href="icon-android.png">

<style>
:root {
  --accent: #f59e0b;
  --accent-dim: #b87208;
  --steel: #4a9eff;
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #ef4444;
  --cyan: #22d3ee;
  --purple: #a78bfa;
  --radius: 6px;
}
html[data-theme="dark"] {
  --bg-base: #131a26;
  --bg-surface: #1a2233;
  --bg-elevated: #212b3f;
  --bg-input: #0f1520;
  --border: #2d3748;
  --border-strong: #3f4c61;
  --text: #d4d8dd;
  --text-mid: #8b929b;
  --text-dim: #5a6373;
}
html[data-theme="light"] {
  --bg-base: #eef1f5;
  --bg-surface: #ffffff;
  --bg-elevated: #f5f7fa;
  --bg-input: #e8ecf1;
  --border: #d4dae3;
  --border-strong: #b4bec9;
  --text: #1a2029;
  --text-mid: #55606e;
  --text-dim: #8b95a4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-base);
  color: var(--text);
  font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}
body {
  background-image:
    linear-gradient(rgba(245,158,11,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,158,11,0.02) 1px, transparent 1px);
  background-size: 24px 24px;
  padding-bottom: 100px;
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-surface);
  border-bottom: 2px solid var(--border-strong);
  box-shadow: 0 2px 0 rgba(245,158,11,0.15);
}
.topbar-inner { max-width: 780px; margin: 0 auto; padding: 12px 16px 0; }
.topbar-row {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 14px; }

.brand-mark {
  width: 52px; height: 52px;
  background: var(--bg-input);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
}
.brand-mark::before {
  content: ''; position: absolute; inset: 0;
  border-radius: var(--radius);
  border: 2px solid var(--accent);
  animation: neonBorderColor 4s ease-in-out infinite;
  pointer-events: none;
}
.brand-mark::after {
  content: ''; position: absolute; inset: 3px;
  border: 1px dashed rgba(245,158,11,0.35);
  border-radius: 3px;
  animation: neonDashed 4s ease-in-out infinite;
  pointer-events: none;
}
.brand-mark svg {
  width: 28px; height: 28px;
  animation: neonIcon 4s ease-in-out infinite;
}
.brand-mark .pulse-ring {
  position: absolute; inset: -4px;
  border-radius: calc(var(--radius) + 2px);
  border: 1px solid transparent;
  animation: pulseRing 4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes neonBorderColor {
  0%, 100% { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.7), inset 0 0 8px rgba(245,158,11,0.15); }
  25% { border-color: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,0.7), inset 0 0 8px rgba(34,211,238,0.15); }
  50% { border-color: #a78bfa; box-shadow: 0 0 8px rgba(167,139,250,0.7), inset 0 0 8px rgba(167,139,250,0.15); }
  75% { border-color: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.7), inset 0 0 8px rgba(74,222,128,0.15); }
}
@keyframes neonDashed {
  0%, 100% { border-color: rgba(245,158,11,0.35); }
  25% { border-color: rgba(34,211,238,0.35); }
  50% { border-color: rgba(167,139,250,0.35); }
  75% { border-color: rgba(74,222,128,0.35); }
}
@keyframes neonIcon {
  0%, 100% { stroke: #f59e0b; filter: drop-shadow(0 0 4px rgba(245,158,11,0.7)); }
  25% { stroke: #22d3ee; filter: drop-shadow(0 0 4px rgba(34,211,238,0.7)); }
  50% { stroke: #a78bfa; filter: drop-shadow(0 0 4px rgba(167,139,250,0.7)); }
  75% { stroke: #4ade80; filter: drop-shadow(0 0 4px rgba(74,222,128,0.7)); }
}
@keyframes pulseRing {
  0%, 100% { border-color: transparent; transform: scale(1); opacity: 1; }
  50% { border-color: rgba(245,158,11,0.4); transform: scale(1.08); opacity: 0.6; }
}

.brand-text h1 { font-size: 15px; font-weight: 800; line-height: 1.2; }
.brand-text .sub {
  font-size: 10.5px; color: var(--text-dim);
  margin-top: 3px;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 6px;
}
.conn-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 6px var(--success);
}
.conn-dot.offline { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

.date-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px;
  padding: 4px 10px;
  background: linear-gradient(90deg, rgba(245,158,11,0.08), rgba(245,158,11,0.02));
  border: 1px solid rgba(245,158,11,0.2);
  border-radius: 4px;
  font-size: 11.5px;
  width: fit-content;
}
.date-row .cal-icon { width: 13px; height: 13px; stroke: var(--accent); fill: none; stroke-width: 2; flex-shrink: 0; }
.date-row .day-name { color: var(--accent); font-weight: 700; }
.date-row .divider { width: 1px; height: 11px; background: rgba(245,158,11,0.3); }
.date-row .date-full { color: var(--text); font-weight: 600; font-family: 'Courier New', monospace; letter-spacing: 0.5px; }
.date-row .time { color: var(--text-mid); font-size: 10.5px; font-family: 'Courier New', monospace; }

.topbar-actions { display: flex; gap: 6px; }
.tool-btn {
  width: 36px; height: 36px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-mid);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.15s;
}
.tool-btn:hover { color: var(--accent); border-color: var(--accent); }
.tool-btn:active { transform: scale(0.94); }
.tool-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.tabs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--border);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  overflow: hidden;
  margin-top: 12px;
}
.tab {
  background: var(--bg-elevated);
  padding: 12px 6px;
  cursor: pointer; transition: 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 12px; font-weight: 700;
  color: var(--text-mid);
  position: relative;
  user-select: none;
}
.tab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--bg-input); color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.tab .count {
  position: absolute; top: 3px; left: 5px;
  font-size: 8.5px; padding: 1px 4px;
  background: rgba(245,158,11,0.15); color: var(--accent);
  border-radius: 3px;
  font-family: 'Courier New', monospace; font-weight: 800;
}
.tab.active .count { background: var(--accent); color: #000; }

.container { max-width: 780px; margin: 0 auto; padding: 16px 16px 0; }

.alert-strip {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-right: 3px solid var(--warning);
  border-radius: var(--radius);
  padding: 10px 14px; margin-bottom: 16px;
}
.alert-strip .indicator {
  width: 28px; height: 28px;
  background: rgba(251,191,36,0.1);
  border: 1px solid rgba(251,191,36,0.4);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.alert-strip .indicator svg { width: 15px; height: 15px; stroke: var(--warning); fill: none; stroke-width: 2; }
.alert-strip .body { flex: 1; }
.alert-strip .body b { font-size: 12.5px; color: var(--warning); display: block; }
.alert-strip .body span { font-size: 11px; color: var(--text-dim); margin-top: 2px; display: block; }
.alert-strip .action {
  background: var(--warning); color: #000; border: none;
  padding: 6px 12px; border-radius: var(--radius);
  font-family: inherit; font-size: 11px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.3px;
}

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.stat {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 10px 8px;
  position: relative; overflow: hidden;
}
.stat::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 2px; background: var(--accent); }
.stat.warn::before { background: var(--warning); }
.stat.bad::before { background: var(--danger); }
.stat.good::before { background: var(--success); }
.stat .row { display: flex; align-items: baseline; justify-content: space-between; }
.stat .num { font-family: 'Courier New', monospace; font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -0.5px; }
.stat.warn .num { color: var(--warning); }
.stat.bad .num { color: var(--danger); }
.stat.good .num { color: var(--success); }
.stat .icon-tiny { width: 14px; height: 14px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; }
.stat .lbl { font-size: 9.5px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.5px; font-family: 'Courier New', monospace; }

.toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
.search-box { flex: 1; position: relative; }
.search-box input {
  width: 100%; background: var(--bg-input);
  border: 1px solid var(--border-strong); color: var(--text);
  border-radius: var(--radius); padding: 11px 40px 11px 44px;
  font-family: inherit; font-size: 13px; transition: 0.15s;
}
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
.search-box .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-dim); fill: none; stroke-width: 2; pointer-events: none; }
.chip {
  background: var(--bg-surface); border: 1px solid var(--border-strong);
  color: var(--text-mid); border-radius: var(--radius);
  padding: 0 14px; font-family: inherit; font-size: 11.5px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  white-space: nowrap; transition: 0.15s;
}
.chip svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
.chip.active { background: var(--warning); color: #000; border-color: var(--warning); }

.card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-right: 3px solid var(--border-strong);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
  cursor: pointer; transition: 0.15s; position: relative;
}
.card:hover { background: var(--bg-elevated); border-color: var(--border-strong); }
.card.complete { border-right-color: var(--success); }
.card.missing { border-right-color: var(--warning); }
.card.urgent { border-right-color: var(--danger); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card-icon {
  width: 34px; height: 34px; flex-shrink: 0;
  background: var(--bg-input); border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
}
.card-icon svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.card.missing .card-icon svg { stroke: var(--warning); }
.card.urgent .card-icon svg { stroke: var(--danger); }
.card.complete .card-icon svg { stroke: var(--success); }
.card-serial { font-family: 'Courier New', monospace; font-size: 14.5px; font-weight: 800; color: var(--text); letter-spacing: 0.5px; line-height: 1.2; }
.card-serial.no-serial { color: var(--text-mid); font-style: italic; }
.card-prod { font-size: 11.5px; color: var(--text-mid); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.customer-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'Courier New', monospace; font-size: 9.5px;
  padding: 2px 6px; border-radius: 3px;
  font-weight: 700; letter-spacing: 0.3px;
  border: 1px solid;
  margin-top: 3px;
}
.customer-dot { width: 5px; height: 5px; border-radius: 50%; }

.status-badge {
  font-family: 'Courier New', monospace; font-size: 9.5px; font-weight: 800;
  padding: 4px 8px; border-radius: 3px; letter-spacing: 0.5px;
  text-transform: uppercase; white-space: nowrap;
  border: 1px solid; display: flex; align-items: center; gap: 4px;
  flex-shrink: 0;
}
.status-badge svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.status-badge.ok { color: var(--success); background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.3); }
.status-badge.warn { color: var(--warning); background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.3); }
.status-badge.urgent { color: var(--danger); background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); }

.progress-block { margin: 8px 0 10px; }
.progress-head { display: flex; justify-content: space-between; font-family: 'Courier New', monospace; font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.5px; margin-bottom: 5px; }
.progress-head .pct { color: var(--text); font-weight: 800; }
.progress-track { height: 6px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; transition: width 0.5s ease; background-size: 8px 8px; background-image: linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.1) 75%, transparent 75%, transparent); }
.progress-fill.high { background-color: var(--success); }
.progress-fill.mid { background-color: var(--warning); }
.progress-fill.low { background-color: var(--danger); }

.specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; font-size: 11px; margin-top: 8px; }
.spec { display: flex; align-items: center; gap: 7px; color: var(--text-mid); padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.04); }
.spec:last-child, .spec:nth-last-child(2):nth-child(odd) { border-bottom: none; }
.spec .k { color: var(--text-dim); font-family: 'Courier New', monospace; font-size: 9.5px; letter-spacing: 0.3px; min-width: 45px; }
.spec .v { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.issues { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.issue-tag {
  font-size: 10px; padding: 3px 8px;
  background: rgba(239,68,68,0.08); color: var(--danger);
  border: 1px solid rgba(239,68,68,0.2); border-radius: 3px;
  display: flex; align-items: center; gap: 4px;
  font-family: 'Courier New', monospace; letter-spacing: 0.3px;
}
.issue-tag svg { width: 9px; height: 9px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; }

.fab {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #000; border: none;
  border-radius: var(--radius); padding: 14px 28px;
  font-family: inherit; font-size: 13.5px; font-weight: 800;
  letter-spacing: 0.5px; cursor: pointer; z-index: 40;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.2), 0 0 30px rgba(245,158,11,0.2);
  transition: 0.15s;
}
.fab svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }
.fab:active { transform: translateX(-50%) scale(0.96); }

.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--success); color: #04231a;
  padding: 11px 16px; border-radius: var(--radius);
  font-size: 12.5px; font-weight: 700; z-index: 60;
  opacity: 0; pointer-events: none; transition: 0.25s;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); pointer-events: auto; }
.toast.error { background: var(--danger); color: white; }
.toast .undo-btn {
  background: rgba(0,0,0,0.2); color: inherit;
  border: none; border-radius: 3px;
  padding: 5px 10px; font-size: 11px; font-weight: 800;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}
.toast .timer-bar {
  position: absolute; bottom: 0; right: 0; height: 3px;
  background: rgba(0,0,0,0.25);
  animation: shrink 10s linear forwards;
  border-radius: 0 0 var(--radius) 0;
}
@keyframes shrink { from { width: 100%; } to { width: 0%; } }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
.overlay.open { display: flex; }
.sheet {
  background: var(--bg-surface); width: 100%; max-width: 540px;
  border-radius: 14px 14px 0 0; max-height: 92vh; overflow-y: auto;
  padding: 16px 18px 24px;
  border-top: 2px solid var(--accent);
  animation: slideUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.sheet-handle { width: 36px; height: 4px; background: var(--text-dim); border-radius: 99px; margin: 0 auto 14px; opacity: 0.5; }
.sheet h2 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
.sheet .sub { font-size: 11.5px; color: var(--text-dim); margin-bottom: 16px; font-family: 'Courier New', monospace; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-mid); margin-bottom: 5px; font-weight: 600; }
.field label.req::after { content: ' *'; color: var(--danger); }
.field input, .field textarea, .field select {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border-strong);
  color: var(--text); border-radius: var(--radius);
  padding: 11px 13px; font-size: 13.5px; font-family: inherit;
  transition: 0.15s;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
.field textarea { resize: vertical; min-height: 60px; }
.field select { cursor: pointer; }
.field .row-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.field .hint { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; font-family: 'Courier New', monospace; }
.field.hidden { display: none; }
.date-hint { font-size: 10.5px; color: var(--warning); margin-top: 4px; font-family: 'Courier New', monospace; }
.water-heater-note {
  background: rgba(74,158,255,0.08);
  border: 1px dashed rgba(74,158,255,0.4);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 11px;
  color: var(--steel);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-actions { display: flex; gap: 10px; margin-top: 18px; }
.btn { flex: 1; padding: 12px; border-radius: var(--radius); font-size: 13.5px; font-weight: 800; border: none; font-family: inherit; cursor: pointer; transition: 0.15s; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #000; }
.btn-secondary { background: var(--bg-elevated); color: var(--text-mid); border: 1px solid var(--border); }
.btn-danger { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.25); }

.setup-box {
  background: var(--bg-surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 20px; margin: 20px 14px;
  font-size: 13px; line-height: 2;
}
.import-banner {
  background: rgba(245,158,11,0.05); border: 1px dashed var(--accent);
  border-radius: var(--radius); padding: 14px; margin-top: 16px;
  font-size: 12px; line-height: 1.8;
}

@media (max-width: 480px) {
  .stat .num { font-size: 18px; }
  .brand-text h1 { font-size: 13px; }
  .brand-mark { width: 44px; height: 44px; }

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toFa(num){ return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function hashColor(str){
  if (!str) return 'var(--text-dim)';
  const palette = ['#4a9eff','#a78bfa','#f59e0b','#4ade80','#22d3ee','#f472b6','#fb923c','#818cf8'];
  let h = 0;
  for (let i = 0; i < String(str).length; i++) h = String(str).charCodeAt(i) + ((h << 5) - h);
  return palette[Math.abs(h) % palette.length];
}

// پارس ظرفیت به مقدار + واحد
function parseCapacity(str) {
  if (!str) return { value: '', unit: '' };
  const s = String(str).trim();
  const units = [
    'kg/hr','lb/hr','kcal/hr','Kcal/hr','kcal.hr',
    'kg','lb','kcal','ft','lit','gal','lp','gr','grn','gpm','GPM',
    'لیتر','گالن','گرین','کیلوگرین','گرم',
    'متر مکعب','کیلوکالری بر ساعت','پوند بر ساعت','کیلوگرم بر ساعت'
  ];
  for (const u of units) {
    const escaped = u.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp('\\s*' + escaped + '\\s*$', 'i');
    if (regex.test(s)) {
      return { value: s.replace(regex, '').trim(), unit: u };
    }
  }
  return { value: s, unit: '' };
}

// ترکیب مقدار + واحد
function combineCapacity(value, unit) {
  value = String(value || '').trim();
  unit = String(unit || '').trim();
  if (!value) return '';
  if (!unit) return value;
  return value + ' ' + unit;
}

/* ============================================================
   Jalali Date
============================================================ */
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}
function updateDate() {
  const now = new Date();
  const [jy, jm, jd] = toJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const faDayNames = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  const faDayIndex = (now.getDay() + 1) % 7;
  document.getElementById('dayName').textContent = faDayNames[faDayIndex];
  document.getElementById('dateFull').textContent = toFa(jy) + '/' + String(jm).padStart(2,'0') + '/' + String(jd).padStart(2,'0');
  document.getElementById('timeNow').textContent = toFa(String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'));
}
updateDate();
setInterval(updateDate, 30000);

============================================================ */

  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  if (theme === 'dark') icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

}
function initTheme() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
}
function toggleTheme() {
  const c = document.documentElement.getAttribute('data-theme') || 'dark';
  const n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem('theme', n);
  updateThemeIcon(n);
}

/* ============================================================
   Toast
============================================================ */
let toastTimer = null;
function toastMsg(msg, isError, undoCallback) {
  const t = document.getElementById('toast');
  t.className = 'toast show' + (isError ? ' error' : '');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  if (undoCallback) {
    const btn = document.createElement('button');
    btn.className = 'undo-btn';
    btn.innerHTML = 'بازگردانی';
    btn.onclick = () => {
      clearTimeout(toastTimer);
      t.classList.remove('show');
      undoCallback();
    };
    t.appendChild(btn);
    const bar = document.createElement('div');
    bar.className = 'timer-bar';
    t.appendChild(bar);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 10000);
  } else {
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }
}

/* ============================================================
   API
============================================================ */
async function apiGet() {
  const res = await fetch(API_URL, { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error('network');
  return res.json();
}
async function apiPost(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('network');
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function refreshAll() {
  const data = await apiGet();
  allData.steam = data.steam || [];
  allData.hotwater = data.hotwater || [];
  allData.tanks = data.tanks || [];
}

function updateConnStatus(online) {
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  if (!dot || !text) return;
  if (online) {
    dot.classList.remove('offline');
    const total = allData.steam.length + allData.hotwater.length + allData.tanks.length;
    text.textContent = 'ONLINE · ' + toFa(total) + ' REC';
  } else {
    dot.classList.add('offline');
    text.textContent = 'OFFLINE — اتصال را بررسی کن';
  }
}

/* ============================================================
   Missing / Progress
============================================================ */
function isMissing(cat, rec) {
  return CATS[cat].fields.some(f => f.critical && !rec[f.key]);
}
function missingFieldsOf(cat, rec) {
  return CATS[cat].fields.filter(f => f.critical && !rec[f.key]).map(f => f.label);
}
function progressOf(cat, rec) {
  const fields = CATS[cat].fields.filter(f => f.key !== 'شماره سریال');
  if (!fields.length) return 0;
  const filled = fields.filter(f => rec[f.key] && String(rec[f.key]).trim()).length;
  return Math.round((filled / fields.length) * 100);
}

function catIcon(cat) {
  if (cat === 'steam') return `<svg viewBox="0 0 32 32"><rect x="9" y="9" width="14" height="18" rx="1"/><rect x="12" y="3" width="8" height="6"/><line x1="9" y1="14" x2="23" y2="14"/><line x1="9" y1="19" x2="23" y2="19"/><line x1="9" y1="24" x2="23" y2="24"/><circle cx="16" cy="11.5" r="1"/></svg>`;

  document.getElementById('alertText').textContent = 'این سفارش‌ها فیلدهای حیاتی ناقص دارند';
  document.getElementById('alertAction').onclick = () => {
    filterMissingOnly = true;
    document.getElementById('filterMissing').classList.add('active');

function renderList() {
  const conf = CATS[currentCat];
  let list = (allData[currentCat] || []).slice();
  if (searchTerm.trim()) {
    const q = searchTerm.trim().toLowerCase();
    list = list.filter(r => Object.values(r).some(v => String(v || '').toLowerCase().includes(q)));
  }
  if (filterMissingOnly) list = list.filter(r => isMissing(currentCat, r));
  list = list.reverse();

  const container = document.getElementById('list');
  if (list.length === 0) {
    container.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding:50px 20px; font-family:'Courier New',monospace;">موردی یافت نشد</div>`;
    return;
  }

  const titleKey = conf.fields[1].key;

  container.innerHTML = list.map((r, idx) => {
    const serial = r['شماره سریال'] || '';
    const prod = r[titleKey] || '';
    const missing = isMissing(currentCat, r);
    const urgent = missing && missingFieldsOf(currentCat, r).length >= 2;
    const progress = progressOf(currentCat, r);
    const cust = r['نام مشتری'];
    const custColor = hashColor(cust);
    const custHtml = cust ? `<div class="customer-badge" style="color:${custColor};border-color:${custColor}55;background:${custColor}14;"><span class="customer-dot" style="background:${custColor};"></span>مشتری ${escapeHtml(cust)}</div>` : '';
    const badgeClass = urgent ? 'urgent' : (missing ? 'warn' : 'ok');
    const badgeLabel = urgent ? 'URGENT' : (missing ? 'PARTIAL' : 'OK');
    const progressClass = progress >= 80 ? 'high' : (progress >= 40 ? 'mid' : 'low');
    const cardClass = urgent ? 'urgent' : (missing ? 'missing' : 'complete');
    const mtags = missingFieldsOf(currentCat, r);
    const serialDisplay = serial || '<span style="color:var(--text-mid);font-style:italic;">بدون سریال</span>';

    // برای استفاده در کلیک، ایندکس اصلی رو ذخیره می‌کنیم
    const realIdx = allData[currentCat].indexOf(r);

    let specsHtml = '';
    const cap = r['ظرفیت محصول'];
    const press = r['فشار کاری'] || r['ملاحظات'];
    const insComp = r['نام شرکت بازرسی'];
    const orderDate = r['تاریخ سفارش'];
    const hydroDate = r['تاریخ تست هیدرو'];
    const insCode = r['کد بازرسی'];
    if (cap) specsHtml += `<div class="spec"><span class="k">ظرفیت</span><span class="v">${escapeHtml(cap)}</span></div>`;
    if (press) specsHtml += `<div class="spec"><span class="k">فشار</span><span class="v">${escapeHtml(press)}</span></div>`;
    if (insComp) specsHtml += `<div class="spec"><span class="k">بازرسی</span><span class="v">${escapeHtml(insComp)}</span></div>`;
    if (orderDate) specsHtml += `<div class="spec"><span class="k">سفارش</span><span class="v">${escapeHtml(orderDate)}</span></div>`;
    if (hydroDate) specsHtml += `<div class="spec"><span class="k">هیدرو</span><span class="v">${escapeHtml(hydroDate)}</span></div>`;
    if (insCode) specsHtml += `<div class="spec"><span class="k">کد INS</span><span class="v">${escapeHtml(insCode)}</span></div>`;

    return `<div class="card ${cardClass}" data-idx="${realIdx}">
      <div class="card-top">
        <div class="card-id">
          <div class="card-icon">${catIcon(currentCat)}</div>
          <div>
            <div class="card-serial ${!serial ? 'no-serial' : ''}">${serialDisplay}</div>
            <div class="card-prod">${escapeHtml(prod)}</div>
            ${custHtml}
          </div>
        </div>
        <span class="status-badge ${badgeClass}">
          <svg viewBox="0 0 24 24">${badgeClass === 'ok' ? '<polyline points="20 6 9 17 4 12"/>' : (badgeClass === 'urgent' ? '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>')}</svg>
          ${badgeLabel}
        </span>
      </div>
      <div class="progress-block">
        <div class="progress-head"><span>وضعیت تکمیل</span><span class="pct">${toFa(progress)}٪</span></div>
        <div class="progress-track"><div class="progress-fill ${progressClass}" style="width:${progress}%"></div></div>
      </div>
      <div class="specs">${specsHtml}</div>
      ${mtags.length ? `<div class="issues">${mtags.map(t => `<span class="issue-tag">بدون ${t}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');

  container.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.getAttribute('data-idx'));
      openForm(allData[currentCat][idx]);

}

/* ============================================================
   محصول و واحد — کمک‌کننده
============================================================ */
function getUnitOptionsFor(cat, productName) {
  if (cat === 'tanks') {
    if (productName && CATS.tanks.productUnits[productName]) {
      return CATS.tanks.productUnits[productName].units || [];
    }
    return CATS.tanks.capacityUnits || [];
  }
  return CATS[cat].capacityUnits || [];
}

function isNoSerialProduct(cat, productName) {
  if (cat === 'tanks') {
    const cfg = CATS.tanks.productUnits[productName];
    return cfg && cfg.noSerial;
  }
  return false;
}

function suggestNextSerial(cat) {
  const list = allData[cat] || [];
  let max = 0;
  list.forEach(r => {
    const m = String(r['شماره سریال'] || '').match(/(\d+)/);
    if (m) { const n = parseInt(m[1]); if (n > max) max = n; }
  });
  const prefix = CATS[cat].serialPrefix;
  if (cat === 'tanks') return String(max + 1 || 1);
  return max ? `${prefix} ${max + 1}` : `${prefix} 1`;
}

/* ============================================================
   FORM
============================================================ */
function openForm(record) {
  editingRecord = record || null;
  const conf = CATS[currentCat];
  const rec = editingRecord || {};
  const isNew = !editingRecord;

  // مقدار فعلی محصول
  const productKey = conf.fields[1].key;
  const currentProduct = rec[productKey] || '';
  const currentSerial = rec['شماره سریال'] || '';

  // مقدار فعلی ظرفیت
  const capParsed = parseCapacity(rec['ظرفیت محصول'] || '');

  // واحدهای مجاز برای محصول فعلی
  const productIsKnown = !currentProduct || conf.productOptions.includes(currentProduct);
  const unitOptions = getUnitOptionsFor(currentCat, currentProduct);

  // آیا این محصول نیاز به سریال دارد؟
  const noSerial = isNoSerialProduct(currentCat, currentProduct);

  // رندر فیلدها
  const fieldsHtml = conf.fields.map(f => {
    const labelClass = f.req ? 'req' : '';

    if (f.type === 'serial') {
      const hidden = noSerial ? 'hidden' : '';
      const val = currentSerial || (isNew ? suggestNextSerial(currentCat) : '');
      return `<div class="field ${hidden}" id="field-serial" data-key="${escapeHtml(f.key)}">
        <label class="${labelClass}">${f.label}</label>
        <input type="text" data-key="${escapeHtml(f.key)}" value="${escapeHtml(val)}">
      </div>`;
    }

    if (f.type === 'product') {
      const isCustom = currentProduct && !conf.productOptions.includes(currentProduct);
      const optionsHtml = conf.productOptions.map(o =>
        `<option value="${escapeHtml(o)}" ${o === currentProduct ? 'selected' : ''}>${escapeHtml(o)}</option>`
      ).join('');
      return `<div class="field">
        <label class="${labelClass}">${f.label}</label>
        <select id="productSelect" data-key="${escapeHtml(f.key)}">
          <option value="">— انتخاب کنید —</option>
          ${optionsHtml}
          <option value="__other__" ${isCustom ? 'selected' : ''}>سایر (ورود دستی)</option>
        </select>
        <input type="text" id="productCustomInput" placeholder="نام محصول را وارد کنید"
          value="${isCustom ? escapeHtml(currentProduct) : ''}"
          style="margin-top:8px;${isCustom ? '' : 'display:none;'}">
      </div>`;
    }

    if (f.type === 'capacity') {
      const unitOpts = unitOptions.length ? unitOptions : ['kg/hr','lb/hr'];
      const isCustomUnit = capParsed.unit && !unitOpts.includes(capParsed.unit);
      const unitOptionsHtml = unitOpts.map(u =>
        `<option value="${escapeHtml(u)}" ${u === capParsed.unit ? 'selected' : ''}>${escapeHtml(u)}</option>`
      ).join('');
      return `<div class="field">
        <label>${f.label}</label>
        <div class="row-2">
          <input type="text" id="capacityValue" placeholder="مقدار (مثلا: 300)" value="${escapeHtml(capParsed.value)}">
          <select id="capacityUnit">
            ${unitOptionsHtml}
            <option value="__other__" ${isCustomUnit ? 'selected' : ''}>سایر</option>
          </select>
        </div>
        <input type="text" id="capacityCustomUnit" placeholder="واحد را وارد کنید"
          value="${isCustomUnit ? escapeHtml(capParsed.unit) : ''}"
          style="margin-top:8px;${isCustomUnit ? '' : 'display:none;'}">
      </div>`;
    }

    if (f.type === 'textarea') {
      return `<div class="field"><label class="${labelClass}">${f.label}</label><textarea rows="2" data-key="${escapeHtml(f.key)}">${escapeHtml(rec[f.key] || '')}</textarea></div>`;
    }
    if (f.type === 'date') {
      return `<div class="field"><label class="${labelClass}">${f.label}</label><input type="text" inputmode="numeric" placeholder="مثلا: 1405.06.20" data-key="${escapeHtml(f.key)}" value="${escapeHtml(rec[f.key] || '')}">${f.critical ? '<div class="date-hint">⚠ این فیلد اغلب فراموش می‌شود</div>' : ''}</div>`;
    }
    return `<div class="field"><label class="${labelClass}">${f.label}</label><input type="text" placeholder="${f.placeholder || ''}" data-key="${escapeHtml(f.key)}" value="${escapeHtml(rec[f.key] || '')}"></div>`;
  }).join('');

  const waterHeaterNote = noSerial
    ? '<div class="water-heater-note">💧 این محصول سریال نمی‌گیرد — سریال به محصول بعدی تعلق می‌گیرد</div>'
    : '';

  document.getElementById('sheetContent').innerHTML = `
    <h2>${isNew ? '➕ ثبت سفارش جدید' : '✏ ویرایش سفارش'} — ${conf.label}</h2>
    <div class="sub">${isNew ? 'فقط اطلاعات ضروری رو وارد کن، بقیه بعدا' : 'فیلدهای خالی رو تکمیل کن'}</div>
    ${waterHeaterNote}
    <div id="formFields">${fieldsHtml}</div>
    <div class="form-actions">
      ${!isNew ? '<button class="btn btn-danger" id="deleteBtn">🗑 حذف</button>' : ''}
      <button class="btn btn-secondary" id="cancelBtn">انصراف</button>
      <button class="btn btn-primary" id="saveBtn">💾 ذخیره</button>
    </div>`;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  document.getElementById('saveBtn').addEventListener('click', () => submitForm(isNew));

  // لیسنرهای داینامیک
  setupFormListeners();

  const delBtn = document.getElementById('deleteBtn');
  if (delBtn) {
    delBtn.addEventListener('click', () => {
      if (confirm('این سفارش حذف بشه؟')) {
        handleDelete(rec);
      }
    });
  }
}

function setupFormListeners() {
  const productSelect = document.getElementById('productSelect');
  const productCustom = document.getElementById('productCustomInput');
  const capacityUnit = document.getElementById('capacityUnit');
  const capacityCustomUnit = document.getElementById('capacityCustomUnit');
  const serialField = document.getElementById('field-serial');

  function refreshUnitOptions() {
    let productName = '';
    if (productSelect) {
      if (productSelect.value === '__other__') {
        productName = productCustom ? productCustom.value : '';
      } else {
        productName = productSelect.value;
      }
    }
    const units = getUnitOptionsFor(currentCat, productName);
    const currentUnit = capacityUnit ? capacityUnit.value : '';
    if (capacityUnit && units.length) {
      const isCurrentCustom = currentUnit === '__other__';
      const hasCurrent = units.includes(currentUnit);
      if (!hasCurrent && !isCurrentCustom) {
        // واحد فعلی در لیست جدید نیست → سایر
        capacityUnit.innerHTML = units.map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join('')
          + `<option value="__other__" selected>سایر</option>`;
        if (capacityCustomUnit) {
          capacityCustomUnit.value = currentUnit || '';
          capacityCustomUnit.style.display = 'block';
        }
      } else {
        const keptValue = isCurrentCustom ? '__other__' : currentUnit;
        capacityUnit.innerHTML = units.map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join('')
          + `<option value="__other__" ${isCurrentCustom ? 'selected' : ''}>سایر</option>`;
        if (capacityUnit.value !== keptValue) capacityUnit.value = keptValue;
      }
    }
  }

  function refreshSerialVisibility() {
    let productName = '';
    if (productSelect) {
      if (productSelect.value === '__other__') {
        productName = productCustom ? productCustom.value : '';
      } else {
        productName = productSelect.value;
      }
    }
    const noSerial = isNoSerialProduct(currentCat, productName);
    if (serialField) {
      if (noSerial) {
        serialField.classList.add('hidden');
      } else {
        serialField.classList.remove('hidden');
      }
    }
  }

  if (productSelect) {
    productSelect.addEventListener('change', () => {
      if (productSelect.value === '__other__') {
        if (productCustom) productCustom.style.display = 'block';
      } else {
        if (productCustom) {
          productCustom.style.display = 'none';
          productCustom.value = '';
        }
      }
      refreshUnitOptions();
      refreshSerialVisibility();
    });
  }
  if (productCustom) {
    productCustom.addEventListener('input', () => {
      refreshUnitOptions();
      refreshSerialVisibility();
    });
  }
  if (capacityUnit) {
    capacityUnit.addEventListener('change', () => {
      if (capacityUnit.value === '__other__') {
        if (capacityCustomUnit) capacityCustomUnit.style.display = 'block';
      } else {
        if (capacityCustomUnit) {
          capacityCustomUnit.style.display = 'none';
          capacityCustomUnit.value = '';
        }
      }
    });
  }
}

function closeForm() {
  document.getElementById('overlay').classList.remove('open');
  editingRecord = null;
}

function collectFormRecord() {
  const record = {};
  // فیلدهای ساده (text/textarea/date) با data-key
  document.querySelectorAll('#formFields [data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if (el.tagName === 'SELECT') {
      if (el.value !== '__other__') record[key] = el.value.trim();
    } else {
      // چک کن داخل field مخفی نباشه
      const fieldDiv = el.closest('.field');
      if (fieldDiv && fieldDiv.classList.contains('hidden')) {
        record[key] = '';
        return;
      }
      record[key] = (el.value || '').trim();
    }
  });

  // محصول
  const productSelect = document.getElementById('productSelect');
  const productCustom = document.getElementById('productCustomInput');
  const productKey = CATS[currentCat].fields[1].key;
  if (productSelect) {
    if (productSelect.value === '__other__') {
      record[productKey] = productCustom ? productCustom.value.trim() : '';
    } else {
      record[productKey] = productSelect.value.trim();
    }
  }

  // ظرفیت
  const capValue = (document.getElementById('capacityValue') || {}).value || '';
  const capUnitEl = document.getElementById('capacityUnit');
  const capCustomUnit = document.getElementById('capacityCustomUnit');
  let unit = '';
  if (capUnitEl) {
    if (capUnitEl.value === '__other__') {
      unit = capCustomUnit ? capCustomUnit.value.trim() : '';
    } else {
      unit = capUnitEl.value.trim();
    }
  }
  record['ظرفیت محصول'] = combineCapacity(capValue, unit);

  // سریال خالی برای محصولات بدون سریال
  if (isNoSerialProduct(currentCat, record[productKey])) {
    record['شماره سریال'] = '';
  }

  return record;
}

async function submitForm(isNew) {
  const record = collectFormRecord();
  const conf = CATS[currentCat];

  // اعتبارسنجی
  const productKey = conf.fields[1].key;
  if (!record[productKey]) { toastMsg('نام محصول الزامی است', true); return; }

  const noSerial = isNoSerialProduct(currentCat, record[productKey]);
  if (!noSerial && !record['شماره سریال']) {
    toastMsg('شماره سریال الزامی است', true);
    return;
  }

  const oldRec = editingRecord ? JSON.parse(JSON.stringify(editingRecord)) : null;

  try {
    await apiPost({ action: 'upsert', cat: currentCat, record });
    await refreshAll();
    closeForm(); renderAll();
    toastMsg('ذخیره شد ✓', false, async () => {
      try {
        if (oldRec) await apiPost({ action: 'upsert', cat: currentCat, record: oldRec });
        else await apiPost({ action: 'delete', cat: currentCat, record });
        await refreshAll(); renderAll(); toastMsg('بازگردانی شد');
      } catch (e) { toastMsg('خطا در بازگردانی', true); }
    });
  } catch (e) {
    console.error(e);
    toastMsg('خطا در ذخیره — اتصال یا آدرس API را بررسی کن', true);
  }
}

async function handleDelete(rec) {
  const snapshot = JSON.parse(JSON.stringify(rec));
  try {
    await apiPost({ action: 'delete', cat: currentCat, record: rec });
    await refreshAll();
    closeForm(); renderAll();
    toastMsg('حذف شد', false, async () => {
      try {
        await apiPost({ action: 'upsert', cat: currentCat, record: snapshot });
        await refreshAll(); renderAll(); toastMsg('بازگردانی شد');
      } catch (e) { toastMsg('خطا در بازگردانی', true); }
    });
  } catch (e) {
    toastMsg('خطا در حذف', true);
  }
}

/* ============================================================
   Tabs
============================================================ */
function switchTab(cat) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-cat') === cat));
  filterMissingOnly = false;
  document.getElementById('filterMissing').classList.remove('active');
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  renderAll();
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) switchTab(tab.getAttribute('data-cat'));
});

/* ============================================================
   Events
============================================================ */
document.getElementById('addBtn').addEventListener('click', () => openForm(null));
document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; renderList(); });
document.getElementById('filterMissing').addEventListener('click', (e) => {
  filterMissingOnly = !filterMissingOnly;
  e.currentTarget.classList.toggle('active', filterMissingOnly);
  renderList();
});
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeForm(); });
document.getElementById('settingsOverlay').addEventListener('click', (e) => { if (e.target.id === 'settingsOverlay') closeSettings(); });
document.getElementById('themeBtn').addEventListener('click', toggleTheme);

document.getElementById('exportBtn').addEventListener('click', () => {
  const list = allData[currentCat] || [];
  if (!list.length) { toastMsg('داده‌ای برای خروجی نیست', true); return; }
  const conf = CATS[currentCat];
  const headers = conf.fields.map(f => f.label);
  const keys = conf.fields.map(f => f.key);
  const rows = [headers];
  list.forEach(r => rows.push(keys.map(k => r[k] || '')));
  const csv = '\uFEFF' + rows.map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `caspian-${currentCat}-${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
  toastMsg('خروجی CSV دانلود شد');
});

/* ============================================================
   Settings
============================================================ */
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('open'); }
function openSettings() {
  document.getElementById('settingsContent').innerHTML = `
    <h2>⚙ تنظیمات اتصال</h2>
    <div class="sub">آدرس Web App گوگل اسکریپت</div>
    <div class="field">
      <label>آدرس API</label>
      <input type="url" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(API_URL)}">
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" id="closeSettingsBtn">بستن</button>
      <button class="btn btn-primary" id="saveUrlBtn">ذخیره و اتصال</button>
    </div>
  `;
  document.getElementById('settingsOverlay').classList.add('open');
  document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
  document.getElementById('saveUrlBtn').addEventListener('click', async () => {
    const val = document.getElementById('apiUrlInput').value.trim();
    if (!val) { toastMsg('آدرس را وارد کن', true); return; }
    API_URL = val;
    localStorage.setItem('gasUrl', API_URL);
    closeSettings();
    await boot();
  });
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);

/* ============================================================
   Setup Screen
============================================================ */
function showSetupScreen(msg) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'block';
  document.getElementById('connDot').classList.add('offline');
  document.getElementById('connText').textContent = msg || 'متصل نیست';
  document.getElementById('setupScreen').innerHTML = `
    <div class="setup-box">
      <b style="color:var(--accent); font-family:'Courier New',monospace;">⚙ راه‌اندازی</b><br><br>
      این اپ به یک Google Apps Script Web App متصل می‌شود.<br><br>
      <b>۱.</b> کد <code style="background:var(--bg-input);padding:2px 6px;border-radius:3px;">Code.gs</code> را در Apps Script قرار بده<br>
      <b>۲.</b> Deploy کن (نوع Web App، دسترسی Anyone)<br>
      <b>۳.</b> آدرس <code style="background:var(--bg-input);padding:2px 6px;border-radius:3px;">/exec</code> را کپی کن<br>
      <b>۴.</b> روی دکمه ⚙ بزن و پیست کن<br><br>
      <div style="text-align:center; margin-top:16px;">
        <button class="btn btn-primary" style="max-width:240px;" onclick="openSettings()">ورود آدرس اتصال</button>
      </div>
    </div>
    ${msg && msg.includes('خطا') ? '<div class="setup-box" style="border-color:var(--danger);">❌ اتصال برقرار نشد</div>' : ''}
  `;
}

function renderAll() {
  renderStats();
  renderStats2();
  renderAlert();
  renderList();
}

window.addEventListener('online', () => {
  updateConnStatus(true);
  toastMsg('🌐 آنلاین شدی');
});
window.addEventListener('offline', () => {
  updateConnStatus(false);
  toastMsg('📴 آفلاین شدی — اتصال را بررسی کن', true);
});

async function boot() {
  if (!API_URL) { showSetupScreen(); updateConnStatus(false); return; }
  document.getElementById('connText').textContent = 'در حال اتصال...';
  document.getElementById('connDot').classList.add('offline');
  try {
    await refreshAll();
    document.getElementById('app').style.display = 'block';
    document.getElementById('setupScreen').style.display = 'none';
    updateConnStatus(true);
    renderAll();
  } catch (e) {
    updateConnStatus(false);
    showSetupScreen('خطا در اتصال');
  }
}

boot();
</script>

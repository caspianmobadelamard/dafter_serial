<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>دفتر سریال کاسپین مبدل آمارد</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f59e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر سریال">
<link rel="apple-touch-icon" href="icon-ios.png">
<link rel="icon" href="icon-android.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#0f141c;--bg-surface:#161e2b;--bg-elevated:#1e2838;--bg-input:#0a1018;
    --border:#2a3544;--border-strong:#3a4a5e;
    --text:#e8ecf1;--text-mid:#a8b0bc;--text-dim:#6b7789;
    --accent:#f59e0b;--accent-dim:#b87208;
    --steel:#4a9eff;--success:#22c55e;--warning:#fbbf24;--danger:#ef4444;
    --cyan:#22d3ee;--purple:#a78bfa;--pink:#ec4899;
    --radius:10px;--radius-sm:6px;
    --shadow:0 4px 16px rgba(0,0,0,0.4);
    --shadow-hover:0 6px 24px rgba(0,0,0,0.55);
    --c1:#4a9eff;--c2:#22c55e;--c3:#f59e0b;--c4:#a78bfa;--c5:#ec4899;--c6:#22d3ee;--c7:#eab308;--c8:#f87171;
  }
  body.light{
    --bg-base:#e8ecf0;--bg-surface:#ffffff;--bg-elevated:#f5f7fa;--bg-input:#ffffff;
    --border:#d0d8e0;--border-strong:#a8b4c4;
    --text:#1a2332;--text-mid:#4a5568;--text-dim:#7a8699;
    --shadow:0 2px 8px rgba(0,0,0,0.08);--shadow-hover:0 4px 16px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg-base);color:var(--text);
    font-family:'Vazirmatn','Tahoma',sans-serif;font-size:15px;line-height:1.6;
    min-height:100vh;transition:background 0.3s,color 0.3s;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    background-image:
      linear-gradient(rgba(245,158,11,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,158,11,0.02) 1px, transparent 1px);
    background-size:28px 28px;padding-bottom:30px;
  }

  /* ===== هدر ===== */
  .topbar{
    position:sticky;top:0;z-index:50;background:var(--bg-surface);
    border-bottom:2px solid var(--border-strong);
    box-shadow:0 2px 0 rgba(245,158,11,0.12),var(--shadow);
    padding-top:env(safe-area-inset-top);
  }
  .topbar-inner{max-width:800px;margin:0 auto;padding:14px 16px 0;}
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--border);gap:12px;}
  .brand{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
  .brand-mark{
    width:56px;height:56px;background:var(--bg-input);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;overflow:hidden;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius);position:relative;z-index:2;}
  .brand-mark::before{
    content:'';position:absolute;inset:0;border-radius:var(--radius);
    border:2px solid var(--accent);animation:neonBorderColor 6s ease-in-out infinite;
    pointer-events:none;z-index:3;
  }
  .brand-mark::after{
    content:'';position:absolute;inset:4px;border:1px dashed rgba(245,158,11,0.3);
    border-radius:4px;animation:neonDashed 6s ease-in-out infinite;
    pointer-events:none;z-index:4;
  }
  .brand-mark .pulse-ring{
    position:absolute;inset:-3px;border-radius:calc(var(--radius) + 2px);
    border:1px solid transparent;animation:pulseRing 3s ease-in-out infinite;
    pointer-events:none;z-index:1;
  }
  @keyframes neonBorderColor{
    0%,100%{border-color:#f59e0b;box-shadow:0 0 12px rgba(245,158,11,0.6),inset 0 0 10px rgba(245,158,11,0.15);}
    33%{border-color:#22d3ee;box-shadow:0 0 12px rgba(34,211,238,0.6),inset 0 0 10px rgba(34,211,238,0.15);}
    66%{border-color:#a78bfa;box-shadow:0 0 12px rgba(167,139,250,0.6),inset 0 0 10px rgba(167,139,250,0.15);}
  }
  @keyframes neonDashed{
    0%,100%{border-color:rgba(245,158,11,0.3);}
    33%{border-color:rgba(34,211,238,0.3);}
    66%{border-color:rgba(167,139,250,0.3);}
  }
  @keyframes pulseRing{
    0%{border-color:transparent;transform:scale(1);opacity:0.8;}
    50%{border-color:rgba(245,158,11,0.5);transform:scale(1.08);opacity:0.4;}
    100%{border-color:transparent;transform:scale(1);opacity:0.8;}
  }
  .brand-text{flex:1;min-width:0;}
  .brand-text h1{font-size:16px;font-weight:800;color:var(--text);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-text .sub{font-size:11px;color:var(--text-dim);margin-top:4px;font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;display:flex;align-items:center;gap:6px;}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulseDot 2s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .date-row{
    display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:5px 12px;
    background:linear-gradient(90deg,rgba(245,158,11,0.1),rgba(245,158,11,0.02));
    border:1px solid rgba(245,158,11,0.25);border-radius:6px;font-size:12.5px;
  }
  .date-row .cal-icon{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;flex-shrink:0;}
  .date-row .day-name{color:var(--accent);font-weight:700;}
  .date-row .divider{width:1px;height:13px;background:rgba(245,158,11,0.3);}
  .date-row .date-full{color:var(--text);font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;}
  .date-row .time{color:var(--text-mid);font-family:'JetBrains Mono',monospace;font-size:12px;}
  .topbar-actions{display:flex;gap:6px;flex-shrink:0;}
  .tool-btn{
    width:40px;height:40px;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:var(--radius-sm);color:var(--text-mid);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.15s;
  }
  .tool-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--bg-input);}
  .tool-btn:active{transform:scale(0.92);}
  .tool-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ===== تب‌ها ===== */
  .tabs{
    display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
    border:1px solid var(--border);border-top:none;
    border-radius:0 0 var(--radius) var(--radius);overflow:hidden;margin-top:12px;
  }
  .tab{
    background:var(--bg-elevated);padding:12px 6px;cursor:pointer;transition:0.15s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    font-size:12.5px;font-weight:700;color:var(--text-mid);position:relative;
  }
  .tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .tab:hover{color:var(--text);background:#263048;}
  .tab.active{background:var(--bg-input);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);}
  .tab .count{
    position:absolute;top:4px;left:6px;font-size:9.5px;padding:1px 5px;
    background:rgba(245,158,11,0.15);color:var(--accent);border-radius:4px;
    font-family:'JetBrains Mono',monospace;font-weight:800;
  }
  .tab.active .count{background:var(--accent);color:#000;}

  /* ===== کانتینر ===== */
  .container{max-width:800px;margin:0 auto;padding:16px 16px 0;}

  /* ===== یادآور ===== */
  .smart-reminder{
    display:none;align-items:center;gap:12px;padding:12px 16px;
    background:linear-gradient(135deg,rgba(251,191,36,0.12),rgba(251,191,36,0.03));
    border:1px solid rgba(251,191,36,0.4);border-right:4px solid var(--warning);
    border-radius:var(--radius);margin-bottom:16px;font-size:13px;
  }
  .smart-reminder.show{display:flex;}
  .smart-reminder .rem-icon{
    width:32px;height:32px;background:rgba(251,191,36,0.2);border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--warning);
    animation:bellShake 2s infinite;
  }
  @keyframes bellShake{
    0%,100%{transform:rotate(0);}
    10%,30%{transform:rotate(-8deg);}
    20%,40%{transform:rotate(8deg);}
    50%{transform:rotate(0);}
  }
  .smart-reminder .rem-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;}
  .smart-reminder .rem-text{flex:1;color:var(--text);}
  .smart-reminder .rem-text strong{color:var(--warning);font-weight:800;}

  /* ===== بخش عنوان ===== */
  .section-title{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-dim);
    letter-spacing:2px;text-transform:uppercase;padding:4px 0 12px;
    display:flex;align-items:center;gap:10px;margin-top:8px;font-weight:700;
  }
  .section-title::before{content:'';width:4px;height:14px;background:var(--accent);border-radius:2px;}

  /* ===== کارت ===== */
  .card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}

  .year-row{display:flex;gap:6px;margin-bottom:12px;justify-content:center;flex-wrap:wrap;}
  .year-btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--bg-elevated);color:var(--text-mid);font-size:12.5px;
    font-family:inherit;cursor:pointer;transition:all .15s;font-weight:700;}
  .year-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#fff;box-shadow:0 0 14px rgba(245,158,11,0.3);}

  .cat-row{display:flex;gap:8px;margin-bottom:18px;}
  .cat-btn{flex:1;padding:12px 6px;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--bg-elevated);color:var(--text-mid);font-size:12.5px;
    font-family:inherit;text-align:center;cursor:pointer;transition:all .15s;font-weight:700;}
  .cat-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#fff;box-shadow:0 0 14px rgba(245,158,11,0.3);}

  /* ===== فرم ===== */
  label{display:block;font-size:13px;color:var(--text-mid);margin:14px 0 7px;font-weight:600;}
  label.req::after{content:" *";color:var(--accent);font-weight:800;}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;background:var(--bg-input);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);
    font-size:14.5px;font-family:inherit;outline:none;transition:border 0.15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  input:disabled,select:disabled{opacity:0.5;cursor:not-allowed;}
  .date-row{display:flex;gap:8px;align-items:stretch;}
  .date-row input{flex:1;}
  .today-btn{white-space:nowrap;background:var(--bg-elevated);border:1px solid var(--accent-dim);
    color:var(--accent);border-radius:var(--radius-sm);padding:0 14px;font-size:12.5px;
    cursor:pointer;font-family:inherit;font-weight:700;}
  .today-btn:active{transform:scale(0.96);}

  .submit-btn{width:100%;margin-top:18px;padding:15px;border-radius:var(--radius);border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    color:#1a1205;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer;
    transition:0.15s;}
  .submit-btn:active{transform:scale(0.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
  .secondary-btn{width:100%;margin-top:10px;padding:13px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--bg-elevated);
    color:var(--accent);font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer;}
  .secondary-btn:active{transform:scale(0.98);}

  .msg{text-align:center;padding:11px;border-radius:var(--radius-sm);margin-top:12px;font-size:13px;display:none;}
  .msg.ok{display:block;background:rgba(34,197,94,0.12);color:var(--success);border:1px solid var(--success);}
  .msg.err{display:block;background:rgba(239,68,68,0.12);color:var(--danger);border:1px solid var(--danger);}

  /* ===== کارت سفارش ===== */
  .order-card{
    background:var(--bg-surface);border:1px solid var(--border);
    border-right:4px solid var(--c1);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:12px;position:relative;
    transition:0.2s;cursor:pointer;box-shadow:var(--shadow);
  }
  .order-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-hover);transform:translateY(-1px);}
  .order-card.customer-c1{border-right-color:var(--c1);}
  .order-card.customer-c2{border-right-color:var(--c2);}
  .order-card.customer-c3{border-right-color:var(--c3);}
  .order-card.customer-c4{border-right-color:var(--c4);}
  .order-card.customer-c5{border-right-color:var(--c5);}
  .order-card.customer-c6{border-right-color:var(--c6);}
  .order-card.customer-c7{border-right-color:var(--c7);}
  .order-card.customer-c8{border-right-color:var(--c8);}

  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px;}
  .card-head .serial{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;
    color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-head .serial .co-badge{font-family:'Vazirmatn',sans-serif;font-size:10px;font-weight:800;
    padding:3px 8px;border-radius:5px;}
  .co-badge.isqi{background:rgba(255,215,0,0.2);color:#ffd700;border:1px solid rgba(255,215,0,0.5);}
  .co-badge.ajg{background:rgba(239,68,68,0.2);color:#ff8a8a;border:1px solid rgba(239,68,68,0.5);}

  .status-pill{font-family:'Vazirmatn',sans-serif;font-size:10.5px;font-weight:800;
    padding:4px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .status-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .status-pill.not-made{background:rgba(239,68,68,0.15);color:#ff7b7b;}
  .status-pill.making{background:rgba(251,191,36,0.15);color:#fbbf24;}
  .status-pill.done{background:rgba(34,197,94,0.15);color:#4ade80;}

  .card-body{font-size:13.5px;color:var(--text-mid);line-height:1.75;}
  .card-body .product{color:var(--text);font-weight:600;margin-bottom:4px;}
  .card-body .meta-row{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;margin-top:4px;}
  .card-body .meta-row .label{color:var(--text-dim);}
  .card-body .meta-row .value{color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace;}

  .progress-wrap{margin-top:12px;display:flex;align-items:center;gap:10px;}
  .progress-bar{flex:1;height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden;position:relative;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));
    border-radius:3px;transition:width 0.5s;position:relative;}
  .progress-fill::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
    animation:shimmer 2s infinite;}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .progress-pct{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;
    color:var(--accent);min-width:38px;text-align:left;}

  .timeline{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
    padding:0 4px;position:relative;}
  .timeline::before{content:'';position:absolute;left:12px;right:12px;top:10px;
    height:2px;background:var(--bg-input);z-index:1;}
  .timeline-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    position:relative;z-index:2;}
  .timeline-dot{width:20px;height:20px;border-radius:50%;background:var(--bg-input);
    border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:0.3s;}
  .timeline-dot svg{width:10px;height:10px;stroke:var(--text-dim);fill:none;stroke-width:3;
    opacity:0;transition:0.3s;}
  .timeline-step.done .timeline-dot{background:var(--success);border-color:var(--success);
    box-shadow:0 0 10px rgba(34,197,94,0.5);}
  .timeline-step.done .timeline-dot svg{stroke:#fff;opacity:1;}
  .timeline-step.active .timeline-dot{background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 10px rgba(245,158,11,0.6);animation:pulseActive 1.5s infinite;}
  @keyframes pulseActive{0%,100%{box-shadow:0 0 10px rgba(245,158,11,0.6);}50%{box-shadow:0 0 18px rgba(245,158,11,0.9);}}
  .timeline-label{font-size:10.5px;color:var(--text-dim);font-weight:600;text-align:center;}
  .timeline-step.done .timeline-label{color:var(--success);}
  .timeline-step.active .timeline-label{color:var(--accent);font-weight:800;}

  .customer-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
    padding:2px 8px;border-radius:5px;background:var(--bg-input);
    border:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-weight:700;}
  .customer-tag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c1);}
  .customer-tag.c1::before{background:var(--c1);}
  .customer-tag.c2::before{background:var(--c2);}
  .customer-tag.c3::before{background:var(--c3);}
  .customer-tag.c4::before{background:var(--c4);}
  .customer-tag.c5::before{background:var(--c5);}
  .customer-tag.c6::before{background:var(--c6);}

  .card-actions{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .card-actions button{flex:1;background:var(--bg-elevated);border:1px solid var(--border);
    color:var(--text-mid);font-size:12.5px;font-family:inherit;padding:8px;
    border-radius:var(--radius-sm);cursor:pointer;font-weight:700;}
  .card-actions button:hover{color:var(--accent);border-color:var(--accent);}
  .card-actions button.danger:hover{color:var(--danger);border-color:var(--danger);}

  /* ===== جستجو ===== */
  .search-row{display:flex;gap:8px;align-items:stretch;margin-bottom:12px;}
  .search-input-wrap{position:relative;flex:1;}
  .search-input-wrap input{padding-left:36px;padding-right:12px;}
  .search-input-wrap .clear-btn{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border-radius:50%;border:none;background:var(--bg-elevated);
    color:var(--text-mid);cursor:pointer;font-size:13px;display:none;
    align-items:center;justify-content:center;}
  .search-input-wrap .clear-btn.show{display:flex;}
  .filter-toggle{border:1px solid var(--border);background:var(--bg-elevated);
    color:var(--text-mid);border-radius:var(--radius-sm);padding:0 14px;
    font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap;font-weight:700;}
  .filter-toggle.active{color:var(--accent);border-color:var(--accent);background:rgba(245,158,11,0.08);}

  .adv-filters{margin-top:10px;padding:14px;background:var(--bg-input);
    border:1px solid var(--border);border-radius:var(--radius-sm);display:none;}
  .adv-filters.show{display:block;}
  .adv-filters label{margin-top:10px;}
  .adv-filters label:first-child{margin-top:0;}

  /* ===== داشبورد ===== */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .dash-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .dash-card .num{font-size:28px;font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace;}
  .dash-card .lbl{font-size:12px;color:var(--text-dim);margin-top:6px;font-weight:600;}
  .dash-card.wide{grid-column:1/-1;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .key{display:flex;align-items:center;gap:10px;font-weight:600;}
  .stat-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .stat-row .val{font-weight:800;color:var(--text);font-family:'JetBrains Mono',monospace;}

  /* ===== نمودار میله‌ای ===== */
  .bar-chart{display:flex;align-items:flex-end;justify-content:space-between;
    gap:6px;height:180px;padding:16px 0;margin-top:14px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .bar{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-dim));
    border-radius:4px 4px 0 0;min-height:3px;transition:height 0.6s;
    position:relative;}
  .bar:hover::after{content:attr(data-val);position:absolute;top:-22px;left:50%;
    transform:translateX(-50%);background:var(--bg-elevated);color:var(--accent);
    padding:2px 6px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;
    border:1px solid var(--accent);}
  .bar-label{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-weight:700;}

  /* ===== مودال ===== */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:flex-end;z-index:100;backdrop-filter:blur(4px);}
  .modal-backdrop.show{display:flex;}
  .modal{background:var(--bg-surface);border:1px solid var(--border-strong);
    border-radius:18px 18px 0 0;width:100%;max-width:600px;margin:0 auto;
    padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,0.5);}
  .modal h3{margin:0 0 6px;color:var(--accent);font-size:16px;font-weight:800;}
  .modal .sub{color:var(--text-dim);font-size:12.5px;margin-bottom:12px;}
  .close-modal{background:none;border:none;color:var(--text-dim);
    font-size:13px;margin-top:10px;width:100%;padding:12px;cursor:pointer;font-weight:700;}

  .modal-view-bar{display:flex;justify-content:space-between;align-items:center;
    margin:8px 0 12px;padding:10px 12px;border-radius:var(--radius-sm);
    background:var(--bg-input);border:1px solid var(--border);}
  .modal-view-bar .label{font-size:12.5px;color:var(--text-mid);font-weight:600;}
  .modal-view-bar button{background:none;border:none;color:var(--accent);
    font-size:12px;font-family:inherit;cursor:pointer;font-weight:700;}

  /* ===== Undo Bar ===== */
  .undo-bar{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));
    left:16px;right:16px;max-width:768px;margin:0 auto;background:var(--bg-elevated);
    border:1px solid var(--accent);border-radius:var(--radius);padding:12px 16px;
    display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.6);
    z-index:90;transform:translateY(200%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);font-size:13px;}
  .undo-bar.show{transform:translateY(0);}
  .undo-bar .undo-text{flex:1;color:var(--text);}
  .undo-bar button{background:var(--accent);color:#000;border:none;padding:6px 14px;
    border-radius:6px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}

  /* ===== اعلان ===== */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
    background:var(--bg-elevated);color:var(--text);padding:12px 20px;
    border-radius:var(--radius);border:1px solid var(--border-strong);
    box-shadow:var(--shadow-hover);z-index:200;font-size:13.5px;font-weight:600;
    transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:var(--success);color:var(--success);}
  .toast.err{border-color:var(--danger);color:var(--danger);}

  /* ===== Picker ===== */
  .picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:center;justify-content:center;z-index:150;padding:20px;backdrop-filter:blur(4px);}
  .picker-overlay.show{display:flex;}
  .picker-box{background:var(--bg-surface);border:1px solid var(--border-strong);
    border-radius:var(--radius);width:100%;max-width:400px;padding:18px;max-height:80vh;overflow-y:auto;}
  .picker-box h4{color:var(--accent);font-size:15px;margin-bottom:12px;font-weight:800;}
  .picker-list{display:flex;flex-direction:column;gap:6px;}
  .picker-item{padding:12px 14px;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;font-weight:600;
    transition:0.15s;color:var(--text);}
  .picker-item:hover{border-color:var(--accent);color:var(--accent);}
  .picker-item.selected{background:rgba(245,158,11,0.12);border-color:var(--accent);color:var(--accent);}

  /* ===== Empty ===== */
  .empty-state{text-align:center;color:var(--text-dim);padding:40px 10px;font-size:13.5px;}
  .spinner{text-align:center;color:var(--text-dim);font-size:13px;padding:20px;}

  /* ===== موبایل ===== */
  @media (max-width: 480px){
    body{font-size:14px;}
    .brand-text h1{font-size:14px;}
    .date-row{padding:4px 9px;font-size:11.5px;}
    .date-row .time{display:none;}
    .date-row .divider:nth-of-type(2){display:none;}
    .tool-btn{width:36px;height:36px;}
    .brand-mark{width:46px;height:46px;}
    .tab{font-size:11px;padding:10px 4px;}
    .tab svg{width:20px;height:20px;}
    .tab .count{font-size:9px;padding:1px 4px;}
    .order-card{padding:12px 14px;}
    .card-head .serial{font-size:15px;}
    .timeline-label{font-size:9.5px;}
    .dash-grid{grid-template-columns:1fr;}
  }
  @media (min-width: 900px){
    .container{padding-top:24px;}
    .order-card{padding:18px 20px;}
    .card-head .serial{font-size:17px;}
    .tab{padding:14px 8px;font-size:13.5px;}
    .tab svg{width:24px;height:24px;}
  }
</style>
</head>

function toFa(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}
function todayJalaliStr() {
  const now = new Date();
  const [jy, jm, jd] = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  return `${jy}.${String(jm).padStart(2,'0')}.${String(jd).padStart(2,'0')}`;
}
function updateClock() {
  const now = new Date();
  const [jy, jm, jd] = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  const dow = now.getDay();
  const faDayIndex = (dow + 1) % 7;
  const faDayNames = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  document.getElementById('dayName').textContent = faDayNames[faDayIndex];
  document.getElementById('dateFull').textContent = toFa(jy)+'/'+String(jm).padStart(2,'0')+'/'+String(jd).padStart(2,'0');
  document.getElementById('timeNow').textContent = toFa(String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'));
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function isWaterHeater(product) {
  const p = String(product || '').trim();
  return p === 'آبگرم کن';

// ============================================================
// API
// ============================================================
async function callApi(payload) {
  const url = getScriptUrl();
  if (!isUrlConfigured()) { openSettings(); throw new Error('لینک تنظیم نشده'); }
  const params = new URLSearchParams();
  params.append('action', payload.action);
  params.append('year', currentYear);
  if (payload.category) params.append('category', payload.category);
  if (payload.row)      params.append('row', payload.row);
  if (payload.count)    params.append('count', payload.count);
  if (payload.serial)   params.append('serial', payload.serial);
  if (payload.status)   params.append('status', payload.status);
  if (payload.rows)     params.append('rows', JSON.stringify(payload.rows));
  if (payload.data)     params.append('data', JSON.stringify(payload.data));
  const sep = url.indexOf('?') === -1 ? '?' : '&';
  const finalUrl = url + sep + params.toString();
  const res = await fetch(finalUrl, { method: 'GET', redirect: 'follow' });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (_) { throw new Error('پاسخ JSON نبود: ' + text.slice(0, 150)); }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  ['new','pending','dashboard','report'].forEach(t => {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).style.display = (t === tab) ? 'block' : 'none';
  });
  if (tab === 'new') { buildYearRow('yearRow'); buildCatRow('catRow'); buildNewForm(); }
  else if (tab === 'pending') { buildYearRow('yearRow2'); buildCatRow('catRow2'); loadItems(); }
  else if (tab === 'dashboard') { buildYearRow('yearRow3'); loadDashboard(); }
  else if (tab === 'report') { buildYearRow('yearRow4'); buildCatRow('catRow4'); loadReport(); }
}

function getCapacityUnits(product) {
  if (CAPACITY_UNITS[product]) return CAPACITY_UNITS[product];
  if (currentCat === 'steam') return ['kg/hr', 'lb/hr'];
  if (currentCat === 'hotwater') return ['kcal/hr'];
  return ['lit'];
}

function fieldRowHTML(f, idPrefix) {
  const id = idPrefix + '_' + f.key;
  const isNew = idPrefix === 'new';

  if (f.key === 'serial' && isNew) {
    return `
      <label${f.required ? ' class="req"' : ''} id="lbl_${id}">${f.label}</label>
      <div class="date-row">
        <input type="text" id="${id}" placeholder="${f.placeholder || ''}">
        <button type="button" class="today-btn" onclick="refreshSerial()" title="سریال بعدی">🔄</button>
      </div>`;
  }
  if (f.key === 'product' && isNew) {
    const opts = (PRODUCT_OPTIONS[currentCat] || []).map(o => `<option value="${o.replace(/"/g,'&quot;')}"></option>`).join('');
    return `
      <label${f.required ? ' class="req"' : ''}>${f.label}</label>
      <input type="text" id="${id}" list="dl_${currentCat}_product" placeholder="انتخاب یا تایپ..." autocomplete="off" oninput="onProductChange('${id}')">
      <datalist id="dl_${currentCat}_product">${opts}</datalist>`;
  }
  if (f.key === 'customer' && isNew) {
    return `
      <label${f.required ? ' class="req"' : ''}>${f.label}</label>
      <input type="text" id="${id}" inputmode="numeric" placeholder="کد مشتری..." autocomplete="off">`;
  }
  if (f.type === 'capacity') {
    return `
      <label${f.required ? ' class="req"' : ''}>${f.label}</label>
      <div class="date-row">
        <input type="text" id="${id}" placeholder="مقدار..." inputmode="decimal">
        <button type="button" class="today-btn" id="unitBtn_${id}" onclick="pickUnit('${id}')">kg/hr ▾</button>
      </div>`;
  }
  if (f.type === 'standard') {
    const opts = STANDARD_LIST.map(s => `<option value="${s}">${s}</option>`).join('');
    return `<label${f.required?' class="req"':''}>${f.label}</label>
      <select id="${id}"><option value="">انتخاب...</option>${opts}</select>`;
  }
  if (f.type === 'inspection') {
    const opts = INSPECTION_LIST.map(s => `<option value="${s}">${s}</option>`).join('');
    return `<label${f.required?'class="req"':''}>${f.label}</label>
      <select id="${id}"><option value="">انتخاب...</option>${opts}</select>`;
  }
  if (f.key === 'status') {
    const opts = STATUS_LIST.map(s => `<option value="${s}">${s}</option>`).join('');
    return `<label${f.required?'class="req"':''}>${f.label}</label>
      <select id="${id}">${opts}</select>`;
  }
  if (f.type === 'jdate') {
    return `<label${f.required?'class="req"':''}>${f.label}</label>
      <div class="date-row">
        <input type="text" id="${id}" placeholder="۱۴۰۵.۰۶.۲۰" dir="ltr" style="text-align:left;">
        <button type="button" class="today-btn" onclick="document.getElementById('${id}').value = todayJalaliStr()">امروز</button>
      </div>`;
  }
  return `<label${f.required?'class="req"':''}>${f.label}</label>
    <input type="text" id="${id}" placeholder="${f.placeholder || ''}">`;
}

// تغییر محصول → تغییر واحد ظرفیت + رفتار خاص
function onProductChange(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const product = el.value.trim();
  const prefix = id.split('_')[0];
  const capInputId = prefix + '_capacity';
  const capInput = document.getElementById(capInputId);
  const unitBtn = document.getElementById('unitBtn_' + capInputId);
  if (capInput && unitBtn) {
    const units = getCapacityUnits(product);
    capInput.placeholder = 'مقدار (' + units[0] + ')...';
    unitBtn.textContent = units[0] + ' ▾';
    capacityUnitCache[capInputId] = units[0];
  }
  // رفتار آبگرم کن
  if (prefix === 'new') {
    const serialInput = document.getElementById('new_serial');
    const serialLabel = document.getElementById('lbl_new_serial');
    if (isWaterHeater(product)) {
      if (serialInput) { serialInput.value = ''; serialInput.disabled = true; serialInput.placeholder = '— (آبگرم کن بدون سریال)'; }
      if (serialLabel) serialLabel.style.opacity = '0.5';
    } else {
      if (serialInput) { serialInput.disabled = false; serialInput.placeholder = ''; }
      if (serialLabel) serialLabel.style.opacity = '1';
      if (!serialInput.value) autofillSerial(false);
    }
  }
}

// انتخاب واحد ظرفیت
function pickUnit(inputId) {
  const input = document.getElementById(inputId);
  const product = (document.getElementById(inputId.replace('_capacity','_product')) || {}).value || '';
  const units = getCapacityUnits(String(product).trim());
  const current = capacityUnitCache[inputId] || units[0];
  openPicker('واحد ظرفیت', units, current, (selected) => {
    capacityUnitCache[inputId] = selected;
    const btn = document.getElementById('unitBtn_' + inputId);
    if (btn) btn.textContent = selected + ' ▾';
    if (input) input.placeholder = 'مقدار (' + selected + ')...';
  });
}

function openPicker(title, items, current, onPick) {
  document.getElementById('pickerTitle').textContent = title;
  const list = document.getElementById('pickerList');
  list.innerHTML = '';
  items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'picker-item' + (it === current ? ' selected' : '');
    d.textContent = it;
    d.onclick = () => { onPick(it); closePicker(); };
    list.appendChild(d);
  });
  document.getElementById('pickerOverlay').classList.add('show');
}
function closePicker() { document.getElementById('pickerOverlay').classList.remove('show'); }
document.getElementById('pickerCloseBtn').onclick = closePicker;
document.getElementById('pickerOverlay').onclick = e => { if (e.target.id === 'pickerOverlay') closePicker(); };

async function autofillSerial(force) {
  const el = document.getElementById('new_serial');
  if (!el || el.disabled) return;
  if (!force && el.value && el.value.trim()) return;
  if (!isUrlConfigured()) return;
  try {
    const r = await callApi({ action: 'getNextSerial', category: currentCat });
    if (r.ok && r.serial) { el.value = r.serial; el.placeholder = ''; }
    else if (r.ok && r.lastSerial) { el.value = ''; el.placeholder = 'آخرین: ' + r.lastSerial; }
    updateCountHint();
  } catch (e) {}
}

async function refreshSerial() {
  const el = document.getElementById('new_serial');
  if (el) el.value = '';
  await autofillSerial(true);
}

function updateCountHint() {
  const countEl = document.getElementById('new_count');
  const hintEl = document.getElementById('countHint');
  const serialEl = document.getElementById('new_serial');
  if (!countEl || !hintEl) return;
  const count = Math.max(1, parseInt(countEl.value, 10) || 1);
  const serial = (serialEl && serialEl.value.trim()) || '';
  if (count > 1 && serial) {
    const m = serial.match(/^(.*?)(\d+)\s*$/);
    if (m) {
      const last = m[1] + String(parseInt(m[2],10) + count - 1).padStart(m[2].length, '0');
      hintEl.textContent = '✅ ' + serial + ' تا ' + last + ' (' + count + ' ردیف)';
      hintEl.style.color = 'var(--accent)';
      return;
    }
  }
  hintEl.textContent = 'اگه بیشتر از ۱ باشه، ردیف جدا با سریال متوالی ثبت می‌شه.';
  hintEl.style.color = '';
}

async function submitNewOrder() {
  const cat = CATEGORIES[currentCat];
  const data = {};
  let missing = null;
  cat.fields.forEach(f => {
    const el = document.getElementById('new_' + f.key);
    if (el && el.disabled) return;
    const val = el ? el.value.trim() : '';
    data[f.key] = val;
    if (f.required && !val && !isWaterHeater(data.product)) missing = f.label;
  });
  // واحد ظرفیت
  if (data.capacity) {
    const unit = capacityUnitCache['new_capacity'] || '';
    data.capacity = data.capacity + (unit ? ' ' + unit : '');
  }
  if (missing) { showToast('لطفاً «' + missing + '» رو وارد کن', 'err'); return; }

  const dup = await checkDuplicate(data.serial);
  if (dup.exists) { showToast('⚠️ سریال «' + data.serial + '» قبلاً ثبت شده', 'err'); return; }

  const count = Math.max(1, parseInt(document.getElementById('new_count').value, 10) || 1);
  const btn = document.getElementById('newSubmitBtn');
  btn.disabled = true;
  btn.textContent = count > 1 ? 'در حال ثبت ' + count + ' ردیف...' : 'در حال ثبت...';
  try {
    const r = await callApi({ action: 'addOrder', category: currentCat, data, count });
    if (r.ok) {
      showToast(r.count > 1 ? r.count + ' سفارش ثبت شد' : '✅ سفارش ثبت شد', 'ok');
      clearNewForm();
    } else {
      showToast('خطا: ' + (r.error || 'نامشخص'), 'err');
    }
  } catch (e) { showToast('خطا: ' + e.message, 'err'); }
  btn.disabled = false;
  btn.textContent = 'ثبت سفارش';
}

function clearNewForm() {
  const cat = CATEGORIES[currentCat];
  cat.fields.forEach(f => {
    if (f.key === 'serial') return;
    const el = document.getElementById('new_' + f.key);
    if (el) {
      if (el.tagName === 'SELECT') el.selectedIndex = 0;
      else if (!el.disabled) el.value = '';
    }
  });
  document.getElementById('new_count').value = '1';
  const serial = document.getElementById('new_serial');
  if (serial && !serial.disabled) autofillSerial(true);
  updateCountHint();
}

async function checkDuplicate(serial) {
  if (!serial || !serial.trim()) return { exists: false };
  try { return await callApi({ action: 'checkDuplicateSerial', category: currentCat, serial }); }
  catch (e) { return { exists: false }; }
}

async function loadCustomers() {
  if (!isUrlConfigured()) return;
  try {
    const r = await callApi({ action: 'getDistinctCustomers', category: currentCat });
    if (r.ok) {
      customersCache = r.customers || [];
      const fs = document.getElementById('filterCustomer');
      if (fs) fs.innerHTML = '<option value="">همه</option>' + customersCache.map(c => `<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join('');

}

async function loadItems() {
  const listEl = document.getElementById('pendingList');
  if (!isUrlConfigured()) { listEl.innerHTML = '<div class="empty-state">لینک اتصال تنظیم نشده</div>'; return; }
  listEl.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  try {
    const r = await callApi({ action: 'listAll', category: currentCat });
    if (!r.ok) { listEl.innerHTML = '<div class="empty-state">خطا: ' + r.error + '</div>'; return; }
    allItems = r.items || [];
    updateTabCounts();
    renderList();
  } catch (e) { listEl.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}

function updateTabCounts() {
  document.getElementById('tabCountPending').textContent = toFa(allItems.length);
  document.getElementById('tabCountNew').textContent = toFa(allItems.length);
  const pending = allItems.filter(it => (it.emptyKeys || []).length > 0).length;
  document.getElementById('tabCountDash').textContent = toFa(pending);
}

function normalizeText(s) {
  if (!s) return '';
  return String(s).replace(/[\u200c\u200d\u200e\u200f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}

function getFilteredItems() {
  const q = normalizeText(searchTerm);
  let items = allItems.slice();
  if (onlyPending) items = items.filter(it => (it.emptyKeys || []).length > 0);
  if (filterStatus) items = items.filter(it => String(it.data.status || '').trim() === filterStatus);
  if (filterInspection) items = items.filter(it => String(it.data.inspectionCo || '').trim().toUpperCase() === filterInspection);
  if (filterCustomer) items = items.filter(it => String(it.data.customer || '').trim() === filterCustomer);
  if (q) items = items.filter(it => {
    const hay = normalizeText([it.data.serial, it.data.product, it.data.customer, it.data.group, it.data.inspectionCode, it.data.inspectionCo].join(' | '));
    return hay.indexOf(q) !== -1;
  });
  return items;
}

function getProgress(item) {
  const cat = CATEGORIES[currentCat];
  const keys = cat.fields.filter(f => f.key !== 'status').map(f => f.key);
  let filled = 0;
  keys.forEach(k => { if (item.data[k] && String(item.data[k]).trim() !== '') filled++; });
  return Math.round((filled / keys.length) * 100);
}

function getTimelineSteps(item) {
  const d = item.data;
  const steps = [];
  steps.push({ label: 'سفارش', done: !!(d.orderDate && String(d.orderDate).trim()) });
  steps.push({ label: 'ساخت', done: d.status === 'ساخته شده' || d.status === 'در حال ساخت', active: d.status === 'در حال ساخت' });
  steps.push({ label: 'تست', done: !!(d.hydroDate && String(d.hydroDate).trim()) });
  steps.push({ label: 'بازرسی', done: !!(d.inspectionCode && String(d.inspectionCode).trim()) });
  steps.push({ label: 'بارگیری', done: !!(d.loadDate && String(d.loadDate).trim()) });
  return steps;
}

function renderList() {
  const listEl = document.getElementById('pendingList');
  const items = getFilteredItems();

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty-state">چیزی پیدا نشد</div>';
    return;
  }

  listEl.innerHTML = '';
  items.forEach(item => {
    const d = item.data;
    const progress = getProgress(item);
    const status = String(d.status || '').trim() || 'نامشخص';
    const pillClass = STATUS_PILL_CLASS[status] || 'not-made';
    const co = String(d.inspectionCo || '').trim().toUpperCase();
    const coBadge = co ? `<span class="co-badge ${co === 'ISQI' ? 'isqi' : 'ajg'}">${co}</span>` : '';
    const colorIdx = customerColorIndex(d.customer);
    const cardClass = 'customer-' + CUSTOMER_COLORS[colorIdx];

    const timeline = getTimelineSteps(item).map(s =>
      `<div class="timeline-step ${s.done ? 'done' : (s.active ? 'active' : '')}">
        <div class="timeline-dot">${s.done ? '<svg viewBox="0 0 12 12"><polyline points="2 6 5 9 10 3"/></svg>' : ''}</div>
        <div class="timeline-label">${s.label}</div>
      </div>`
    ).join('');

    const meta = [];
    if (d.capacity) meta.push(`<span><span class="label">ظرفیت:</span> <span class="value">${d.capacity}</span></span>`);
    if (d.pressure) meta.push(`<span><span class="label">فشار:</span> <span class="value">${d.pressure}</span></span>`);

    const custTag = d.customer ? `<span class="customer-tag ${CUSTOMER_COLORS[colorIdx]}">مشتری: ${d.customer}</span>` : '';
    const stdTag = d.standard ? `<span class="customer-tag">${d.standard}</span>` : '';

    const card = document.createElement('div');
    card.className = 'order-card ' + cardClass;
    card.innerHTML = `
      <div class="card-head">
        <div class="serial">${d.serial || '(بدون سریال)'} ${coBadge}</div>
        <span class="status-pill ${pillClass}">${status}</span>
      </div>
      <div class="card-body">
        <div class="product">${d.product || ''}</div>
        <div class="meta-row">${meta.join('')}</div>
        <div class="meta-row">${custTag} ${stdTag}</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%;"></div></div>
        <div class="progress-pct">${toFa(progress)}٪</div>
      </div>
      <div class="timeline">${timeline}</div>
      <div class="card-actions">
        <button onclick="event.stopPropagation();openModal(${item.row})">✎ ویرایش</button>
        <button onclick="event.stopPropagation();copyItemToForm(${item.row})">📋 کپی</button>
      </div>`;
    card.onclick = () => openModal(item.row);
    listEl.appendChild(card);
  });
}

function findItemByRow(row) {
  return allItems.find(it => it.row === row);
}

// ============================================================
// مودال ویرایش
// ============================================================
function openModal(row) {
  const item = findItemByRow(row);
  if (!item) return;
  currentModalItem = item;
  modalShowAll = false;
  const cat = CATEGORIES[currentCat];
  document.getElementById('modalTitle').textContent = item.data.serial || '(بدون سریال)';
  const sub = [];
  if (item.data.product) sub.push(item.data.product);
  if (item.data.capacity) sub.push('ظرفیت: ' + item.data.capacity);
  document.getElementById('modalSub').innerHTML = sub.join(' • ');
  renderModalFields();
  document.getElementById('modalMsg').className = 'msg';
  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('modalSaveBtn').onclick = saveModal;
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('show');
  currentModalItem = null;
}

function getModalKeys() {
  const item = currentModalItem;
  const cat = CATEGORIES[currentCat];
  if (modalShowAll) return cat.fields.map(f => f.key);
  // مهم: برای رفع باگ ویرایش، همه فیلدها همیشه نشون داده می‌شن
  return cat.fields.map(f => f.key);
}

function renderModalFields() {
  const cat = CATEGORIES[currentCat];
  const item = currentModalItem;
  const fieldsEl = document.getElementById('modalFields');
  const viewBar = document.getElementById('modalViewBar');

  viewBar.innerHTML = `
    <div class="modal-view-bar">
      <div class="label">همه فیلدها قابل ویرایش هستند</div>
      <button type="button" id="modalToggleView">✎</button>
    </div>`;

  fieldsEl.innerHTML = cat.fields.map(f => {
    let html = fieldRowHTML(f, 'modal');
    const oldVal = item.data[f.key];
    const id = 'modal_' + f.key;
    if (oldVal !== undefined && oldVal !== null && String(oldVal).trim() !== '') {
      if (f.type === 'standard' || f.type === 'inspection' || f.key === 'status') {
        html = html.replace(`<select id="${id}">`, `<select id="${id}" data-select-val="${String(oldVal).replace(/"/g,'&quot;')}">`);
      } else {
        html = html.replace(`id="${id}"`, `id="${id}" data-prefill="${String(oldVal).replace(/"/g,'&quot;').replace(/&/g,'&amp;')}"`);
      }
    }
    return html;
  }).join('');

  requestAnimationFrame(() => {
    cat.fields.forEach(f => {
      const el = document.getElementById('modal_' + f.key);
      if (!el) return;
      if (el.dataset.prefill) el.value = el.dataset.prefill;
      if (el.dataset.selectVal) {
        const target = el.dataset.selectVal.trim();
        let found = false;
        for (let i = 0; i < el.options.length; i++) {
          if (el.options[i].value.trim() === target) { el.selectedIndex = i; found = true; break; }
        }
        if (!found && target) {
          const opt = document.createElement('option');
          opt.value = target; opt.textContent = target + ' (قبلی)';
          el.appendChild(opt); el.value = target;
        }
      }
      // واحد ظرفیت در مودال
      if (f.type === 'capacity') {
        const oldCap = String(item.data.capacity || '').trim();
        const m = oldCap.match(/\s+([^\d]+)$/);
        const unit = m ? m[1].trim() : '';
        const btn = document.getElementById('unitBtn_modal_capacity');
        if (btn) {
          const units = getCapacityUnits(item.data.product);
          capacityUnitCache['modal_capacity'] = unit || units[0];
          btn.textContent = (unit || units[0]) + ' ▾';
          if (el.value) el.value = el.value.replace(/\s+[^\d]+$/, '');
        }
      }
    });
  });
}

async function saveModal() {
  const item = currentModalItem;
  if (!item) return;
  const cat = CATEGORIES[currentCat];
  const data = {};
  cat.fields.forEach(f => {
    const el = document.getElementById('modal_' + f.key);
    if (!el) return;
    let v = el.value;
    if (v === undefined || v === null) v = '';
    v = String(v).trim();
    // برای ظرفیت، واحد رو اضافه کن
    if (f.type === 'capacity' && v) {
      const unit = capacityUnitCache['modal_capacity'] || '';
      v = v + (unit ? ' ' + unit : '');
    }
    data[f.key] = v;
  });

  const btn = document.getElementById('modalSaveBtn');
  btn.disabled = true;
  btn.textContent = 'در حال ذخیره...';
  try {
    const r = await callApi({ action: 'updatePending', category: currentCat, row: item.row, data });
    if (r.ok) {
      showToast('✅ ذخیره شد', 'ok');
      // Undo
      pendingUndo = { row: item.row, oldData: Object.assign({}, item.data) };
      showUndo('ویرایش سریال ' + (item.data.serial || ''));
      setTimeout(() => { closeModal(); loadItems(); }, 500);
    } else {
      showToast('خطا: ' + (r.error || 'نامشخص'), 'err');
    }
  } catch (e) { showToast('خطا: ' + e.message, 'err'); }
  btn.disabled = false;
  btn.textContent = 'ذخیره';
}

// ============================================================
// Undo
// ============================================================
function showUndo(text) {
  const bar = document.getElementById('undoBar');
  document.getElementById('undoText').textContent = text;
  bar.classList.add('show');
  clearTimeout(bar._timer);
  bar._timer = setTimeout(() => bar.classList.remove('show'), 10000);
}
document.getElementById('undoBtn').onclick = async () => {
  if (!pendingUndo) return;
  try {
    const r = await callApi({ action: 'updatePending', category: currentCat, row: pendingUndo.row, data: pendingUndo.oldData });
    if (r.ok) { showToast('✅ بازگردانی شد', 'ok'); loadItems(); }
  } catch (e) {}
  pendingUndo = null;
  document.getElementById('undoBar').classList.remove('show');
};

async function openCopyModal() {
  const listEl = document.getElementById('copyList');

  try {
    const r = await callApi({ action: 'getRecentOrders', category: currentCat });

    if (!r.items || r.items.length === 0) { listEl.innerHTML = '<div class="empty-state">سفارشی نیست</div>'; return; }
    listEl.innerHTML = '';
    r.items.slice(0, 30).forEach(item => {
      const d = document.createElement('div');

function closeCopy() { document.getElementById('copyBackdrop').classList.remove('show'); }

function copyItemToForm(row) {
  const item = findItemByRow(row);
  if (!item) return;
  switchTab('new');
  setTimeout(() => {
    const cat = CATEGORIES[currentCat];
    cat.fields.forEach(f => {
      if (f.key === 'serial' || f.key === 'status') return;
      const el = document.getElementById('new_' + f.key);
      if (el && item.data[f.key]) {
        if (el.tagName === 'SELECT') {
          const target = String(item.data[f.key]).trim();
          for (let i = 0; i < el.options.length; i++) {
            if (el.options[i].value.trim() === target) { el.selectedIndex = i; break; }
          }
        } else if (!el.disabled) {
          el.value = item.data[f.key];
        }
      }
    });
    onProductChange('new_product');
    refreshSerial();
    showToast('📋 اطلاعات کپی شد', 'ok');
  }, 200);
}

async function loadDashboard() {
  const dash = document.getElementById('dashContent');
  dash.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  try {
    const r = await callApi({ action: 'getStats' });
    if (!r.ok) { dash.innerHTML = '<div class="empty-state">خطا: ' + r.error + '</div>'; return; }
    const s = r.stats;
    let html = `<div class="dash-grid">
      <div class="dash-card"><div class="num">${toFa(s.total)}</div><div class="lbl">کل سفارش‌ها</div></div>
      <div class="dash-card"><div class="num" style="color:var(--warning)">${toFa(s.pendingCount)}</div><div class="lbl">ناقص</div></div>
    </div>`;

    html += `<div class="dash-card wide" style="margin-bottom:12px;">
      <div style="font-weight:800;margin-bottom:10px;color:var(--accent);">دسته‌بندی</div>`;
    Object.keys(CAT_LABELS).forEach(c => {
      html += `<div class="stat-row"><span>${CAT_LABELS[c]}</span><span class="val">${toFa(s.byCategory[c] || 0)}</span></div>`;
    });
    html += `</div>`;

    html += `<div class="dash-card wide" style="margin-bottom:12px;">
      <div style="font-weight:800;margin-bottom:10px;color:var(--accent);">وضعیت‌ها</div>`;
    STATUS_LIST.forEach(st => {
      html += `<div class="stat-row"><span class="key"><span class="dot" style="background:${STATUS_COLORS[st]}"></span>${st}</span><span class="val">${toFa(s.byStatus[st] || 0)}</span></div>`;
    });
    html += `</div>`;

    html += `<div class="dash-card wide">
      <div style="font-weight:800;margin-bottom:10px;color:var(--accent);">شرکت بازرسی</div>`;
    const insp = s.byInspection || {};
    Object.keys(insp).sort().forEach(k => {
      const bg = k === 'ISQI' ? '#FFD700' : (k === 'AJG' ? '#E53935' : '#888');
      html += `<div class="stat-row"><span class="key"><span class="dot" style="background:${bg}"></span>${k}</span><span class="val">${toFa(insp[k])}</span></div>`;
    });
    if (Object.keys(insp).length === 0) html += `<div class="stat-row"><span style="color:var(--text-dim)">موردی ثبت نشده</span></div>`;
    html += `</div>`;

    dash.innerHTML = html;
  } catch (e) { dash.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}

// ============================================================
// گزارش
// ============================================================
async function loadReport() {
  const rep = document.getElementById('reportContent');
  rep.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
  try {
    const r = await callApi({ action: 'getMonthlyReport', category: currentCat });
    if (!r.ok) { rep.innerHTML = '<div class="empty-state">خطا: ' + r.error + '</div>'; return; }
    const months = r.months || {};
    const monthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    let maxV = 0;
    for (let i = 1; i <= 12; i++) if ((months[i] || {}).total > maxV) maxV = months[i].total;

    let html = `<div style="font-weight:800;margin-bottom:8px;color:var(--accent);font-size:15px;">تولید ماهانه سال ${currentYear}</div>`;
    html += `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">مجموع: ${toFa(Object.values(months).reduce((a,b) => a + (b.total||0), 0))} دستگاه</div>`;
    html += `<div class="bar-chart">`;
    for (let i = 1; i <= 12; i++) {
      const t = (months[i] || {}).total || 0;
      const h = maxV > 0 ? Math.round((t / maxV) * 150) : 0;
      html += `<div class="bar-col">
        <div class="bar" style="height:${Math.max(h, 3)}px;" data-val="${t}"></div>
        <div class="bar-label">${monthNames[i-1].slice(0,3)}</div>
      </div>`;
    }
    html += `</div>`;

    // تفکیک دسته‌ها
    html += `<div style="margin-top:20px;font-weight:800;margin-bottom:8px;color:var(--accent);">تفکیک دسته‌ها</div>`;
    Object.keys(CAT_LABELS).forEach(c => {
      let sum = 0;
      for (let i = 1; i <= 12; i++) sum += (months[i] || {})[c] || 0;
      html += `<div class="stat-row"><span>${CAT_LABELS[c]}</span><span class="val">${toFa(sum)}</span></div>`;
    });

    rep.innerHTML = html;
  } catch (e) { rep.innerHTML = '<div class="empty-state">خطا: ' + e.message + '</div>'; }
}

// ============================================================
// خروجی CSV
// ============================================================
function exportCsv() {
  const items = getFilteredItems();
  if (items.length === 0) { showToast('چیزی برای خروجی نیست', 'err'); return; }
  const cat = CATEGORIES[currentCat];
  const headers = cat.fields.map(f => f.label);
  const rows = items.map(it => cat.fields.map(f => {
    const v = it.data[f.key];
    return '"' + String(v || '').replace(/"/g, '""') + '"';
  }).join(','));
  const csv = '\uFEFF' + headers.map(h => '"' + h + '"').join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `caspian-${currentCat}-${currentYear}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function openSettings() {
  document.getElementById('settingsUrl').value = localStorage.getItem(STORAGE_KEY) || '';
  document.getElementById('settingsMsg').className = 'msg';
  document.getElementById('settingsBackdrop').classList.add('show');
}
function closeSettings() { document.getElementById('settingsBackdrop').classList.remove('show'); }

async function saveSettings() {
  const url = document.getElementById('settingsUrl').value.trim();
  const msg = document.getElementById('settingsMsg');
  if (!url) { msg.textContent = 'لطفاً لینک را وارد کنید'; msg.className = 'msg err'; return; }
  if (url.indexOf('https://script.google.com/') !== 0) { msg.textContent = 'لینک باید با https://script.google.com/ شروع شود'; msg.className = 'msg err'; return; }
  if (url.indexOf('/exec') === -1) { msg.textContent = 'لینک باید به /exec ختم شود'; msg.className = 'msg err'; return; }
  localStorage.setItem(STORAGE_KEY, url);
  msg.textContent = 'در حال تست...'; msg.className = 'msg ok';
  try {
    const pingUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + 'action=ping';
    const res = await fetch(pingUrl, { method: 'GET' });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch (_) { msg.textContent = 'پاسخ JSON نبود'; msg.className = 'msg err'; return; }
    if (data.ok) {
      if (data.years && data.years.length > 0) availableYears = data.years;
      msg.textContent = '✅ اتصال برقرار — نسخه ' + (data.version || '?');
      msg.className = 'msg ok';
      updateConfigWarning();
      setTimeout(() => { closeSettings(); switchTab(currentTab); }, 900);
    } else {
      msg.textContent = 'خطا: ' + (data.error || 'نامشخص'); msg.className = 'msg err';
    }
  } catch (e) { msg.textContent = 'اتصال برقرار نشد: ' + e.message; msg.className = 'msg err'; }
}

// ============================================================
// Fullscreen
// ============================================================
(function(){
  function requestFS() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!fn) return Promise.reject('no API');
    if (document.fullscreenElement) return Promise.resolve();
    return fn.call(el).catch(() => {});
  }
  function exitFS() {
    if (document.exitFullscreen) return document.exitFullscreen().catch(() => {});
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
    if (document.msExitFullscreen) return document.msExitFullscreen();
    return Promise.resolve();
  }
  const btn = document.getElementById('fullscreenBtn');
  if (btn) btn.onclick = () => { if (document.fullscreenElement) exitFS(); else requestFS(); };
})();

// ============================================================
// تشخیص دستگاه + آیکون
// ============================================================
(function detectDevice() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /Android/i.test(ua);
  const brandIcon = document.getElementById('brandIcon');
  const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
  if (isIOS) {
    if (brandIcon) brandIcon.src = 'icon-ios.png';
    if (appleIcon) appleIcon.href = 'icon-ios.png';
  } else if (isAndroid) {
    if (brandIcon) brandIcon.src = 'icon-android.png';
    if (appleIcon) appleIcon.href = 'icon-android.png';
  } else {
    if (brandIcon) brandIcon.src = 'icon-512.png';
  }
  if (isAndroid || isIOS) {
    document.body.style.paddingBottom = '30px';
  }
})();

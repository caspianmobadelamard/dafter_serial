<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./order_log.html">
  <title>دفتر سریال کاسپین مبدل آمارد</title>
  <style>
    body {
      margin: 0;
      background: #131a26;
      color: #d4d8dd;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(245,158,11,0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 0.5px;
    }
    .sub {
      font-size: 12px;
      color: #8b929b;
      font-family: 'Courier New', monospace;
    }
    .link {
      color: #f59e0b;
      text-decoration: none;
      border-bottom: 1px dashed #f59e0b;
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <div class="title">⚓ دفتر سریال کاسپین مبدل آمارد</div>
    <div class="sub">در حال بارگذاری...</div>
    <div class="sub">
      اگر خودکار باز نشد،
      <a href="./order_log.html" class="link">اینجا کلیک کن</a>
    </div>
  </div>

  <script>
    // ریدایرکت فوری به برنامه اصلی
    window.location.replace('./order_log.html');
  </script>
</body>
</html>
